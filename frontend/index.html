}

/* ============================================================ 连续滚动预览
 *用户诉求：「按顺序显示全部内容，不要翻页。还是可以鼠标上下快速翻页」
 *
 * 之前是「一页一屏 + 点页码换图」，35 页要点 35 次。
 * 现在改为**整份文档连续排开**，像读长文档一样一路滚下去；
 * 同时保留「快速翻页」：滚轮/ PageUp/PageDown/方向键都能整页跳。
 *
 * 实现要点：
 *  1. 每页先按 A4 比例（1:1.414）占好位，图片到位后不跳动 ——
 *     否则懒加载时页面高度突变，滚动位置会跳，体验比翻页还糟。
 *  2. IntersectionObserver 只加载**邻近 2 页**，远处的先占位。
 *     35 页全load 会把 37MB PDF 相关的渲染请求全打出去。
 *  3. 滚轮翻页用 scrollBy 而不是换img —— 这样用户能停在
 *     「两页中间」的位置，而整页跳转时也能快速定位。
 *  4. 快捷键/按钮走 gotoPage(n) 的「滚动到该页」，与滚轮共用一条路径。
 */
const A4_RATIO = 1.414;

/** 把中栏复位成「非滚动预览」状态。
 *  柜型库/建筑图纸 tab 会覆盖 #viewer 内容，但不会自动清掉
 *  .scrollmode —— 于是切回工作台时容器还带着 padding 与
 *  smooth滚动，单页预览会莫名偏移。统一在这里收口。 */
function resetViewer() {
  const v = $('#viewer');
  v.classList.remove('scrollmode');
  v.scrollTop = 0;
  $('#bprev').style.display = 'none';
  $('#bnext').style.display = 'none';
  $('#bpage').style.display = 'none';
  $('#bhelp').style.display = 'none';
}

/** 打开一份 PDF —— 整份连续排开，不做一页一屏 */
function showPdf(jobId, pages) {
  S.curPage = 0; S.jobId = jobId; S.zoom = S.zoom || 1;
  if (!pages?.length) {
    $('#viewer').classList.remove('scrollmode');
    $('#viewer').innerHTML =
      `<div class="ph"><div class="big">${ic('file-text')}</div><div>${t('mid.ph')}</div></div>`;
    $('#pagelist').innerHTML = '';
    $('#bpage').textContent = `0 / 0`;
    return;
  }
  $('#bprev').style.display = '';
  $('#bnext').style.display = '';
  $('#bpage').style.display = '';
  renderPages(pages);
  bindScrollNav();
}

/** 单页图片 URL —— 走服务端渲染，不加载整份 PDF */
function pageUrl(n, dpi) { return `/api/page/${S.jobId}/${n}?dpi=${dpi || 110}`; }

/** 建好全部页面的占位骨架，一次性铺完（图片随后懒加载） */
function renderPages(pages) {
  S.pages = pages || [];
  const z = S.zoom || 1;
  // 内容宽度 = 中栏宽度 × 缩放。用 CSS 变量统一控制，
  // 改缩放时只需更新 --pw，所有页一起变
  const vw = $('#viewer').clientWidth || 800;
  const pw = Math.round((vw - 36) * z);
  const ph = Math.round(pw * A4_RATIO);

  const v = $('#viewer');
  v.classList.add('scrollmode');
  v.innerHTML = S.pages.map((p, i) =>
    `<div class="vpage" data-p="${i}" style="width:${pw}px;height:${ph}px">
       <div class="skel" style="height:${ph}px">${LANGNOW==='zh'?'加载中…':'Loading…'}${i + 1}</div>
       <img loading="lazy" alt="p${i + 1}" data-src="${pageUrl(i + 1)}">
       <div class="pno">${i + 1} / ${S.pages.length}</div>
     </div>`).join('');

  $('#pagelist').innerHTML = S.pages.map((p, i) =>
    `<div class="pg" data-p="${i}">${i + 1}. ${esc((p.title || '').slice(0, 14) || 'p' + (i + 1))}</div>`).join('');
  $$('#pagelist .pg').forEach(e => e.onclick = () => gotoPage(+e.dataset.p));

  observePages();
  v.scrollTop = 0;
  syncCurFromScroll();
}

/** 懒加载：进入视口 ±600px 的页才真正去取图 */
let _pgObserver = null;
function observePages() {
  if (_pgObserver) _pgObserver.disconnect();
  _pgObserver = new IntersectionObserver((es) => {
    for (const e of es) {
      if (!e.isIntersecting) continue;
      const img = e.target.querySelector('img[data-src]');
      if (!img || img.dataset.loaded) continue;
      img.dataset.loaded = '1';
      img.onload = () => {
        img.classList.add('on');
        img.parentElement.querySelector('.skel')?.classList.add('on');
      };
      img.onerror = () => {
        const s = img.parentElement.querySelector('.skel');
        if (s) s.textContent = `${LANGNOW==='zh'?'第':'Page '}${(+img.alt.slice(1))}${LANGNOW==='zh'?'页加载失败':' failed'}`;
      };
      img.src = img.dataset.src;
    }
  }, { root: $('#viewer'), rootMargin: '600px 0px' });
  $$('#viewer .vpage').forEach(n => _pgObserver.observe(n));
}

/** 滚动位置 → 当前页（页码条高亮 + 顶部计数） */
function syncCurFromScroll() {
  const v = $('#viewer');
  if (!v || !S.pages?.length) return;
  const nodes = $$('#viewer .vpage');
  // 切到柜型库/图纸 tab 后 .vpage 已被清空。此时若还照常遍历，
  // cur 会恒为 0 并把 S.curPage 写坏 —— 从 tab 切回来就再也回不到
  // 离开前那一页。DOM 不在时只更新计数，不碰状态。
  if (!nodes.length) {
    $('#bpage').textContent = `${S.curPage + 1} / ${S.pages.length}`;
    return;
  }
  const mid = v.scrollTop + v.clientHeight * 0.35;
  let cur = 0;
  nodes.forEach(n => {
    if (n.offsetTop <= mid) cur = +n.dataset.p;
  });
  S.curPage = cur;
  $('#bpage').textContent = `${cur + 1} / ${S.pages.length}`;
  $$('#pagelist .pg').forEach((e, k) => e.classList.toggle('on', k === cur));
  const p = S.pages[cur];
  const fn = [S.curFile, p?.title || p?.drawing_no].filter(Boolean).join(' — ');
  $('#mfn').textContent = fn || t('mid.none');
}

/** 滚动到指定页 —— 翻页按钮/页码条/键盘都走这里。
 *  behavior='auto' 用于切 tab 回来时的瞬时还原，不做二次平滑滚动。 */
function gotoPage(i, behavior) {
  if (!S.jobId || !S.pages?.length) return;
  const target = Math.max(0, Math.min(i, S.pages.length - 1));
  const node = $(`#viewer .vpage[data-p="${target}"]`);
  if (node) {
    $('#viewer').scrollTo({ top: node.offsetTop - 8,
                            behavior: behavior || 'smooth' });
  } else { S.curPage = target; syncCurFromScroll(); }
}

/** 相对翻页（◀ ▶ 按钮） */
function pageStep(d) { gotoPage(S.curPage + d); }

/** 重新按当前缩放重排全部页面 */
function reflowPages() {
  if (!S.pages?.length || !$('#viewer').classList.contains('scrollmode')) return;
  const keepTop = $('#viewer').scrollTop;
  renderPages(S.pages);
  //重排后按比例还原滚动位置，避免跳回开头
  requestAnimationFrame(() => { $('#viewer').scrollTop = keepTop; });
}

/** 滚动联动 + 滚轮快速翻页 —— 只绑一次。
 *
 *  用户诉求：「还是可以鼠标上下快速翻页」。
 *  连续滚动下滚轮本来就会滚，但**要滚一整屏**才能翻页，太慢。
 *  所以：Ctrl/⌘ + 滚轮 = 整页跳（细调靠裸滚轮）；
 *  PageUp/PageDown / 空格 / 方向键也整页跳。
 *  没有修饰键时保持原生连续滚动 —— 细看图纸时不能一滚就是一页。
 */
let _scrollBound = false;
function bindScrollNav() {
  const v = $('#viewer');
  if (!_scrollBound) {
    _scrollBound = true;
    let raf = 0;
    v.addEventListener('scroll', () => {
      if (raf) return;                    // 合并同一帧内的多次 scroll 事件
      raf = requestAnimationFrame(() => { raf = 0; syncCurFromScroll(); });
    }, { passive: true });
    v.addEventListener('wheel', (e) => {
      if (!(e.ctrlKey || e.metaKey)) return;// 裸滚轮= 连续滚动，不拦截
      e.preventDefault();
      pageStep(e.deltaY > 0 ? 1 : -1);
    }, { passive: false });
  }
}

function setZoom(z) {
  S.zoom = Math.max(0.4, Math.min(4, z));
  $('#bzoom').textContent = `${Math.round(S.zoom * 100)}%`;
  reflowPages();
  // 柜型图 / 图纸缩略图不是走 renderPages 的 PDF 页，只改 S.zoom
  // 对它们完全没有作用 —— 这就是用户报的「zoom in out 都没用」。
  // 用 CSS 变量统一缩放，任何 .zoomable 元素都跟着变。
  applyZoomToImages();
}

/** 把当前缩放应用到所有图片（柜型图、图纸预览等）。
 *  用 transform 而不是改 width/height —— 改布局宽高会让 flex 容器
 *  重排，拖动过程里抖动明显；transform 只做视觉缩放，跟手。 */
function applyZoomToImages() {
  const z = S.zoom || 1;
  // 中栏的柜型图（showCupImage 渲染的 #cupimg）与右栏卡片缩略图都缩放。
  // 用 transform 而非改 width/height：改布局宽高会让 flex 容器跟着
  // 重排，拖动过程里抖得厉害；transform 是纯视觉缩放，跟手。
  $$('#cupimg, #rpane .thumb img').forEach(im => {
    im.style.transform = z === 1 ? '' : `scale(${z})`;
  });
  // 放大后要能滚到四周，给承载块显式 overflow + 预留缩放余量
  $$('.cupview, .zoomslot').forEach(sl => {
    sl.style.overflow = z > 1 ? 'auto' : 'hidden';
  });
}

// ============================================================ 导出
async function loadExports(jobId) {
  try {
    const ex = await api(`/jobs/${jobId}/exports`);
    S.exports = ex;
    $('#bexp')?.remove();
    // 柜型库 tab 不显示导出栏：导的是建筑解析结果，跟当前看柜型无关，
    // 而且 5 个按钮会把中栏挤到放不下柜型图。loadJob 是在 gotoView
    // 之后跑的，所以这里必须再判一次 tab，不能只靠 syncTabsForView。
    if (S.view === 'cupboard') return;
    const bar = document.createElement('div');
    bar.id = 'bexp';
    bar.style.cssText = 'display:flex;gap:5px;flex:0 0 auto';
    bar.innerHTML = ['pdf', 'docx', 'jpg', 'xlsx', 'json'].map(k =>
      (ex[k] ? `<button class="btn ok" onclick="dlExport('${k}')">↓ ${k.toUpperCase()}</button>` : '')
    ).join('') || `<span class="muted" style="font-size:11px">${t('exp.none')}</span>`;
    $('.mid-bar').appendChild(bar);
  } catch (e) {}
}
function dlExport(k) {
  const p = S.exports?.[k];
  if (!p) return;
  window.open('/api/download?path=' + encodeURIComponent(p), '_blank');
}

// ============================================================ 上传解析
function openUpload(kind) {
  const cfg = {
    building: { t: t('up.bld'), accept: '.pdf,.docx,.jpg,.jpeg,.png,.dwg,.dxf',
      d: t('up.bldd') },
    cupboard: { t: t('up.cup'), accept: '.dwg,.dxf,.pdf',
      d: t('up.cupd') },
  }[kind];
  modal(`<h2>${esc(cfg.t)}<span class="x" onclick="closeModal()">×</span></h2>
    <div class="mbody">
      <div class="alert info">${esc(cfg.d)}</div>
      <div class="drop" id="dz">
        <div class="big"><svg class="ic" aria-hidden="true"><use href="#i-upload"></use></svg></div>
        <div><b>${t('up.pick')}</b> ${t('up.drag')}</div>
        <div class="muted" style="font-size:11px;margin-top:4px">${esc(cfg.accept)}</div>
      </div>
      <input type="file" id="fi" style="display:none" accept="${cfg.accept}">
      <div id="upbox"></div>
      <div id="preview"></div>
      <div id="prog" style="display:none">
        <div style="display:flex;justify-content:space-between;font-size:11.5px;margin-bottom:5px">
          <span id="pm">${t('up.parsing')}</span><span id="pe" class="muted"></span>
        </div>
        <div class="bar" style="height:8px">
          <i id="pb" style="width:0%;background:var(--accent)"></i>
        </div>
        <div class="muted" style="font-size:11px;margin-top:6px">${t('up.hint')}</div>
      </div>
      <!-- 图库独立滚动区：滚动条只出现在这里，标题栏和底部按钮始终可见 -->
      <div id="rendbox"></div>
    </div>
    <div class="mfoot">
      <button class="btn" id="bcancel">${t('up.cancel')}</button>
      <button class="btn pri" id="bgo" disabled>${t('up.go')}</button>
    </div>`, 'split');
  const dz = $('#dz'), fi = $('#fi');
  dz.onclick = () => fi.click();
  dz.ondragover = e => { e.preventDefault(); dz.classList.add('hot'); };
  dz.ondragleave = () => dz.classList.remove('hot');
  dz.ondrop = e => { e.preventDefault(); dz.classList.remove('hot'); if (e.dataTransfer.files[0]) doFile(e.dataTransfer.files[0], kind); };
  fi.onchange = () => fi.files[0] && doFile(fi.files[0], kind);
  S.uploadKind = kind;
  // 【bug 修复】submitUpload 此前从未被绑定 —— 按钮点了没反应。
  // 这里显式绑定，并复位按钮文案（showDwgResult/renderCupboards 改过它）。
  S.dupList = []; S.dupMode = 'add'; S.dupMap = new Map();
  S.renders = []; S.selBlocks = [];
  $('#rendbox') && ($('#rendbox').innerHTML = '');
  setCommitState('pick');
  $('#bcancel').onclick = closeModal;
}

async function doFile(f, kind) {
  S.uploadFile = f; S.uploadKind = kind;
  // 选了新文件 → 状态回到「可点解析」。上一次渲染的重复提示要清掉，
  // 否则会拿着上一份 DWG 的 S.dupList 误导用户。
  S.dupList = []; S.dupMode = 'add'; S.dupMap = new Map();
  S.renders = []; S.selBlocks = [];
  const rb = $('#rendbox'); if (rb) rb.innerHTML = '';
  const btn = $('#bgo');
  btn.disabled = false;
  btn.onclick = submitUpload;      // 防御：确保任何路径下都可点
  btn.textContent = t('up.go');
  // 本地预览
  const box = $('#preview');
  if (f.type.startsWith('image/')) {
    box.innerHTML = `<div class="alert info">${t('up.imgprev')}</div><img src="${URL.createObjectURL(f)}" style="max-width:100%;border-radius:6px">`;
  } else {
    box.innerHTML = `<div class="alert info">${t('up.picked')} <b>${esc(f.name)}</b>（${(f.size / 1024 / 1024).toFixed(2)} MB）。${t('up.clickgo')}</div>`;
  }
  $('#upbox').innerHTML = `<div class="flist"><div class="f"><span class="n">${esc(f.name)}</span>
    <span class="badge">${(f.size / 1024 / 1024).toFixed(2)} MB</span></div></div>`;
}

async function submitUpload() {
  if (!S.uploadFile || S.parsing) return;
  S.parsing = true;                       // 期间禁止关闭弹窗
  setCommitState('parsing');
  $('#bcancel').disabled = true;
  // 大文件解析要十几秒以上（实测 37MB/35页 = 18.5 秒），
  // 没有进度条用户会以为卡死并去点关闭 —— 于是「点一下就跳出去」
  const mb = S.uploadFile.size / 1024 / 1024;
  $('#prog').style.display = 'block';
  $('#pm').textContent = t('up.parsing');
  $('#pe').textContent = `${mb.toFixed(1)} MB`;
  let fake = 8;
  const t0 = Date.now();
  // 假进度：真实进度需要后端配合SSE/轮询，这里先给一个不会卡死的递增指示
  const timer = setInterval(() => {
    fake = Math.min(92, fake + Math.max(1, (95 - fake) / 8));
    $('#pb').style.width = fake + '%';
    $('#pe').textContent = `${mb.toFixed(1)} MB · ${Math.round((Date.now() - t0) / 1000)}s`;
  }, 700);

  const fd = new FormData();
  fd.append('file', S.uploadFile);
  fd.append('project', document.querySelector('#pname')?.value || '74 KEELER ST CARLINGFORD');
  try {
    const r = await api(`/parse?kind=${S.uploadKind}`, { method: 'POST', body: fd });
    clearInterval(timer);
    $('#pb').style.width = '100%';
    $('#pm').textContent = t('up.done');
    if (r.kind === 'dwg') {
      showDwgResult(r);
      // 解析完立刻渲染柜型图纸 —— 用户要求「读取 DWG 后把不同柜型导出成 JPG」。
      // 这步要等渲染完才允许关闭，否则用户会以为卡死。
      await renderCupboards(r.stored_name);
    } else showPdfResult(r);
    // 解析已完成，允许关闭
    S.parsing = false;
    $('#bcancel').disabled = false;
  } catch (e) {
    clearInterval(timer);
    $('#prog').style.display = 'none';
    S.parsing = false;                   // 失败才允许关闭，否则用户被困住
    $('#bcancel').disabled = false;
    setCommitState('pick');
    $('#bgo').onclick = submitUpload;
    toast(t('up.parsefail') + ': ' + e.message, 'err');
  }
}

function showDwgResult(r) {
  S.dwgRes = r;
  // 解析成功了，但**柜型图还没渲染完** —— 此时「确认入库」必须保持灰色。
  // 用户诉求：「在渲染的时候，这个确认的按钮不能点击，需要灰掉，
  // 等渲染好了，再可以点击」。之前这里直接 btn.disabled = !r.ok，
  // 于是解析一完成按钮就亮了，用户在渲染没结束时点下去，
  // commitDwg 拿到的 S.renders 是空的 → 入库 0 个柜型。
  const btn = $('#bgo');
  if (btn) {
    btn.disabled = true;
    btn.innerHTML = `${ic('refresh')} ${t('up.rendering')}`;
    btn.onclick = null;
  }

  // 完整性分级：corrupt 必须显式红色警示，不能与 degraded/ok 混为一谈
  const integrityMap = {
    ok:       { cls: 'ok',   label: t('dwg.iok') },
    degraded: { cls: 'warn', label: t('dwg.ideg') },
    corrupt:  { cls: 'err',  label: t('dwg.icor') },
  };
  const ig = integrityMap[r.integrity] || { cls: '', label: r.integrity || t('dwg.un') };

  // r.blocks 是字符串数组，r.block_layers / r.block_entity_counts 是对照表
  const blocks = r.blocks || [];
  const bl = r.block_layers || {};
  const bc = r.block_entity_counts || {};
  const mspTotal = Object.values(r.entity_counts || {}).reduce((a, b) => a + b, 0);
  const blkTotal = Object.values(bc).reduce((a, b) => a + b, 0);

  $('#preview').innerHTML = `
    <div class="alert ${ig.cls}">
      ${t('dwg.backend')}: <b>${esc(r.backend)}</b>｜${t('dwg.integ')}: <b>${esc(ig.label)}</b>
      ${r.error ? '<br/>' + esc(r.error) : ''}
    </div>
    <div class="kpis">
      <div class="kpi"><div class="v">${(r.layers || []).length}</div><div class="l">${t('dwg.layer')}</div></div>
      <div class="kpi p"><div class="v">${blocks.length}</div><div class="l">${t('dwg.block')}</div></div>
      <div class="kpi g"><div class="v">${mspTotal + blkTotal}</div><div class="l">${t('dwg.entity')}</div></div>
      <div class="kpi ${r.integrity === 'corrupt' ? 'r' : 'o'}"><div class="v">${(r.warnings || []).length}</div><div class="l">${t('dwg.warn')}</div></div>
    </div>
    ${(r.integrity_notes || []).map(n => `<div class="alert ${r.integrity === 'corrupt' ? 'err' : 'warn'}">${esc(n)}</div>`).join('')}`;
}

/** 渲染完成后把缩略图贴进确认弹窗 —— 用户要先看到图再决定要不要入库。
 *
 *  用户诉求：「不应该只是左侧的类型树状结构，预览一下」
 *  → 每张卡片带复选框，可以只勾选需要的柜型入库，
 *    并且默认全选（他也可以全不勾就取消入库）。
 *  用户诉求：「里面的不需要的数据，我需要可以删除」
 *  → 勾选状态 S.selBlocks 驱动 commitDwg 只提交勾中的。 */
function paintRenders() {
  const box = $('#rendbox');
  if (!box) return;
  const rs = (S.renders || []).filter(r => r.ok);
  if (!rs.length) {
    const all = S.renders || [];
    box.innerHTML = `<div class="alert err">${esc((all[0] || {}).error || t('lib.noimg'))}</div>`;
    return;
  }
  // 默认全选 —— 但只针对**判定为柜型**的那些（renders 已过滤）
  if (!S.selBlocks || S.selBlocks.length !== rs.length) {
    S.selBlocks = rs.map(r => r.block_name);
  }
  const sel = new Set(S.selBlocks);
  const det = S.detected || {};
  // 顶部计数与操作条放在滚动区**外面**，永远可见；
  // 只有下面这23 张图所在的 .gallery 才有滚动条。
  let h = `<div class="sec" style="padding-left:0">${t('lib.title')} · ${rs.length}/${t('lib.picked')}</div>`;
  // 识别摘要 —— 解释「一整张图纸里为什么只切出这几个柜型」
  if (det.rejected !== undefined) {
    h += `<div class="alert ok">
      ${LANGNOW==='zh'?'已识别柜型':'Cupboards detected'}: <b>${det.detected ?? rs.length}</b> ·
      ${LANGNOW==='zh'?'已排除非柜体区域':'non-cupboard regions filtered'}: <b>${det.rejected}</b>
      ${det.sample ? `<br/><span style="font-size:12px;opacity:.85">${esc(det.sample)}</span>` : ''}
    </div>`;
  }
  // 重复检测结果（用户诉求：库里已有相同的图要提示）
  if (S.dupList && S.dupList.length) {
    h += `<div class="alert warn" id="dupbox">
      ${ic('copy')} ${LANGNOW==='zh'
        ? `<b>${S.dupList.length}</b> 个柜型在柜型库里已存在相同尺寸的记录`
        : `<b>${S.dupList.length}</b> cupboards already exist in the library with the same size`}
      <div style="margin-top:7px;display:flex;gap:8px;flex-wrap:wrap">
        <button class="btn" id="dupReplace">${ic('refresh')} ${
          LANGNOW==='zh'?'全部替换（用新图覆盖旧图）':'Replace all'}</button>
        <button class="btn" id="dupSkip">${LANGNOW==='zh'
          ?'跳过重复（保留旧图，只新增其余柜型）':'Skip duplicates'}</button>
        <button class="btn" id="dupAbort">${ic('x')} ${LANGNOW==='zh'
          ?'放弃本次入库':'Abort import'}</button>
      </div>
      <div class="muted" style="font-size:11px;margin-top:6px">${
        esc(S.dupList.map(d => d.code).join('、'))}</div>
    </div>`;
  }
  h += `<div class="rendops">
      <label><input type="checkbox" id="selall" ${sel.size === rs.length ? 'checked' : ''}> ${t('lib.selall')}</label>
      <span class="muted" id="selcnt">${sel.size} / ${rs.length}</span>
      <button class="btn" id="selnone">${t('lib.selnone')}</button>
    </div><div class="gallery"><div class="cupgrid" style="padding-left:0">`;
  // 柜型尺寸/套数明细 —— 后端返回 cupboards 时按柜型展示，
  // 没有就退回旧的「实体数 × 尺寸」写法。
  const cupByCode = new Map((S.cupboards || []).map(c => [c.code, c]));
  for (const r of rs) {
    const on = sel.has(r.block_name);
    const c = cupByCode.get(r.block_name);
    const meta = c
      ? `<div class="dim">${LANGNOW==='zh'
          ? `${c.positions_total} ${t('lib.units')}${c.grid_aspect ? ' · ' + c.grid_aspect : ''}`
          : `${c.positions_total} units${c.grid_aspect ? ' · ' + c.grid_aspect : ''}`}
          ${c.gas_count}/${c.water_count} · ${fmtMM(c.w)} × ${fmtMM(c.h)} mm</div>`
      : `<div class="dim">${r.entity_count} ${t('dwg.entity')} · ${r.width_mm ?? '—'} × ${r.height_mm ?? '—'} mm</div>`;
    h += `<div class="cupcard has-img${on ? ' on' : ''}" data-sel="${esc(r.block_name)}">
        <div class="thumb"><img loading="lazy" src="/api/thumbs/${esc(r.image_name)}"
             alt="${esc(r.block_name)}"><span class="tick">${on ? '✓' : ''}</span></div>
        <div class="meta"><div class="code mono">${esc(r.block_name)}</div>${meta}</div></div>`;
  }
  h += '</div></div>';   // /.cupgrid + /.gallery

  // 被排除的非柜体区域 —— 折叠起来，让用户能核对而不是被噪声淹没
  if ((S.rejected || []).length) {
    h += `<details class="rejd"><summary>${
      LANGNOW==='zh'
      ? `已排除 ${S.rejected.length} 个非柜体区域（点击查看）`
      : `${S.rejected.length} non-cupboard regions filtered (click)`}</summary>`
      + `<div class="rejlist">${S.rejected.slice(0, 80).map(x =>
          `<div><code>${x.w ?? ''}${x.h ? '×' + x.h + 'mm' : ''}</code><span>${esc(x.reason || '')}</span></div>`
        ).join('')}</div></details>`;
  }
  box.innerHTML = h;

  // 勾选交互
  const cards = $$('#rendbox .cupcard');
  const sync = () => {
    S.selBlocks = cards.filter(c => c.classList.contains('on')).map(c => c.dataset.sel);
    const c = $('#selcnt'); if (c) c.textContent = `${S.selBlocks.length} / ${cards.length}`;
    const a = $('#selall'); if (a) a.checked = S.selBlocks.length === cards.length;
  };
  cards.forEach(n => n.onclick = () => { n.classList.toggle('on'); sync(); });
  const all = $('#selall');
  if (all) all.onchange = () => cards.forEach(c => c.classList.toggle('on', all.checked));
  const none = $('#selnone');
  if (none) none.onclick = () => { cards.forEach(c => c.classList.remove('on')); sync(); };

  // 重复处理三选一（用户诉求 #E）
  bindDupActions();
}

/** 库里已有相同柜型时的三选一：替换 / 跳过 / 放弃入库。
 *
 *  「相同」的判定口径与后端 :func:`find_duplicates` 一致：
 *  宽、高、套数三者全等（容差 1mm / 0套）。渲染出的图已经裁掉白边，
 *  尺寸一致就意味着是同一个柜型。
 *
 *  - replace：把新图绑到已有变体上（update_existing）
 *  - skip：只入库不重复的那些
 *  - abort：整个入库取消，柜型库保持原样
 */
function bindDupActions() {
  const box = $('#dupbox');
  if (!box) return;
  const mode = (m) => {
    S.dupMode = m;
    box.className = 'alert ' + (m === 'abort' ? 'err' : m === 'skip' ? 'info' : 'warn');
    const b = $('#bgo');
    // abort 状态下「确认入库」不可点，强制用户先做选择
    if (b && m === 'abort') { b.disabled = true; }
    toast(LANGNOW === 'zh'
      ? { replace: '将替换库中已有的同尺寸柜型图',
          skip: '将跳过重复柜型，只新增其余柜型',
          abort: '已选择放弃入库，点「取消」关闭弹窗' }[m]
      : m, 'ok');
  };
  $('#dupReplace')?.addEventListener('click', () => mode('replace'));
  $('#dupSkip')?.addEventListener('click', () => mode('skip'));
  $('#dupAbort')?.addEventListener('click', () => mode('abort'));
  // 默认动作：不替换也不跳过（新增一份），但明确提示用户
  S.dupMode = S.dupMode || 'add';
}

async function showPdfResult(r) {
  S.job = {
    summary: r.summary, floors: r.floor_summary || r.multi_signals?.floor_summary || [],
    units: r.units || [], multi_signals: r.multi_signals,
    diagnostics: r.diagnostics, warnings: r.warnings || [],
    cross_validation: r.cross_validation || r.multi_signals?.cross_validation || {},
    rule_desc: r.rule_desc || {},
    config_version: r.config_version,
  };
  S.curFile = S.uploadFile.name;
  S.curBuilding = r.building_id;
  $('#preview').innerHTML = `<div class="alert ok">
    <b>${LANGNOW==='zh'?'解析完成':'Parse complete'}</b>｜${t('kpi.units')} ${r.summary.total_units} + CO-LIVING ${r.summary.communal_units}
    ｜${LANGNOW==='zh'?'平均置信度':'avg confidence'} ${r.summary.avg_confidence}<br>
    ${t('cv.title')}: ${esc(S.job.cross_validation.verdict || 'n/a')}, ${t('cv.rate')} ${S.job.cross_validation.consistency ?? '—'}
  </div>`;
  // 先解锁再关闭 —— closeModal 在S.parsing 时会拒绝执行
  S.parsing = false;
  $('#mask').classList.remove('on');
  // 解析完自动回到工作台看结果（保持在建筑图纸 tab 会让人以为没生效）
  gotoView('work');
  await loadTree();
  await loadJob(r.job_id);
  showPdf(r.job_id, r.pages || []);
  renderPane();
  toast(`${t('up.done')} · ${t('kpi.units')} ${r.summary.total_units}`, 'ok');
}

/** 解析完 DWG 后渲染每个柜型 block 成 JPG。
 *  需求：「读取了 dwg 文件，将里面的不同的柜型都导出成 jpg 格式，
 *  放在 library 里，可以点击查看」。渲染结果存S.renders，
 *  用户确认入库时一并回传，图片路径才会绑到变体上。 */
async function renderCupboards(storedName) {
  if (!storedName) return [];
  // 渲染期间按钮保持灰色 —— 用户诉求 #A。
  // 之前 showDwgResult 一解析完就把按钮点亮，用户在渲染未完成时点下去，
  // commitDwg 拿到空 S.renders，入库 0 个柜型还不报错。
  setCommitState('rendering');
  // 上部的拖拽区/文件摘要/PDF 预览此刻已无意义，收起它们把高度让给图库。
  $('.modal.split .mbody')?.classList.add('busy');
  try {
    $('#pm').textContent = t('lib.rendering');
    const r = await api('/cupboards/render', {
      method: 'POST', headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ file: storedName }),
    });
    S.renders = r.items || [];
    S.storedName = storedName;
    // 柜型识别明细 —— 后端已从「block 名打分」改成「几何分解」，
    // 响应字段也跟着换了：
    //   detected / rejected / rejected_items （旧，按 block 打分）
    // → cupboards / discarded / diag（按柜体几何）
    // 这里做一次兼容，两个字段名都收，老后端也不会把界面搞空。
    const cupboards = r.cupboards || null;
    const discarded = r.discarded || r.rejected_items || [];
    S.detected = cupboards
      ? { detected: (cupboards).length, rejected: (discarded).length,
          sample: discarded.slice(0, 3).map(
            x => `${fmtMM(x.w)}×${fmtMM(x.h)}mm —— ${x.reason}`).join(' / ') }
      : { detected: r.detected, rejected: r.rejected,
          sample: (r.rejected_items || []).slice(0, 3).map(
            x => `${x.block_name} —— ${x.reason}`).join(' / ') };
    S.rejected = discarded;
    S.cupboards = cupboards || [];
    S.diag = r.diag || null;
    const totalUnits = S.cupboards.reduce(
      (a, c) => a + (c.positions_total || 0), 0);
    $('#pm').textContent = cupboards
      ? `${t('lib.rendered')} ${r.rendered}/${t('lib.of')} ${S.cupboards.length}`
        + (totalUnits ? ` · ${LANGNOW==='zh'?'总套数':'units'} ${totalUnits}` : '')
      : `${t('lib.rendered')} ${r.rendered}/${t('lib.of')} ${r.detected ?? r.rendered}`;
    // 重复检测（用户诉求 #E）：跟柜型库里已有的变体比对尺寸+套数。
    await detectDuplicates();
    paintRenders();
    // 渲染完成才放开按钮
    setCommitState(S.dupMode === 'abort' ? 'abort' : 'ready');
    return S.renders;
  } catch (e) {
    S.renders = [];
    // 渲染失败：按钮保持灰色并标成「不可入库」，
    // 否则用户会点一个必然失败的按钮（诉求 #A）
    setCommitState('fail');
    // 收起区块是为了给图库腾高度；失败后图库是空的，把区块放回去，
    // 否则用户只看到一个空弹窗，不知道还能重新选文件。
    $('.modal.split .mbody')?.classList.remove('busy');
    $('#prog').style.display = 'none';
    toast(t('lib.rendering') + ' → ' + e.message, 'err');
    return [];
  }
}

/** 把渲染结果整成入库要提交的 variants。
 *  以block 为单位生成变体：尺寸全部用 DWG 实测值，不再填占位数字。 */
/** 把渲染结果整成入库要提交的 variants。
 *
 *  套数与排布必须取后端解析出的**真实几何**（`S.cupboards`），
 *  不能在这里估。
 *
 *  旧实现按 `entity_count / 8` 反推行数、`rows` 恒写 1，
 *  于是入库的柜型全是「1 行 N 列」，套数也是空的 ——
 *  左树没法按「5 Units / 6 Units」分组，整条链路就断了。
 */
/** 「确认入库」按钮的三态。
 *
 *  用户诉求 #A：「在渲染的时候，这个确认的按钮不能点击，需要灰掉，
 *  等渲染好了，再可以点击」。
 *
 *  - parsing   解析中：灰 + 转圈
 *  - rendering 解析完了但柜型图还没渲完：灰 + 「渲染中…」
 *  - ready     渲染完成：可点
 *  - abort     用户在重复提示里选了「放弃入库」：保持灰，直到改选
 *  - fail      渲染失败：灰 + 「不可入库」
 */
function setCommitState(state) {
  const b = $('#bgo');
  if (!b) return;
  const map = {
    parsing:   [`<span class="spin"></span> ${t('up.parsing')}`, true],
    rendering: [`${ic('refresh')} ${t('up.rendering')}`, true],
    ready:     [t('up.commit'), false],
    abort:     [`${ic('x')} ${LANGNOW === 'zh' ? '已放弃入库' : 'Import aborted'}`, true],
    fail:      [t('up.nogo'), true],
    pick:      [t('up.go'), true],
  };
  const [label, dis] = map[state] || map.pick;
  b.innerHTML = label;
  b.disabled = dis;
  if (!dis) b.onclick = () => commitDwg();
}

/** 检测本次要入库的柜型里，哪些在柜型库中已存在（用户诉求 #E）。
 *
 *  判定口径必须与后端一致（宽±1mm、高±1mm、套数相等），
 *  否则前端提示「已存在」而真入库时后端又新建一条。
 *  放在前端做是为了**立刻**弹提示；后端仍会再校验一次兜底。
 */
async function detectDuplicates() {
  S.dupList = [];
  S.dupMode = 'add';
  S.dupMap = new Map();
  try {
    const mine = dwgVariantsFromRenders((S.renders || []).filter(r => r.ok));
    if (!mine.length) return;
    const pool = (S.variants || []).filter(v => v.source === 'dwg');
    for (const v of mine) {
      const hit = pool.find(x =>
        Math.abs(Number(x.w) - Number(v.w)) <= 1 &&
        Math.abs(Number(x.h) - Number(v.h)) <= 1 &&
        Number(x.positions || 0) === Number(v.positions || 0));
      if (hit) {
        S.dupList.push({ code: v.code, id: hit.id, w: v.w, h: v.h,
                         positions: v.positions, old: hit.code });
        S.dupMap.set(v.code, hit.id);
      }
    }
  } catch (e) { /* 检测失败不阻塞入库流程 */ }
}

function dwgVariantsFromRenders(renders) {
  // code ->柜体几何明细
  const geo = new Map((S.cupboards || []).map(c => [c.code, c]));
  return (renders || []).filter(r => r.ok).map(r => {
    const c = geo.get(r.block_name);
    return {
      code: r.block_name,
      block_name: r.block_name,
      // 套数：优先后端解析值；退化时从 code（CP-6p-09）里解析。
      // 注意 `??` 与 `||` 不能直接混用，Number(...) 外面必须加括号。
      positions: c?.positions_total
        ?? (Number((String(r.block_name).match(/CP-(\d+)p/) || [])[1]) || null),
      rows: c?.layout_rows ?? 1,
      cols: c?.layout_cols ?? 1,
      grid: c?.grid_aspect || null,
      gas_count: c?.gas_count ?? null,
      water_count: c?.water_count ?? null,
      w: c?.w ?? r.width_mm ?? null,
      h: c?.h ?? r.height_mm ?? null,
      meter_combo: r.block_name,
      description: (c?.notes?.length ? c.notes.slice(0, 4).join(' / ')
        : (r.texts || []).slice(0, 4).join(' / ')) || null,
    };
  });
}

async function commitDwg() {
  try {
    // 用户在重复提示里选了「放弃入库」——直接关弹窗，不动柜型库
    if (S.dupMode === 'abort') {
      closeModal();
      toast(LANGNOW === 'zh' ? '已放弃本次入库，柜型库未改动'
                            : 'Import aborted, library unchanged', 'ok');
      return;
    }
    // 只提交**勾选**的柜型 —— 用户可以在预览里逐个勾，
    // 也可以一键全不勾直接放弃入库。
    const sel = new Set(S.selBlocks || []);
    const hasSel = S.selBlocks && S.selBlocks.length;
    const dupCodes = new Set((S.dupList || []).map(d => d.code));
    let renders = (S.renders || []).filter(r =>
      r.ok && (!hasSel || sel.has(r.block_name)));
    // 「跳过重复」：把重复的柜型从提交列表里剔掉
    if (S.dupMode === 'skip') {
      renders = renders.filter(r => !dupCodes.has(r.block_name));
    }
    // 「替换」：把已有变体 id 带上，走后端的 update_existing 分支
    let variants = dwgVariantsFromRenders(renders);
    if (S.dupMode === 'replace') {
      variants = variants.map(v => {
        const id = S.dupMap?.get(v.code);
        return id ? { ...v, replace_id: Number(id) } : v;
      });
    }
    if (!variants.length) {
      toast(t('lib.nosel'), 'err');
      return;
    }
    const r = await api('/cupboards/from-dwg', {
      method: 'POST', headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({
        source_file: S.storedName || (S.dwgRes && S.dwgRes.source_file) || '',
        // 根节点显示名 = DWG 文件名（去掉路径和扩展名）
        source_name: (S.storedName || S.dwgRes?.source_file || 'DWG')
          .split('/').pop().replace(/\.dwg$/i, '').replace(/\.dxf$/i, ''),
        cupboard_name: '柜型库（' + (S.storedName || 'DWG') + '）',
        variants,
        renders,
        // 重复处理策略：add（默认新增）/ replace（替换旧图）/ skip（跳过）
        dup_mode: S.dupMode || 'add',
      }),
    });
    const dupNote = S.dupMode === 'replace' && r.replaced
      ? ` · ${LANGNOW === 'zh' ? '替换' : 'replaced'} ${r.replaced}` : '';
    const skipNote = S.dupMode === 'skip' && S.dupList?.length
      ? ` · ${LANGNOW === 'zh' ? '跳过重复' : 'skipped'} ${S.dupList.length}` : '';
    toast(`${t('up.ok')} ${r.created}${dupNote}${skipNote}`, 'ok');
    closeModal();
    await loadVariants();
    // 直接跳到柜型库并打开第一组，让用户立刻看到图
    gotoView('cupboard');
    const g = S.variants[0];
    if (g) {
      const first = S.variants.find(v => v.image_url);
      if (first) showVariantGroup(first.bucket || ('p' + first.positions));
      else renderHub();
    } else renderHub();
  } catch (e) { toast(t('up.fail') + ': ' + e.message, 'err'); }
}

// ============================================================ 绑定
/** 三个 tab 各自独立：**每个 tab 有自己的树、自己的主区域、自己的上传入口。
    用户原话：切到柜型库还是显示楼栋的内容 —— 根因是以前只换右栏 #rpane，
    左侧树和中栏始终是楼栋的。现在按view 整体切换。 */
function renderHub() {
  const isCup = S.view === 'cupboard';
  // 两个 hub tab 都不是楼栋预览视图，先把工作台的连续滚动状态收掉。
  // 放函数开头统一做，避免只补了 isCup 分支漏掉 building。
  resetViewer();

  if (isCup) {
    // 柜型库：中栏不该再预览楼栋图纸，改为展示分组说明
    $('#mfn').textContent = t('tree.library');
    $('#pagelist').innerHTML = '';
    $('#viewer').innerHTML = `<div class="ph"><div class="big">${ic('image-off')}</div>
      <div>${t('mid.cup.hint')}</div></div>`;
    $('#bparse').style.display = 'none';
  }

  let h = '';
  if (isCup) {
    const groups = variantGroups();
    const nAll = S.variants.length;
    const nImg = S.variants.filter(v => v.image_url).length;
    h += `<div class="sec" style="padding-left:0">${t('tree.library')}</div>`;
    if (!groups.length) {
      h += `<div class="empty"><div class="big">${ic('image-off')}</div><b>${t('dwg.empty')}</b></div>`;
    } else {
      // 批量管理工具条 —— 用户诉求：「里面不需要的数据，我需要可以删除」
      h += `<div class="mgmt">
        <span class="muted">${nAll} ${t('mtx.kind')}${nImg ? ' · ' + nImg + ' ' + t('lib.img') : ''}</span>
        <span class="sp"></span>
        <button class="btn sm" id="mginv">${t('lib.mginv')}</button>
        <button class="btn sm danger" id="mgclear">${t('lib.clear')}</button>
      </div>`;
      h += '<div class="filelist">';
      for (const g of groups) {
        h += `<div class="row-item" data-vg="${esc(g.key)}">
          <div class="ico">${ic('grid')}</div>
          <div class="nm"><div class="t">${esc(g.title)}</div>
            <div class="s">${g.count} ${t('mtx.kind')}</div></div>
          <span class="badge">${t('bld.open')} ›</span></div>`;
      }
      h += '</div>';
    }
  } else {
    h += `<div class="sec" style="padding-left:0">${t('tree.projects')}</div>`;
    if (!S.projects.length) {
      h += `<div class="empty"><div class="big">${ic('folder')}</div><b>${t('bld.empty')}</b></div>`;
    } else {
      h += '<div class="filelist">';
      for (const p of S.projects) {
        const d = (p.drawings || [])[0];
        h += `<div class="row-item" data-b="${p.id}">
          <div class="ico">${ic('folder')}</div>
          <div class="nm"><div class="t">${esc(p.name)}</div>
            <div class="s">${(p.drawings || []).length} ${t('bld.count')}${d?.title ? ' · ' + esc(d.title) : ''}</div></div>
          <span class="badge">${t('bld.open')} ›</span></div>`;
      }
      h += '</div>';
    }
  }
  $('#rpane').innerHTML = h;
  $$('#rpane .row-item').forEach(n => n.onclick = () => {
    if (n.dataset.vg) { showVariantGroup(n.dataset.vg); return; }
    // 打开项目：回到工作台视图并加载该 building 的解析结果
    gotoView('work');
    S.curBuilding = +n.dataset.b; S.treeSel = 'floors';
    renderTree();
    (async () => {
      try {
        const jobs = await api('/jobs?limit=30');
        const j = jobs.find(x => (x.building_id ?? null) === S.curBuilding) || jobs[0];
        if (j) { await loadJob(j.id); showPdf(j.id, S.pages?.length ? S.pages : []); }
        else renderPane();
      } catch (e) { renderPane(); }
    })();
  });
  bindLibraryManage();
}

/** 柜型库批量管理：反向选择（批量删）+ 清空 DWG 解析结果。
 *
 *  用户诉求原文：「没有删除功能，里面的不需要的数据，我需要可以删除」。
 *  两个入口：
 *    · 卡片右上角 ×—— 删单个（见 bindCupDelete）
 *    · 这里的「反向选择 / 清空」—— 一次处理几十个，
 *      否则逐张点 × 在 141 个变体上根本没法用。
 */
function bindLibraryManage() {
  const inv = $('#mginv');
  if (inv) inv.onclick = async () => {
    const ids = S.variants.map(v => v.id);
    if (!ids.length) { toast(t('lib.empty'), 'err'); return; }
    const excluded = new Set((S.selBlocks || []).map(String));
    // 「反向选择」= 排除勾选/带图的，删掉其余 —— 语义写清楚，
    // 不能让用户猜「反向」到底是取反还是取补
    const del = S.variants.filter(v => !excluded.has(String(v.code)))
                          .map(v => v.id);
    if (!del.length) { toast(t('lib.nosel'), 'err'); return; }
    if (!confirm((LANGNOW === 'zh'
      ? `将删除 ${del.length} 个柜型（保留 ${excluded.size} 个已勾选/带图的）。\n确定继续？`
      : `Delete ${del.length} cupboards (keep ${excluded.size})?`))) return;
    try {
      const r = await api('/variants/delete', {
        method: 'POST', headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ ids: del }),
      });
      toast(`${t('lib.deldone')} ${r.deleted}`, 'ok');
      await loadVariants();
      gotoView('cupboard');
    } catch (e) { toast(t('lib.delfail') + ': ' + e.message, 'err'); }
  };

  const clr = $('#mgclear');
  if (clr) clr.onclick = async () => {
    const n = S.variants.filter(v => v.source === 'dwg').length;
    if (!n) { toast(t('lib.nodwg'), 'err'); return; }
    if (!confirm((LANGNOW === 'zh'
      ? `将清空 ${n} 个从 DWG 解析进来的柜型（手工录入与种子数据保留）。\n确定？`
      : `Clear ${n} DWG-derived cupboards?`))) return;
    try {
      const r = await api('/variants/clear', {
        method: 'POST', headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ only_dwg: true }),
      });
      toast(`${t('lib.deldone')} ${r.deleted}`, 'ok');
      await loadVariants();
      gotoView('cupboard');
    } catch (e) { toast(t('lib.delfail') + ': ' + e.message, 'err'); }
  };
}

/** 右栏 tab 也按 tab 切换 —— 「楼层×柜型」这类标签对柜型库毫无意义。
 *
 *  用户诉求「去掉右侧这三个 tabs」：柜型库 / 建筑图纸这两个视图里，
 *  「楼层 × 柜型 / 单元明细 / 溯源诊断」既没内容也不该占一条bar，
 *  所以整条 ``.rtabs`` 直接隐藏（不是逐个 button 隐藏 —— 那样
 *  背景色带还在，看着还是像有三个 tab）。
 */
function syncTabsForView() {
  const bar = $('.rtabs');
  // 导出栏（PDF/DOCX/JPG/XLSX/JSON）导的是**建筑图纸解析结果**，
  // 柜型库 tab 里点它毫无意义，而且 5 个按钮会把中栏挤到放不下柜型图。
  // 所以跟着右栏 tab 一起在两个 hub tab 隐藏。
  $('#bexp')?.remove();
  if (S.view === 'cupboard') {
    bar.style.display = 'none';
    $('#rpane').innerHTML = '';   // 由 renderHub 填充
    return;
  }
  if (S.view === 'building') {
    bar.style.display = 'none';
    return;
  }
  bar.style.display = '';
  //用 removeProperty 而不是 style.toggleProperty ——
  // 后者在部分浏览器上不是函数，抛TypeError 会让整个 syncTabsForView
  // 中断，gotoView 连带失败 → 切tab 后中栏还留着上一个 tab 的内容
  // （用户报的「从柜型图切到建筑图纸，还是显示柜型图的内容」）。
  $$('.rtabs button').forEach(b => {
    b.style.removeProperty('display');
    b.classList.toggle('on', b.dataset.pane === S.pane);
  });
}

/** 统一切换 tab：三个 tab 的树/ 中栏 / 右栏整体切换，避免串内容 */
function gotoView(v) {
  const prev = S.view;
  S.view = v;
  $$('nav button').forEach(x => x.classList.toggle('on', x.dataset.view === v));
  // 上传按钮只在「柜型库」「建筑图纸」两个 tab 出现 ——
  // 工作台是看解析结果的，不该摆上传入口
  $('#bup').style.display = v === 'work' ? 'none' : 'inline-block';
  // 滚动提示只在工作台的连续预览里才有意义
  $('#bhelp').style.display = v === 'work' ? '' : 'none';
  // 切 tab 时把左栏选中清掉：不同 tab 的树结构完全不同（柜型库是
  // units→model，工作台/建筑图纸是楼栋→图纸→楼层），留着上一次的
  // 高亮会让用户以为「这个 item 还选中着」。
  // 违反直觉但这是用户明确要的：切回来时自动选中第一个 item。
  if (v !== prev) S.treeSel = null;
  S.viewLast = v;
  // 楼层选中态是「建筑图纸 tab 专属」的，换 tab 必须扔掉，
  // 否则回到建筑图纸时右栏还挂着上一 tab 点的楼层内容
  if (v !== 'building') S.floorSel = null;
  syncTabsForView();
  if (v === 'work') {
    renderTree();
    // 从柜型库切回来时，renderHub() 已把 #viewer 的 DOM 换成占位提示，
    // .vpage 全没了 —— 此时 syncCurFromScroll() 里遍历不到任何节点，
    // 当前页会恒为 0，页面一片空白。必须先按S.pages 重建整条预览，
    // 再把滚动位置还原回离开前的那一页。
    if (S.jobId && S.pages?.length) {
      const back = S.curPage || 0;
      if (!document.querySelector('#viewer .vpage')) {
        renderPages(S.pages);
        requestAnimationFrame(() => gotoPage(back, 'auto'));
      } else {
        // 页面还在（建筑图纸 tab 不动中栏）—— 只同步当前页即可，
        // 直接 gotoPage 会二次平滑滚动，看着像页面自己动了一下
        syncCurFromScroll();
      }
    } else {
      $('#mfn').textContent = t('mid.none');
    }
    // renderHub/resetViewer 会把提示清掉，切回工作台要重新挂上
    $('#bhelp').style.display = S.jobId && S.pages?.length ? '' : 'none';
    renderPane();
    // 导出栏在 hub tab 里被 loadExports 跳过了（loadExports 是异步的，
    // 切回工作台时它不会自己再跑一遍），这里补一次。
    if (S.jobId && !document.querySelector('#bexp')) loadExports(S.jobId);
  } else {
    // 换tab 必须把中栏和右栏都清干净 —— 用户报的
    // 「从柜型图切换到建筑图纸，还是显示柜型图的内容」：
    // 中栏留着 #cupimg（柜型图），切过去依然在。resetViewer 清中栏，
    // renderHub 重画右栏，两者缺一不可。
    resetViewer();
    $('#rpane').innerHTML = '';
    $('#mfn').textContent = '';
    renderTree();     // 树也切：柜型库时只显示柜型分组
    renderHub();
    // 用户诉求：进入 tab 自动选中第一个 item
    autoSelectFirstInView();
  }
  saveViewState();
  applyZoomToImages();
}

$$('nav button').forEach(b => b.onclick = () => gotoView(b.dataset.view));
initColumnResize();
bindEditMenu();
$('#bup').onclick = () => openUpload(S.view === 'cupboard' ? 'cupboard' : 'building');
$('#lzh').onclick = () => { LANGNOW = 'zh'; applyI18n(); };
$('#len').onclick = () => { LANGNOW = 'en'; applyI18n(); };
$$('.rtabs button').forEach(b => b.onclick = () => { S.pane = b.dataset.pane; syncTabs(); renderPane(); });
$('#bprev').onclick = () => pageStep(-1);
$('#bnext').onclick = () => pageStep(1);
$('#bzin').onclick = () => setZoom((S.zoom || 1) * 1.25);
$('#bzout').onclick = () => setZoom((S.zoom || 1) / 1.25);
$('#bparse').onclick = () => openUpload('building');
// 点遮罩关闭 —— 但解析中closeModal 自身会拒绝，这里只拦住冒泡
$('#mask').onclick = e => { if (e.target.id === 'mask') closeModal(); };
document.addEventListener('keydown', e => {
  if (e.key === 'Escape') closeModal();
  //输入框里打字时不抢快捷键
  if (/^(INPUT|TEXTAREA|SELECT)$/.test(e.target.tagName)) return;
  const cont = S.view === 'work' && $('#viewer').classList.contains('scrollmode');
  if (!cont) return;
  // 连续滚动模式下，方向键/翻页键 = 整页跳；
  // 上下键保持浏览器原生细滚，方便看图纸局部。
  if (e.key === 'ArrowLeft' || e.key === 'PageUp') { e.preventDefault(); pageStep(-1); }
  else if (e.key === 'ArrowRight' || e.key === 'PageDown'
        || e.key === ' ') { e.preventDefault(); pageStep(1); }
  else if (e.key === 'Home') { e.preventDefault(); gotoPage(0); }
  else if (e.key === 'End') { e.preventDefault(); gotoPage(S.pages.length - 1); }
});

boot();
</script>
</body>
</html>
