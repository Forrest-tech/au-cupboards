<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>AU Cupboards — 计量柜选型系统</title>
<style>
:root{
  /* ---- 白色基调（light theme）----
     浅灰画布 + 纯白卡片 + 细分隔线，靠层次而非重色区分区块 */
  --bg:#f1f5f9; --panel:#ffffff; --panel2:#f8fafc; --line:#e2e8f0;
  --txt:#0f172a; --dim:#64748b; --accent:#2563eb; --accent2:#1d4ed8;
  --ok:#16a34a; --warn:#d97706; --err:#dc2626; --purple:#9333ea;
  /* 语义底色统一为浅色调，保证文字对比度 ≥4.5:1 */
  --ok-bg:#f0fdf4; --warn-bg:#fffbeb; --err-bg:#fef2f2; --info-bg:#eff6ff;
  --shadow:0 1px 3px #0f172a12, 0 1px 2px #0f172a0a;
  --shadow-lg:0 10px 40px #0f172a1f, 0 4px 12px #0f172a14;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{
  font:13px/1.5 -apple-system,"Segoe UI","Microsoft YaHei",sans-serif;
  background:var(--bg);color:var(--txt);overflow:hidden;
}
button{font:inherit;cursor:pointer;border:none;background:none;color:inherit}
input,select{font:inherit}

/* ---------- 顶栏 ---------- */
header{
  height:52px;display:flex;align-items:center;gap:18px;
  background:var(--panel);border-bottom:1px solid var(--line);padding:0 16px;flex-shrink:0;
}
.logo{font-weight:700;font-size:15px;color:var(--txt);letter-spacing:.3px;white-space:nowrap}
.logo span{color:var(--accent)}
nav{display:flex;gap:2px;flex:1}
nav button{
  padding:7px 14px;border-radius:6px;color:var(--dim);font-weight:500;transition:.15s;
}
nav button:hover{background:var(--panel2);color:var(--txt)}
nav button.on{background:var(--accent);color:#fff}
.hstat{font-size:11px;color:var(--dim);white-space:nowrap;display:flex;align-items:center;gap:10px}
.hstat b{color:var(--ok)}

/* 语言切换 + 顶栏上传按钮 */
.langsw{display:flex;border:1px solid var(--line);border-radius:5px;overflow:hidden;background:#fff}
.langsw button{padding:4px 9px;font-size:11px;color:var(--dim);transition:.15s}
.langsw button.on{background:var(--accent);color:#fff}
.langsw button:not(.on):hover{background:var(--panel2)}
.hupload{
  padding:6px 13px;border-radius:6px;background:var(--accent);color:#fff;
  font-size:12px;font-weight:600;transition:.15s;white-space:nowrap;
  display:inline-flex;align-items:center;gap:5px;
}
.hupload:hover{background:var(--accent2)}
.badge{
  display:inline-block;padding:2px 7px;border-radius:10px;font-size:10px;font-weight:600;
  background:var(--panel2);color:var(--dim);border:1px solid var(--line);
}
.badge.on{background:var(--ok-bg);color:var(--ok);border-color:#bbf7d0}
/* DWG 未就绪时徽章可点击，提示「点我装后端」 */
.badge.link{cursor:pointer;background:var(--warn-bg);color:var(--warn);border-color:#fde68a}
.badge.link:hover{background:#fef3c7}

/* ---- 柜型库：卡片网格 + 大图查看 ---- */
.cupgrid{
  display:grid;grid-template-columns:repeat(auto-fill,minmax(184px,1fr));
  gap:10px;padding:0 12px 14px;
}
/* 图库网格里卡片**按图片实际比例**排版，不留固定高度的空白。
   之前 .thumb 写死 height:124px + img max-height:124pxobject-fit:contain，
   于是竖长的柜型图（如 13Units 447×502）在184px 宽的格子里只占
   几十px 宽，四周全是空白 —— 用户诉求「留白太多了，需要与其他保持一致」。
   现在改成：图片按宽度铺满卡片，高度自适应；卡片高度由图片决定。 */
.cupgrid .cupcard{height:auto}
.cupgrid .cupcard .thumb{
  height:auto;min-height:0;background:#fff;padding:5px;
  align-items:flex-start;justify-content:flex-start;
}
.cupgrid .cupcard .thumb img{
  width:100%;height:auto;max-height:none;object-fit:contain;display:block;
}
.cupcard{
  border:1px solid var(--line);border-radius:8px;background:var(--panel);
  overflow:hidden;cursor:pointer;transition:border-color .12s,box-shadow .12s;
}
.cupcard:hover{border-color:var(--accent);box-shadow:var(--shadow)}
.cupcard.on{border-color:var(--accent);box-shadow:0 0 0 2px #2563eb33}
.cupcard .thumb{
  height:124px;background:var(--panel2);display:flex;
  align-items:center;justify-content:center;border-bottom:1px solid var(--line);
}
.cupcard .thumb img{max-width:100%;max-height:124px;object-fit:contain;display:block}
.cupcard .noph{font-size:11px;color:var(--dim);text-align:center;padding:0 8px}
.cupcard .meta{padding:7px 9px 9px}
.cupcard .code{font-size:11.5px;font-weight:600;color:var(--txt);
  word-break:break-all;line-height:1.35}
.cupcard .dim{font-size:10.5px;color:var(--dim);margin-top:2px}
.cupcard .desc{
  font-size:10.5px;color:var(--dim);margin-top:4px;
  display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;
}
/* ---- 卡片删除：按钮放外层，避免和「点卡片看大图」抢事件 ---- */
.cupwrap{position:relative}
.cupdel{
  position:absolute;top:3px;right:3px;width:19px;height:19px;line-height:17px;
  border:1px solid var(--line);border-radius:50%;background:#fff;color:var(--dim);
  font-size:13px;cursor:pointer;padding:0;text-align:center;opacity:0;
  transition:opacity .12s;
}
.cupwrap:hover .cupdel{opacity:1}
.cupdel:hover{background:#dc2626;border-color:#dc2626;color:#fff}
.cupdel:disabled{opacity:.4;cursor:not-allowed}
/* ---- 上传确认弹窗里的勾选 ---- */
.rendops{display:flex;align-items:center;gap:10px;margin:6px 0 9px;padding:0 2px}
.rendops .sp{flex:1}
.rendops label{cursor:pointer;font-size:12.5px;display:flex;align-items:center;gap:5px}
.cupcard[data-sel] .tick{
  position:absolute;top:5px;left:5px;width:17px;height:17px;line-height:17px;
  border-radius:50%;background:#2563eb;color:#fff;font-size:11px;text-align:center;
}
.cupcard .thumb{position:relative}
.cupcard[data-sel]{cursor:pointer}
.cupcard[data-sel]:not(.on){opacity:.42}
.cupcard[data-sel]:not(.on) .thumb{filter:grayscale(1)}
/* ---- 被排除的非柜型 block：折叠，默认可有可无 ---- */
.rejd{margin-top:12px;font-size:12px;color:var(--dim)}
.rejd summary{cursor:pointer;padding:5px 0;user-select:none}
.rejd summary:hover{color:var(--txt)}
.rejlist{
  max-height:190px;overflow:auto;border:1px solid var(--line);
  border-radius:6px;padding:6px 8px;background:#fafbfc;margin-top:5px;
}
.rejlist>div{display:flex;gap:8px;padding:2px 0;border-bottom:1px solid #f0f0f0}
.rejlist code{font-size:11px;color:var(--txt);flex:1;word-break:break-all}
.rejlist span{font-size:10.5px;color:var(--dim);white-space:nowrap}
/* ---- 楼层×柜型矩阵里的柜型缩略图 ----
   用户诉求：「右侧这个楼层x柜型……这个改成缩略图」。
   缩略图按**固定高度 + 宽度自适应**排布，跟柜型库卡片一致，
   不给固定宽度留白。 */
.mtxcell{display:flex;gap:9px;align-items:flex-start}
.mthumb{
  flex:0 0 auto;display:flex;align-items:center;justify-content:center;
  height:62px;padding:3px;background:#fff;cursor:zoom-in;
  border:1px solid var(--line);border-radius:5px;transition:border-color .12s;
}
.mthumb:hover{border-color:var(--accent)}
.mthumb.on{border-color:var(--accent);box-shadow:0 0 0 2px #2563eb33}
.mthumb img{max-height:56px;width:auto;display:block}
.mthumb.no{color:var(--dim);cursor:default;opacity:.5}
.mthumb.no .ic{width:18px;height:18px}
.mtxinfo{flex:1 1 auto;min-width:0}
/* 每层「units 数 → 柜型库里全部可选柜型」的缩略图带 */
.mtxlib{border-left:3px solid var(--accent);padding-left:9px}
.mtxlibhd{font-size:11px;color:var(--accent2);font-weight:600;margin-bottom:6px}
.mtxlib .cupgrid{grid-template-columns:repeat(auto-fill,minmax(118px,1fr));gap:7px}
.mtxlib .cupcard .thumb{padding:3px}
.mtxlib .cupcard .thumb img{width:100%;height:auto}
.mtxlib .cupcard .meta{padding:5px 7px 7px}
/* ---- 柜型库批量管理条 ---- */
.mgmt{
  display:flex;align-items:center;gap:8px;margin:0 0 8px;padding:6px 9px;
  border:1px solid var(--line);border-radius:7px;background:#fafbfc;
}
.mgmt .sp{flex:1}
.mgmt .muted{font-size:11.5px}
.btn.sm{padding:3px 9px;font-size:11.5px}
.btn.sm.danger{color:#dc2626;border-color:#f0c4c4}
.btn.sm.danger:hover{background:#fef2f2}
.tag.ok{background:var(--ok-bg);color:var(--ok);border-color:#bbf7d0}
.tag.warn{background:var(--warn-bg);color:var(--warn);border-color:#fde68a}
.cupview{
  display:flex;flex-direction:column;align-items:center;justify-content:center;
  min-height:100%;padding:14px;background:var(--panel2);gap:12px
}
.cupview img{max-width:100%;height:auto;background:#fff;
  border:1px solid var(--line);border-radius:6px;
  /* zoom 用 transform 缩放，不改布局宽高（改了 flex 会跟着抖）。
     默认不缩放，避免残留内联样式被裁切。 */
  transform-origin:center center;transition:transform .08s linear}
/* 缩放时 scrollable，1 倍时 hidden —— setZoom 里按需切换 overflow */
.zoomslot{max-width:100%;max-height:calc(100vh - 190px);overflow:hidden;
  display:flex;align-items:center;justify-content:center}
/* 图下方的尺寸标注（用户要求「图片 + 下面显示尺寸」）*/
.cupcap{background:#fff;border:1px solid var(--line);border-radius:8px;
  padding:9px 16px;font-size:13px;color:var(--fg);text-align:center;
  box-shadow:0 1px 3px rgba(15,23,42,.06);max-width:92%}
.cupcap b{font-weight:700;color:var(--accent)}
.cupcap .muted{font-size:11.5px}

/* ---- 柜型库 / Buildings 的文件列表页 ---- */
.filelist{padding:10px 12px}
.filelist .row-item{
  display:flex;align-items:center;gap:11px;padding:10px 12px;background:#fff;
  border:1px solid var(--line);border-radius:7px;margin-bottom:8px;box-shadow:var(--shadow);
}
.filelist .row-item .ico{
  width:30px;height:30px;border-radius:6px;background:var(--info-bg);color:var(--accent);
  display:flex;align-items:center;justify-content:center;font-size:14px;flex-shrink:0;
}
.filelist .row-item .nm{flex:1;min-width:0}
.filelist .row-item .nm .t{font-weight:600;font-size:12px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.filelist .row-item .nm .s{font-size:10.5px;color:var(--dim);margin-top:2px}

/* ---------- 主体三栏 ---------- */
main{display:flex;height:calc(100% - 52px)}
#tree{
  width:250px;flex-shrink:0;background:var(--panel);border-right:1px solid var(--line);
  overflow-y:auto;padding:10px 0;
}
#mid{flex:1;min-width:0;display:flex;flex-direction:column;background:#e8edf3;border-right:1px solid var(--line)}
#right{width:520px;flex-shrink:0;background:var(--panel);overflow-y:auto}

/* ---------- 栏宽拖拽 ----------
   用户诉求：「所有的页面的这些工作区，都可以左右拖拽」。
   实现：两条 4px 的拖拽把手，用 pointer 事件改左右栏的 width。
   为什么用 pointer 事件而不是 mouse —— 触屏也能拖，Chrome 下
   鼠标 draggable 选中文字的问题也一并没了。 */
.dragbar{flex:0 0 4px;cursor:col-resize;background:transparent;position:relative;z-index:6}
.dragbar:hover,.dragbar.on{background:var(--accent)}
.dragbar::after{content:'';position:absolute;inset:0 -3px}   /* 扩大命中区 */
body.resizing{cursor:col-resize;user-select:none}
/* 拖拽把手放在 tree 右边界、right 左边界 */
#treewrap{position:relative}
@media (max-width:900px){.dragbar{display:none}}

.sec{padding:9px 12px 4px;font-size:10px;font-weight:700;color:var(--dim);
  letter-spacing:1px;text-transform:uppercase}
.node{
  display:flex;align-items:center;gap:7px;padding:5px 12px;cursor:pointer;
  border-left:3px solid transparent;transition:.1s;
}
.node:hover{background:var(--panel2)}
.node.on{background:var(--panel2);border-left-color:var(--accent)}
.node .ico{width:14px;text-align:center;opacity:.75;font-size:11px}
/* 折叠箭头 */
.node .tw{
  width:11px;flex-shrink:0;font-size:9px;color:var(--dim);
  cursor:pointer;text-align:center;transition:.1s;
}
.node .tw:hover{color:var(--accent)}
.node .nm{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.node .ct{font-size:10px;color:var(--dim);font-variant-numeric:tabular-nums}
.node.lv1{padding-left:26px}
.node.lv2{padding-left:40px;font-size:12px;color:var(--dim)}
/* 同套数下的具体摆法（「6 Units - A」）：再缩进一级，字色加深 —— 它们
   才是真正会被选中的叶子节点，光靠 lv2 的灰色会显得像分类标题。 */
.node.lv2.lv3{padding-left:54px;color:var(--fg)}
.node.lv2.lv3:hover{background:#f2f6fb}
/* 树节点的编辑按钮 —— 已改为顶部「编辑」按钮下拉菜单，
   这里只保留 hover 时高亮当前行，不再有逐项按钮。 */
.node:hover{background:var(--panel2)}

/* ---- 顶部「编辑」下拉菜单 ---- */
.editmenu{
  position:fixed;z-index:60;min-width:190px;background:#fff;
  border:1px solid var(--line);border-radius:10px;padding:5px;
  box-shadow:0 10px 28px rgba(15,23,42,.16);
}
.editmenu .emitem{
  display:flex;align-items:center;gap:9px;width:100%;
  padding:8px 10px;border:0;border-radius:7px;background:transparent;
  font-size:13px;color:var(--fg);text-align:left;cursor:pointer
}
.editmenu .emitem:hover{background:#eff5fb}
.editmenu .emico{
  width:20px;height:20px;display:grid;place-items:center;flex-shrink:0;
  color:var(--dim);font-size:13px
}

/* ---------- 中栏 ---------- */
.mid-bar{
  display:flex;align-items:center;gap:8px;padding:7px 12px;
  background:var(--panel);border-bottom:1px solid var(--line);flex-shrink:0;
}
/* 工具条上的按钮不许被压扁。中栏可拖拽变窄后，按钮里的文字会被
   挤成「重新解析」四个字竖排一列（实际踩到过），所以显式禁止收缩、
   并保持单行。窄了就让 .fn 先让位——它有 text-overflow:ellipsis。 */
.mid-bar .btn,.mid-bar .badge{flex:0 0 auto;white-space:nowrap}
.mid-bar .fn{
  flex:1 1 auto;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;
  font-size:12px;color:var(--txt);
}
/* 滚动模式提示 —— 说明「整份连续显示」+ 怎么快速翻页 */
.mid-bar .hint{
  font-size:10.5px;color:var(--dim);white-space:nowrap;
  padding:2px 7px;background:var(--panel2);border-radius:4px;
}
@media (max-width:1200px){.mid-bar .hint{display:none}}
.btn{
  padding:5px 11px;border-radius:5px;background:var(--panel2);color:var(--txt);
  font-size:12px;font-weight:500;transition:.15s;white-space:nowrap;
}
.btn:hover{background:#e2e8f0}
.btn.pri{background:var(--accent);color:#fff}
.btn.pri:hover{background:var(--accent)}
.btn.ok{background:var(--ok);color:#fff}
.btn:disabled{opacity:.4;cursor:not-allowed}
.viewer{flex:1;overflow:auto;position:relative;background:#e8edf3}
/* ---- 连续滚动模式：全部页面依次排开，像看长文档 ---- */
.viewer.scrollmode{padding:10px 0 40vh;scroll-behavior:smooth}
/* 每个页面占位块：高度按 A4 比例预留，图片到位前不跳动 */
.vpage{position:relative;margin:0 auto 10px;background:#fff;box-shadow:0 1px 4px #0002}
.vpage > img{width:100%;display:block;opacity:0;transition:opacity .18s}
/* 懒加载占位：先出一个骨架，图片加载完才显示真实内容 */
.vpage .skel{
  width:100%;display:flex;align-items:center;justify-content:center;
  color:var(--dim);font-size:12px;background:#f6f8fa;
}
.vpage > img.on{opacity:1}
.vpage .skel.on{display:none}
/* 页码角标：滚到哪页一眼看到 */
.vpage .pno{
  position:absolute;right:6px;bottom:6px;z-index:2;
  background:#0f172aa8;color:#fff;font-size:10.5px;padding:1px 7px;border-radius:9px;
  pointer-events:none;font-variant-numeric:tabular-nums;
}
/* 连续滚动时页码条高亮当前可见页（.pg.on 定义在下方基础样式里） */
.viewer img{
  display:block;margin:0 auto;transition:width .15s;
  image-rendering:-webkit-optimize-contrast;
}
.viewer.loading{position:relative}
.viewer .ph{display:flex;height:100%;align-items:center;justify-content:center;color:var(--dim);flex-direction:column;gap:10px}
.page-list{
  width:120px;flex-shrink:0;background:var(--panel);border-right:1px solid var(--line);
  overflow-y:auto;padding:5px 0;
}
.page-list .pg{
  padding:4px 10px;font-size:11px;cursor:pointer;color:var(--dim);
  border-left:3px solid transparent;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;
}
.page-list .pg:hover{background:var(--panel2)}
.page-list .pg.on{background:#dbeafe;border-left-color:var(--accent);color:var(--accent2)}

/* ---------- 右栏 ---------- */
.rtabs{display:flex;background:var(--panel);border-bottom:1px solid var(--line);position:sticky;top:0;z-index:5}
.rtabs button{flex:1;padding:10px 4px;font-size:12px;color:var(--dim);border-bottom:2px solid transparent}
.rtabs button.on{color:var(--accent);border-bottom-color:var(--accent);background:var(--panel2)}
.rpane{padding:12px}
.kpis{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-bottom:12px}
/* 楼层概览那排只有 2~3 个，用auto-fit 让卡片按内容宽度均分，
   不然沿用 4 列会在右栏窄的时候挤成两行 */
.kpirow{display:grid;grid-template-columns:repeat(auto-fit,minmax(96px,1fr));
  gap:8px;margin-bottom:12px}
.kpi{background:#fff;border:1px solid var(--line);border-radius:7px;padding:9px 10px;
  border-left:3px solid var(--accent);box-shadow:var(--shadow)}
.kpi.g{border-left-color:var(--ok)} .kpi.p{border-left-color:var(--purple)}
.kpi.o{border-left-color:var(--warn)} .kpi.r{border-left-color:var(--err)}
.kpi .v{font-size:19px;font-weight:700;font-variant-numeric:tabular-nums;line-height:1.2}
.kpi .l{font-size:10px;color:var(--dim);margin-top:1px}

table{width:100%;border-collapse:collapse;font-size:11.5px}
th{
  background:var(--panel2);padding:6px 5px;text-align:left;font-weight:600;
  font-size:10.5px;color:var(--dim);position:sticky;top:0;white-space:nowrap;
  border-bottom:1px solid var(--line);
}
td{padding:6px 5px;border-bottom:1px solid var(--line);vertical-align:top}
tr:hover td{background:var(--panel2)}
tr.floor-row td{background:#eef2f7;font-weight:700;border-top:2px solid var(--line)}
.num{text-align:right;font-variant-numeric:tabular-nums}
.mono{font-family:ui-monospace,Menlo,Consolas,monospace;font-size:11px}
.tag{
  display:inline-block;padding:1px 6px;border-radius:4px;font-size:10px;
  font-weight:600;white-space:nowrap;
  /* 无语义修饰的通用 tag（图层清单等）也要有底色，
     否则浅色主题下是无色透明文字，等于隐形 */
  background:var(--panel2);color:var(--dim);border:1px solid var(--line);
}
.tag.high{background:#dcfce7;color:#15803d}
.tag.medium{background:#fef3c7;color:#b45309}
.tag.low{background:#fee2e2;color:#b91c1c}
.tag.acc{background:#ede9fe;color:#6d28d9}
.tag.com{background:#dbeafe;color:#1d4ed8}
.tag.err{background:#fee2e2;color:#b91c1c}
.tag.warn{background:#fef3c7;color:#b45309}
.muted{color:var(--dim)}
.err-t{color:var(--err)} .ok-t{color:var(--ok)} .warn-t{color:var(--warn)}

.alert{
  padding:8px 11px;border-radius:6px;font-size:11.5px;margin-bottom:11px;
  border-left:3px solid;
}
.alert.ok{background:var(--ok-bg);border-color:var(--ok);color:#15803d}
.alert.warn{background:var(--warn-bg);border-color:var(--warn);color:#b45309}
.alert.err{background:var(--err-bg);border-color:var(--err);color:#b91c1c}
.alert.info{background:var(--info-bg);border-color:var(--accent);color:var(--accent2)}

.empty{padding:36px 20px;text-align:center;color:var(--dim);font-size:12px}
.empty .big{font-size:30px;margin-bottom:8px;opacity:.4}

.bar{height:16px;background:var(--panel2);border-radius:3px;overflow:hidden;display:flex}
.bar i{display:block;height:100%}
.legend{display:flex;gap:12px;flex-wrap:wrap;font-size:11px;margin:8px 0}
.legend span{display:flex;align-items:center;gap:5px}
.legend b{width:11px;height:11px;border-radius:2px;display:inline-block}

/* ---------- 抽屉/弹窗 ---------- */
.mask{
  position:fixed;inset:0;background:#0f172a59;display:none;
  align-items:center;justify-content:center;z-index:100;padding:20px;
}
.mask.on{display:flex}
.modal{
  background:var(--panel);border-radius:10px;width:100%;max-width:820px;
  max-height:88vh;display:flex;flex-direction:column;
  border:1px solid var(--line);box-shadow:var(--shadow-lg);
}
.modal h2{
  padding:13px 16px;font-size:14px;border-bottom:1px solid var(--line);
  display:flex;align-items:center;justify-content:space-between;
}
.mbody{padding:16px;overflow-y:auto;flex:1}
/* 上传确认弹窗：外层不滚，滚动条只出现在下方的图库区域。
   用户诉求：「弹窗右侧的滚动条不要整个页面，只需要在下面的图库这里显示」。
   之前 .mbody 整体 overflow-y:auto，23 张柜型图把弹窗撑得很长，
   标题栏和「确认入库」按钮都被顶出可视区。 */
.modal.split{max-width:980px}
/* 必须给一个确定的高度，否则 .mbody 会被 23 张图撑到 2121px，
   .gallery 拿不到受限高度 → 自身不滚动，底部卡片被 overflow:hidden 裁掉。 */
.modal.split{height:92vh}
/* 视口很矮时图库会被压到几十像素。这里给一个下限，
   溢出则由 .mbody 自己兜底滚动（总比图库看不见强）。 */
.modal.split .mbody{overflow-y:auto;display:flex;flex-direction:column;min-height:0}
/* #rendbox 是 .mbody 的最后一个 flex 子项：分掉剩余空间并允许收缩，
   内部的 .gallery 才有条件变成真正的滚动容器。 */
.modal.split #rendbox{flex:1 1 auto;min-height:0;display:flex;flex-direction:column}
.modal.split #prog{flex:0 0 auto}
/* 一旦进入「解析/渲染」阶段，上方的拖拽区、已选文件摘要、PDF 预览
   就变成无用信息了。实测它们合计占掉 407px 里的全部高度，
   把 .gallery 挤成 12px（图库等于看不见）。渲染一开始就把它们收起。 */
.modal.split .mbody.busy #dz,
.modal.split .mbody.busy #upbox,
.modal.split .mbody.busy #preview{display:none}
/* 图库独立滚动区*/
.gallery{
  overflow-y:auto;overflow-x:hidden;min-height:200px;flex:1 1 auto;
  border:1px solid var(--line);border-radius:8px;background:var(--panel2);
  padding:10px 0 2px;
}
.gallery .cupgrid{padding-left:10px;padding-right:10px}
.mfoot{padding:11px 16px;border-top:1px solid var(--line);display:flex;gap:8px;justify-content:flex-end}
.x{font-size:18px;color:var(--dim);line-height:1}
.x:hover{color:var(--txt)}

.drop{
  border:2px dashed var(--line);border-radius:9px;padding:26px;text-align:center;
  cursor:pointer;transition:.15s;margin-bottom:14px;
}
.drop:hover,.drop.hot{border-color:var(--accent);background:var(--info-bg)}
.drop .big{font-size:28px;margin-bottom:6px;opacity:.5}
.flist{display:flex;flex-direction:column;gap:5px;font-size:11.5px}
.flist .f{
  display:flex;align-items:center;gap:9px;padding:6px 10px;
  background:var(--panel2);border:1px solid var(--line);border-radius:5px;
}
.flist .f .n{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}

.fld{margin-bottom:12px}
.fld label{display:block;font-size:11px;color:var(--dim);margin-bottom:4px}
.fld input,.fld select,.fld textarea{
  width:100%;padding:7px 9px;background:#fff;border:1px solid var(--line);
  border-radius:5px;color:var(--txt);font:inherit;
}
.fld input:focus,.fld select:focus,.fld textarea:focus{
  outline:2px solid #bfdbfe;outline-offset:0;border-color:var(--accent);
}
.fld textarea{resize:vertical;min-height:70px}
.row{display:flex;gap:10px}
.row>*{flex:1}

.spin{
  display:inline-block;width:13px;height:13px;border:2px solid #fff6;
  border-top-color:#fff;border-radius:50%;animation:sp .7s linear infinite;
}
@keyframes sp{to{transform:rotate(360deg)}}
.toast{
  position:fixed;bottom:18px;right:18px;background:var(--panel);
  border:1px solid var(--line);border-left:3px solid var(--accent);
  padding:10px 15px;border-radius:7px;font-size:12px;z-index:200;
  box-shadow:var(--shadow-lg);max-width:380px;
}
.toast.ok{border-left-color:var(--ok)}
.toast.err{border-left-color:var(--err)}

/* ============ 开源图标（Lucide, ISC License, © Lucide Contributors）===
 *用户要求「里面涉及到的所有 icon 都需要从网上找开源免费的使用」。
 * 之前用的是 ✎🗑 ▦ ▤ ≡ ▾ ▸ 这些 Unicode 字符，不同平台字形不一样
 *   （🗑 在Windows 上是彩色 emoji，在 Linux 上是黑白），而且不可控。
 * 现在统一换成 Lucide 的线性 SVG：路径直接内联，不引外部 CDN
 *   —— 这个应用要能离线跑（现场解析 DWG），CDN 挂了就全崩。
 * 用法：<svg class="ic"><use href="#i-pencil"></use></svg>
 */
.ic{width:1em;height:1em;stroke:currentColor;fill:none;stroke-width:2;
  stroke-linecap:round;stroke-linejoin:round;flex:0 0 auto;
  vertical-align:-.125em}
.ic.lg{width:1.5em;height:1.5em}
/* 树节点的图标槽：原来是字符，宽度靠字号撑着，换成 SVG 后要固定宽度，
   否则chevron 展开时整棵树会横向抖动 */
.tw .ic,.ico .ic{width:13px;height:13px}
.ph .big .ic{width:34px;height:34px;stroke-width:1.5}
.btn .ic{width:14px;height:14px}
.emico .ic{width:14px;height:14px}
.cupdel .ic{width:12px;height:12px}
</style>
</head>

let LANGNOW = 'zh';

}

const $ = s => document.querySelector(s);
const $$ = s => [...document.querySelectorAll(s)];

/** 内联一个开源图标（Lucide, ISC）。名字见上方 sprite 里的 #i-* */

function toast(msg, kind = '') {
  const t = document.createElement('div');
  t.className = 'toast ' + kind; t.textContent = msg;
  document.body.appendChild(t);
  setTimeout(() => t.remove(), kind === 'err' ? 6500 : 3500);
}
async function api(path, opt = {}) {
  const r = await fetch('/api' + path, opt);
  if (!r.ok) {
    let d = ''; try { d = (await r.json()).detail || ''; } catch (e) {}
    // 500 且后端已带可读原因 → 直接把原因摊开给用户，
    // 不再显示干巴巴的「入库失败 500」让人猜。
    throw new Error(`${r.status} ${d || r.statusText}`);
  }
  return r.json();
}
function modal(html, cls = '') {
  const m = $('#modal');
  m.className = 'modal' + (cls ? ' ' + cls : '');
  m.innerHTML = html;
  $('#mask').classList.add('on');
}


/* ============================================================ 版本错配横幅
 *  前端是单文件 HTML，浏览器缓存住旧版本是最难查的一类故障：
 *  界面还是旧的（点了没反应），但后端已经是新的（入库直接 500）。
 *  与其让用户对着 500 猜，不如启动时就把话说明白。 */
const APIVER = '2';
function showVerMismatch(serverVer) {
  const bar = document.createElement('div');
  bar.id = 'vermismatch';
  bar.style.cssText = [
    'position:fixed', 'left:0', 'right:0', 'top:0', 'z-index:9999',
    'background:#b91c1c', 'color:#fff', 'padding:9px 14px',
    'font-size:13px', 'line-height:1.5', 'text-align:center',
    'box-shadow:0 2px 10px #0003'
  ].join(';');
  bar.innerHTML =
    `<b>${LANGNOW === 'zh' ? '页面版本与后端不一致' : 'Page/backend version mismatch'}</b> · `
    + (LANGNOW === 'zh'
      ? `浏览器缓存了旧页面（页面 ${APIVER} / 后端 ${serverVer}）。`
      : `Browser cached an old page (page ${APIVER} / server ${serverVer}). `)
    + (LANGNOW === 'zh'
      ? `请<b>强制刷新</b>：Mac 按 <kbd>Cmd+Shift+R</kbd>，Windows 按 <kbd>Ctrl+Shift+R</kbd>。`
      : `<b>Hard-reload</b>: <kbd>Cmd+Shift+R</kbd> / <kbd>Ctrl+Shift+R</kbd>.`)
    + ' ';
  const btn = document.createElement('button');
  btn.textContent = LANGNOW === 'zh' ? '立即刷新' : 'Reload now';
  btn.style.cssText = 'margin-left:10px;padding:3px 12px;border:0;border-radius:5px;'
    + 'cursor:pointer;font-weight:600';
  btn.onclick = () => location.reload(true);
  bar.appendChild(btn);
  document.body.appendChild(bar);
  setTimeout(() => bar.remove(), 30000);
}
function closeModal() {
  // 解析中禁止关闭 —— 否则用户一点就把进度弄丢了，
  // 而且后台仍在跑，前端却以为失败了
  if (S.parsing) {
    toast(t('up.busy'), 'err');
    return;
  }
  $('#mask').classList.remove('on');
}

async function boot() {
  // 先固化静态文案，避免首屏「连接中…」/「未选择文件」残留
  $$('[data-i18n]').forEach(e => { e.textContent = t(e.dataset.i18n); });
  $('#mfn').textContent = t('mid.none');
  try {
    const h = await api('/health');
    // 版本一致性校验 —— 前后端必须同步升级。
    // 前端是单文件 HTML，浏览器极易缓存住旧版本，而用户往往只记得
    // 「重启服务」，不记得强刷，于是旧 JS 提交旧字段给新后端 → 500。
    // 实测踩坑：用户 pull 新版 + 重启后端，仍报「入库失败 500」，
    // 根因就是浏览器还在跑旧 index.html。这里主动比对并横幅提示。
    if (h.api_version && h.api_version !== APIVER) {
      showVerMismatch(h.api_version);
    }
    // 记住后端给的 dwg_hint，供徽章点击时展示
    S.dwgHint = h.dwg_hint || null;
    $('#hstat').innerHTML =
      `${LANGNOW==='zh'?'规则':'Rules'} v${esc(h.config_version)} · ${h.dwg_ready
        ? `<span class="badge on">${t('dwg.ready')}</span>`
        : `<span class="badge link" id="bdwg" title="${esc(t('dwg.hint.title'))}">${t('dwg.none')}</span>`}`;
    // 后端已给出可执行指引，前端必须消费它 —— 否则用户只看到「未装后端」却不知道怎么办
    const bw = $('#bdwg');
    if (bw) bw.onclick = () => showDwgHint(S.dwgHint);
  } catch (e) {
    $('#hstat').innerHTML = `<span class="err-t">${t('hstat.offline')}</span>`;
  }
  await loadTree();
  await loadVariants();
  // 恢复上次所在 tab 与选中项 —— 用户诉求「刷新维持在当前 tab，
  // 不要直接跳转到工作台」。用 localStorage（跨会话）而不是
  // sessionStorage（关掉标签页就没了，刷新诉求要的是后者也行，
  // 但存localStorage 顺手也满足「关掉再开还在」）。
  let resume = null;
  try { resume = JSON.parse(localStorage.getItem('cupView') || 'null'); }
  catch (e) { /* 隐私模式 */ }
  if (resume && ['work', 'cupboard', 'building'].includes(resume.view)) {
    S.view = resume.view;
    S.treeSel = resume.sel ?? null;
    S.openDrawing = resume.dwg ?? null;
    S.floorFilter = resume.floor ?? null;
    S.floorSel = resume.fsel ?? null;
  }
  // 自动恢复最近一次解析结果 —— 否则刷新后界面是空的
  try {
    const jobs = await api('/jobs?limit=1');
    if (jobs.length) {
      S.curBuilding = jobs[0].building_id ?? S.curBuilding;
      await loadJob(jobs[0].id);
      showPdf(jobs[0].id, S.pages?.length ? S.pages : []);
    }
  } catch (e) {}
  // 统一走 gotoView 归位：首屏也必须把上传按钮、树、中栏按 tab 摆对，
  // 否则默认可见 #bup（工作台不该有上传入口）
  gotoView(S.view);
  // 进入 tab 自动选中树里第一个 item（用户诉求：「进入这个 tab 后，
  // 默认会显示树状结构第一个的 item，选中」）
  autoSelectFirstInView();
  saveViewState();
}

/** 记住当前所在 tab 与选中项，供刷新后恢复。
 *  用户诉求：「这个页面刷新，维持在当前的 tab 内容，
 *  不要直接跳转到工作台」。 */
function saveViewState() {
  try {
    localStorage.setItem('cupView', JSON.stringify({
      view: S.view, sel: S.treeSel, dwg: S.openDrawing, floor: S.floorFilter,
      fsel: S.floorSel,
    }));
  } catch (e) { /* 隐私模式下写不了，忽略 */ }
}

/** 进入 tab 时自动选中树里第一个 item。
 *  用户诉求：「进入这个 tab 后，默认会显示树状结构第一个的 item，
 *  选中，然后中间位置显示完整的内容」。 */
function autoSelectFirstInView() {
  // 建筑图纸 tab：刷新恢复来的楼层选中要直接兑现（否则右栏停在项目列表）
  if (S.view === 'building' && S.treeSel === 'floors' && S.floorSel) {
    const f = (S.job?.floors || []).find(x => x.floor_code === S.floorSel);
    if (f) { showFloorPanel(S.floorSel); return; }
    S.floorSel = null;
  }
  if (S.treeSel) {
    // 刷新恢复来的选中：gotoView 已经把右栏重画成占位内容了（renderHub），
    // 这里必须按treeSel 把真实内容重新灌上，否则「树里选中 3 Units、
    // 右栏却是柜型库总览」这种错位会出现。
    restoreSelection();
    return;
  }
  // 建筑图纸 tab：第一个 item 是楼栋，直接点它只会展开、不会加载内容。
  // 用户要的是「默认选中第一个 item，中间显示完整 PDF，右边显示楼层
  // 信息」—— 所以这里自动往下钻到楼层列表，钻到第一个真实楼层。
  if (S.view === 'building') {
    const p = S.projects[0];
    if (!p) { renderHub(); return; }
    const d = (p.drawings || [])[0];
    if (!d) { renderHub(); return; }
    S.curBuilding = p.id;
    S.openDrawing = d.id;
    S.treeSel = 'floors';
    renderTree();
    const f0 = (S.job?.floors || [])[0];
    if (f0) { S.floorSel = f0.floor_code; showFloorPanel(f0.floor_code); }
    else { renderHub(); if (S.jobId) showPdf(S.jobId, S.pages || []); }
    return;
  }
  const first = $('#tree .node');
  if (first) { first.click(); return; }
  // 树是空的（柜型库没数据 / 没解析过）—— 中右两栏也别留上一 tab 的残影
  if (S.view !== 'work') renderHub();
}

/** 按当前的 S.treeSel 把中栏/右栏内容重新灌一遍。
 *
 *  只在「刷新恢复」这条路径上用：localStorage 里存着上次的选中项，
 *  但那些内容在页面重载后并不存在于 DOM 里，必须重放一次渲染。
 *  分派规则与 bindTree 的点击分支保持一致。
 */
function restoreSelection() {
  const sel = String(S.treeSel || '');
  if (!sel) return;
  if (sel === 'floors') {
    if (S.view === 'building' && S.floorSel) { showFloorPanel(S.floorSel); return; }
    renderPane();
    return;
  }
  if (S.view === 'cupboard') {
    if (sel.includes('@') || sel.includes('#')) showUnitsGroup(sel);
    else if (/^u\d+$/.test(sel)) showUnitsGroup(unitsGroupKey(Number(sel.slice(1))));
    return;
  }
  // 工作台 / 建筑图纸的其它形态：交给既有的楼层筛选
  filterFloor(S.floorFilter);
}

async function loadTree() {
  try {
    S.projects = await api('/projects');
  } catch (e) { S.projects = []; }
  renderTree();
}

function renderTree() {
  // 柜型库 tab：树里**只**显示柜型分组，不再混入楼栋（用户诉求：
  //「切换到柜型库，还是显示的楼栋的内容」）
  if (S.view === 'cupboard') { renderTreeLibrary(); return; }

  let h = `<div class="sec">${t('tree.projects')}</div>`;
  if (!S.projects.length) {
    h += `<div class="node lv1" style="color:var(--dim)">${t('tree.empty')}</div>`;
  }
  for (const p of S.projects) {
    const on = S.curBuilding === p.id ? ' on' : '';
    const job = S.job;
    const dw = p.drawings || [];
    // 楼栋节点上的箭头：折叠/展开。展开后每张图纸各占一个 item
    const open = !S.fold['b' + p.id];
    h += `<div class="node${on}" data-b="${p.id}">
      <span class="tw" data-fold="b${p.id}">${twIcon(open)}</span>
      <span class="ico">${ic('folder')}</span><span class="nm">${esc(p.name)}</span>
      <span class="ct">${dw.length}${t('tree.drawings')}</span></div>`;
    if (!open) continue;
    // ---- 每张图纸一个 item ----
    for (const d of dw) {
      const sel = S.treeSel === 'floors' && S.openDrawing === d.id ? ' on' : '';
      const dopen = S.openDrawing === d.id;
      h += `<div class="node lv1${sel}" data-sel="d${d.id}">
        <span class="tw">${d.latest_job_id ? twIcon(dopen) : '·'}</span>
        <span class="ico">${ic('file-text')}</span><span class="nm">${esc(d.title || t('nav.building'))}</span>
        <span class="ct">${d.page_count || 0}p</span></div>`;
      // 图纸展开 -> 该图纸自己的楼层（按 latest_job_id 过滤）
      const djob = (d.latest_job_id === S.jobId) ? job : null;
      if (dopen && djob) {
        h += `<div class="node lv1${S.treeSel === 'floors' ? ' on' : ''}" data-sel="floors">
          <span class="tw">${twIcon(false)}</span>
          <span class="ico">${ic('layers')}</span><span class="nm">${t('tree.floors')}</span>
          <span class="ct">${djob.floors?.length || 0}</span></div>`;
        if (S.treeSel === 'floors') {
          for (const f of (djob.floors || [])) {
            // 建筑图纸 tab 下当前楼层要高亮 —— 用户靠这个判断
            //「右栏这批柜型是给哪一层看的」
            const fo = S.view === 'building' && S.floorSel === f.floor_code
              ? ' on' : '';
            h += `<div class="node lv2${fo}" data-floor="${esc(f.floor_code)}">
              <span class="nm">${esc(f.floor_code)}</span>
              <span class="ct">${f.unit_count}${LANGNOW==='zh'?'户':' u'}${f.communal_count ? '+' + f.communal_count : ''}</span></div>`;
          }
        }
      }
    }
    if (!dw.length && job) {
      // 兼容：老数据只有 job 没有 drawing 记录
      h += `<div class="node lv1${S.treeSel === 'floors' ? ' on' : ''}" data-sel="floors">
        <span class="tw">${twIcon(false)}</span><span class="ico">${ic('layers')}</span>
        <span class="nm">${t('tree.floors')}</span>
        <span class="ct">${job.floors?.length || 0}</span></div>`;
    }
  }
  $('#tree').innerHTML = h;
  bindTree();
}

/** 柜型库 tab 的树：只列柜型分组 */
/** 柜型库左树：**DWG 文件名（可改名） → N Units**
 *
 *  用户口径（明确要求）：
 *    · 根节点 = DWG 文件名，可以改
 *    · 子节点 = 「5 Units」「6 Units」…
 *    · 点子节点 → 右侧平铺该套数下的**全部**摆法（不去重）
 *
 *  为什么不去重
 *  ------------
 *  真实样本实测：同一张图里 13 Units 的 2115×2350 那个柜出现了 3 次
 *  （楼上有三个楼层各画一遍）。用户明确要求「不去重，每次出现都算
 *  一种」—— 因为「这张图上一共画了几个柜」本身就是有用信息。
 *  所以分组只看 units 数，不看尺寸；同组内尺寸不同自然就分开了。
 *
 *  差异判定也按用户要求：**严格区分尺寸**，1315×2250 与 1315×2300
 *  是两种摆法（差 50mm）。
 */
function libraryGroups() {
  // 先按来源图纸分组（一个库里可能有多份 DWG 都导过柜型）
  //
  // **只收DWG 实测柜型**（source === 'dwg'）
  // ------------------------------------------
  // 库里还有 11 条 `seed_poc` 演示数据（CP-TRI-1x3 之类），它们是
  // Stage2 表位推导的基线，尺寸全是 estimated、也没有渲染图。
  // 它们一混进来，树上就会冒出「1 套」「2 套」这些用户口径里
  // 根本不存在的套数（真实 DWG 只有 3~14 Units），同一个 3 Units
  // 也会显示成 5 种柜型。柜型库是给用户选型用的，只该看真实图纸。
  const byFile = new Map();
  for (const v of S.variants) {
    if (v.source !== 'dwg') continue;
    const fname = v.source_name || v.dwg_name || t('tree.library');
    if (!byFile.has(fname)) byFile.set(fname, []);
    byFile.get(fname).push(v);
  }
  const files = [];
  for (const [fname, items] of byFile) {
    const byUnits = new Map();
    for (const v of items) {
      const n = Number(v.positions || 0);
      if (!byUnits.has(n)) byUnits.set(n, []);
      byUnits.get(n).push(v);
    }
    // 套数从少到多排：5 Units 在 6 Units 前面，符合直觉
    const units = [...byUnits.entries()]
      .map(([n, list]) => {
        // 同套数下的多个柜用 A / B / C 区分（用户口径）。
        //
        // 排序依据必须是**柜体尺寸**而不是入库顺序：真实样本里
        // 同一套数下三个柜的入库顺序受DXF 实体顺序影响，
        // 每次解析可能不同，按顺序编号会让 A/B 换来换去。
        // 尺寸（宽×高）稳定，且正是用户区分"不同摆法"的依据。
        const sorted = [...list].sort((a, b) =>
          (Number(a.w) - Number(b.w)) || (Number(a.h) - Number(b.h))
          || String(a.code).localeCompare(String(b.code)));
        return {
          n,
          list: sorted,
          key: `${fname}#${n}`,
          labels: sorted.map((v, i) => ({
            // 只有 1 个柜时不需要后缀，多了反而啰嗦
            suffix: sorted.length > 1
              ? '-' + String.fromCharCode(65 + i)
              : '',
            v,
          })),
        };
      })
      .sort((a, b) => a.n - b.n);
    files.push({
      name: fname,
      fileKey: fname,
      count: items.length,
      units,
      // 该文件总共多少套
      unitsTotal: items.reduce((a, v) => a + Number(v.positions || 0), 0),
    });
  }
  files.sort((a, b) => a.name.localeCompare(b.name));
  return files;
}

function renderTreeLibrary() {
  // 柜型库树：**根节点 = units 数量**，子节点 = Model A/B/C。
  //
  //  用户口径（明确要求）：
  //    3 Units
  //      Model A
  //      Model B
  //    4 Units
  //      Model A
  //    5 Units
  //      Model A
  //      Model B
  //  点父节点（3 Units）→ 右侧显示该套数下**全部** model；
  //  点子节点（Model A）→ 只看那一个。
  //
  //  为什么不再以 DWG 文件名为根
  //  --------------------------
  //  这个库里实际只有一份 DWG，文件名当根等于多加一层无意义的壳；
  //  用户真正要按units 找柜型。而且多个 DWG 时units 会重名，
  //  按文件分组反而看不清。先按 DWG 归组、再把 units 提到最外层，
  //  既满足口径又保留了多图纸时的归属信息。
  const files = libraryGroups();
  S.lfOpen = S.lfOpen || {};
  S.mdOpen = S.mdOpen || {};

  // 先把各 DWG 的 units 组摊平成「units -> 各 DWG 的 model」
  const byUnits = new Map();
  for (const f of files) {
    for (const u of f.units) {
      if (!byUnits.has(u.n)) byUnits.set(u.n, { n: u.n, files: [] });
      byUnits.get(u.n).files.push({ f, u });
    }
  }
  const unitsList = [...byUnits.values()].sort((a, b) => a.n - b.n);

  let h = `<div class="sec">${t('tree.library')}</div>`;
  if (!unitsList.length) {
    h += `<div class="node lv1" style="color:var(--dim)">${t('dwg.empty')}</div>`;
    $('#tree').innerHTML = h;
    return;
  }

  for (const grp of unitsList) {
    const ukey = 'u' + grp.n;
    const uopen = !!S.lfOpen[ukey];
    // 父子都要显示的计数：这个套数下一共有几个柜
    const total = grp.files.reduce((a, x) => a + x.u.labels.length, 0);
    const usel = S.treeSel === ukey;
    h += `<div class="node${uopen || usel ? ' on' : ''}" data-lu="${grp.n}">
      <span class="tw">${twIcon(uopen)}</span>
      <span class="ico">${ic('grid')}</span>
      <span class="nm">${grp.n} ${t('lib.units')}</span>
      <span class="ct">${total}</span></div>`;
    if (!uopen) continue;

    // 该套数下的每个 model
    for (const { f, u } of grp.files) {
      for (const lb of u.labels) {
        const key = u.key + '@' + lb.v.id;
        const on = S.treeSel === key ? ' on' : '';
        const disp = vLabel(lb.v, lb.suffix.replace(/^-\s*/, 'Model '));
        h += `<div class="node lv2${on}" data-lg="${esc(key)}" data-vid="${esc(lb.v.id)}">
          <span class="nm">${esc(disp)}</span>
          <span class="ct">${fmtMM(lb.v.w)}×${fmtMM(lb.v.h)}</span></div>`;
      }
    }
  }
  $('#tree').innerHTML = h;
  bindTree();
}

/** 某个 units 数对应的 group key（showUnitsGroup 要用）。
 *  这个库里通常只有一份 DWG，取第一个匹配的文件名即可；
 *  多份图纸时 units 会重名，这里返回第一个，右侧会把所有同名 units
 *  的柜型都列出来（用户按套数找柜，本来就不关心来自哪份图）。 */
function unitsGroupKey(nUnits) {
  for (const f of libraryGroups()) {
    const u = f.units.find(x => x.n === nUnits);
    if (u) return u.key;
  }
  return '';
}

/** 柜型的用户自定义名（后端 ``meter_counts.label``），没有则回退默认标签 */
function vLabel(v, dflt) {
  return (v && v.label) || dflt;
}

/** 尺寸显示：DWG 实测值是浮点，直接印出来是
 *  ``864.9999999999998`` 这种噪声（用户截图里看到的就是它）。
 *  取整到 1mm —— 实测尺寸本身精度远不到 1mm。
 */
function fmtMM(x) {
  // 后端偶尔把「无值」序列化成字符串 "null"（不是 null 本身），
  // 直接 Number("null") 得到 NaN 会漏到界面上变成 "nullD"。
  // 这里统一当空值处理。
  if (x === null || x === undefined || x === '' || x === 'null'
      || x === 'None' || x === 'undefined') return '—';
  const n = Math.round(Number(x));
  return Number.isFinite(n) ? String(n) : '—';
}

/** 当前选中项是否挂在某个文件节点下 —— 用来给展开的根节点加高亮 */
function isSelUnder(fileKey) {
  return S.treeSel === 'f:' + fileKey
      || String(S.treeSel || '').startsWith(fileKey + '#');
}

/** 树节点的编辑入口：**重命名 + 删除**（文件级与变体级各一套）。
 *
 *  重命名只改显示名，不动原文件 —— 柜型图已渲成 JPG 存库，
 *  原 DWG 改名反而对不上。
 *  文件级名字存 sessionStorage；变体级改名走后端 PATCH，
 *  因为变体要能持久化，不能只活在当前会话里。
 */
function bindTreeRename() {
  // ---- 文件级重命名 ----
  $$('#tree [data-rename]').forEach(b => {
    b.onclick = ev => {
      ev.stopPropagation();
      const key = b.dataset.rename;
      const cur = dispName(key);
      const name = prompt(
        LANGNOW === 'zh' ? '修改显示名称：' : 'Rename display name:', cur);
      if (name === null) return;
      const clean = String(name).trim();
      S.renames = S.renames || {};
      if (!clean || clean === cur) delete S.renames[key];
      else S.renames[key] = clean;
      try {
        sessionStorage.setItem('cupRename', JSON.stringify(S.renames));
      } catch (e) { /* 隐私模式下写不了，忽略 */ }
      renderTree();
      if (isSelUnder(key)) showUnitsGroup(S.treeSel, true);
    };
  });

  // ---- 文件级删除：该图纸下所有柜型变体 ----
  $$('#tree [data-del-file]').forEach(b => {
    b.onclick = ev => {
      ev.stopPropagation();
      const key = b.dataset.delFile;
      const f = libraryGroups().find(x => x.fileKey === key);
      const n = f ? f.count : 0;
      if (!confirm((LANGNOW === 'zh' ? '删除该图纸下的全部柜型？'
                    : 'Delete all cabinets from this drawing?')
                  + `\n${dispName(key)}\n${n} variants`)) return;
      delVariantsBySource(key);
    };
  });

  // ---- 变体级重命名（持久化到后端）----
  $$('#tree [data-rename-vid]').forEach(b => {
    b.onclick = ev => {
      ev.stopPropagation();
      const id = +b.dataset.renameVid;
      const old = b.dataset.vname || '';
      const name = prompt(
        LANGNOW === 'zh' ? '修改柜型名称：' : 'Rename variant:', old);
      if (name === null) return;
      const clean = String(name).trim();
      if (!clean || clean === old) return;
      renameVariant(id, clean);
    };
  });

  // ---- 变体级删除 ----
  $$('#tree [data-del-vid]').forEach(b => {
    b.onclick = ev => {
      ev.stopPropagation();
      const id = +b.dataset.delVid;
      const nm = b.dataset.vname || '';
      if (!confirm((LANGNOW === 'zh' ? '删除这个柜型？'
                    : 'Delete this variant?') + `\n${nm}`)) return;
      delVariant(id);
    };
  });
}

/** 变体改名 —— 持久化到后端。
 *
 *  走 ``PATCH /api/variants/{id}/name`` 而不是通用的
 *  ``PATCH /api/variants/{id}``：后者会用 rows×cols 覆写套数，
 *  而网格容量不等于套数（13 Units 的柜网格 5×4=20，只填 13 套），
 *  走它改个名字会把套数一起改错。
 */
async function renameVariant(id, name) {
  try {
    await api(`/variants/${id}/name`, { method: 'PATCH', body: { name } });
    toast((LANGNOW === 'zh' ? '已重命名为 ' : 'Renamed to ') + name, 'ok');
    await loadVariants();
    renderTree();
    if (S.treeSel) showUnitsGroup(S.treeSel, true);
  } catch (e) { toast('rename failed: ' + e.message, 'err'); }
}

/** 删单个变体 */
async function delVariant(id) {
  try {
    await api(`/variants/${id}`, { method: 'DELETE' });
    toast(t('lib.deldone'), 'ok');
    await loadVariants();
    // 删掉的正好是当前选中项 -> 落到同组下一个，组空了就清选中
    if (String(S.treeSel || '').endsWith('@' + id)) {
      const g = libraryGroups();
      let next = null;
      for (const f of g) for (const u of f.units) {
        if (u.labels.length) {
          const hit = u.labels.find(x => String(x.v.id) === String(id));
          if (hit) {
            const i = u.labels.indexOf(hit);
            const nx = u.labels[i + 1] || u.labels[i - 1];
            next = u.labels.length === 1 ? u.key : u.key + '@' + nx.v.id;
          }
        }
      }
      S.treeSel = next;
    }
    renderTree();
    renderHub();
    if (S.treeSel) showUnitsGroup(S.treeSel, true);
  } catch (e) { toast(t('lib.delfail') + ': ' + e.message, 'err'); }
}

/** 按来源图纸批量删（文件节点上的垃圾桶）*/
async function delVariantsBySource(fileKey) {
  const ids = S.variants
    .filter(v => (v.source_name || v.dwg_name) === fileKey)
    .map(v => v.id);
  if (!ids.length) { toast(t('lib.delfail'), 'err'); return; }
  try {
    const r = await api('/variants/delete', { method: 'POST', body: { ids } });
    toast(`${t('lib.deldone')} ${r.deleted ?? ids.length}`, 'ok');
    S.treeSel = null;
    await loadVariants();
    renderTree();
    renderHub();
  } catch (e) { toast(t('lib.delfail') + ': ' + e.message, 'err'); }
}

/** 取显示名（应用过重命名的优先） */
function dispName(fname) {
  return (S.renames || {})[fname] || fname;
}

/* ============================================================ 三栏拖拽
   用户诉求：「所有的页面的这些工作区，都可以左右拖拽」。
   宽度存sessionStorage —— 刷新后还在，但换浏览器/新会话回到默认。 */
const COL_MIN = 180, COL_MAX_RATIO = 0.6;

function initColumnResize() {
  // 用 querySelector 显式取 main —— <main> 的 id 虽能撞出同名全局变量，
  // 但那取决于别的脚本有没有给 main 赋值，不可靠。
  const mainEl = document.querySelector('main');
  const spec = [
    { bar: $('#dragL'), pane: $('#tree'), sign: +1, min: COL_MIN,
      key: 'wTree', maxOf: () => mainEl.clientWidth * COL_MAX_RATIO },
    { bar: $('#dragR'), pane: $('#right'), sign: -1, min: 280,
      key: 'wRight', maxOf: () => mainEl.clientWidth * COL_MAX_RATIO },
  ];
  // 恢复上次宽度（要在页面有布局宽度之后，所以用 rAF 兜一手）
  requestAnimationFrame(() => {
    for (const s of spec) {
      const v = Number(sessionStorage.getItem(s.key));
      if (v >= s.min) s.pane.style.width = v + 'px';
    }
  });

  for (const s of spec) {
    let startX = 0, startW = 0;
    s.bar.addEventListener('pointerdown', ev => {
      startX = ev.clientX;
      startW = s.pane.getBoundingClientRect().width;
      s.bar.classList.add('on');
      document.body.classList.add('resizing');
      s.bar.setPointerCapture(ev.pointerId);   // 指针捕获：拖出把手也不丢
      ev.preventDefault();
    });
    s.bar.addEventListener('pointermove', ev => {
      if (!s.bar.hasPointerCapture?.(ev.pointerId) && !s.bar.classList.contains('on')) return;
      // 左栏往右拖变宽，右栏往左拖变宽 -> sign 不同
      const w = Math.max(s.min, Math.min(s.maxOf(), startW + (ev.clientX - startX) * s.sign));
      s.pane.style.width = Math.round(w) + 'px';
      // 中栏宽度变了，PDF 页的缩放要跟着重排，否则留白/裁切错位
      reflowPages();
    });
    const end = ev => {
      if (!s.bar.classList.contains('on')) return;
      s.bar.classList.remove('on');
      document.body.classList.remove('resizing');
      try { s.bar.releasePointerCapture(ev.pointerId); } catch (e) { /* 已释放 */ }
      try { sessionStorage.setItem(s.key, String(Math.round(s.pane.getBoundingClientRect().width))); }
      catch (e) { /* 隐私模式 */ }
      reflowPages();
    };
    s.bar.addEventListener('pointerup', end);
    s.bar.addEventListener('pointercancel', end);
  }
}

/** 顶部「编辑」按钮：点开一个操作清单菜单。
 *
 *  用户诉求（参考截图里的 Materials 面板）：
 *  「不要每个 item 后面默认的两个功能按钮，需要在顶部有一个编辑的
 *   按钮，点击后，在后面会有功能的清单」
 *
 *  菜单项随当前选中项变化：选中 Model 就给「重命名 / 删除 / 复制」，
 *  选中 units 根就给「批量删除该套数」。没有选中时只给全局操作。
 */
function bindEditMenu() {
  const btn = $('#bedit');
  if (!btn) return;
  btn.onclick = ev => {
    ev.stopPropagation();
    const open = $('#editmenu');
    if (open) { open.remove(); return; }
    const sel = S.treeSel || '';
    const isModel = sel.includes('@');
    const vid = isModel ? Number(sel.split('@')[1]) : null;
    const v = vid ? S.variants.find(x => +x.id === vid) : null;
    // 当前选中的套数。treeSel 有三种形态，都得能取出套数：
    //   ``u7``                  柜型库根节点（units 数量就是 key）
    //   ``<dwg>#7``旧格式（按文件分组时的 units 组）
    //   ``<dwg>#7@15``          具体 model（取 # 后那段）
    // 之前只按 '#' 分割，柜型库改成 units 根之后父节点取不到套数，
    // 「删除该套数全部」就整项消失了。
    let units = 0;
    if (S.view === 'cupboard') {
      if (isModel) {
        const m = String(sel).slice(0, sel.indexOf('@')).match(/#(\d+)/);
        units = m ? Number(m[1]) : 0;
      } else if (sel.charAt(0) === 'u' && /^\d+$/.test(sel.slice(1))) {
        units = Number(sel.slice(1));
      } else {
        const m = String(sel).match(/#(\d+)/);
        units = m ? Number(m[1]) : 0;
      }
    }

    const items = [];
    if (S.view === 'cupboard') {
      if (v) {
        items.push(['rename', ic('pencil'), LANGNOW === 'zh' ? '重命名' : 'Rename']);
        items.push(['dup', ic('copy'), LANGNOW === 'zh' ? '复制为新 model' : 'Duplicate']);
        items.push(['del', ic('trash'), LANGNOW === 'zh' ? '删除' : 'Delete']);
      } else if (units) {
        items.push(['delall', ic('trash'),
          (LANGNOW === 'zh' ? `删除该 ${units} 套的全部柜型`
                             : `Delete all ${units}-unit cupboards`)]);
      }
      items.push(['clear', ic('eraser'), LANGNOW === 'zh' ? '清空柜型库' : 'Clear library']);
    } else {
      items.push(['bparse', ic('refresh'), LANGNOW === 'zh' ? '重新解析' : 'Re-parse']);
      items.push(['clear', ic('eraser'), LANGNOW === 'zh' ? '清空解析结果' : 'Clear results']);
    }

    const menu = document.createElement('div');
    menu.id = 'editmenu';
    menu.className = 'editmenu';
    menu.innerHTML = items.map(([act, ic, label]) =>
      `<button class="emitem" data-act="${act}"><span class="emico">${ic}</span>${esc(label)}</button>`
    ).join('');
    document.body.appendChild(menu);

    // 贴着按钮下方；贴边时收进窗口内
    const r = btn.getBoundingClientRect();
    menu.style.left = Math.min(r.left, window.innerWidth - menu.offsetWidth - 8) + 'px';
    menu.style.top = (r.bottom + 6) + 'px';

    menu.onclick = me => {
      const b = me.target.closest('.emitem');
      if (!b) return;
      menu.remove();
      doEditAction(b.dataset.act, { vid, v, units });
    };
    // 点别处关闭
    setTimeout(() => document.addEventListener('click', function h2(e) {
      if (!menu.contains(e.target)) { menu.remove(); document.removeEventListener('click', h2); }
    }), 0);
  };
}

async function doEditAction(act, ctx) {
  const { vid, v, units } = ctx;
  if (act === 'rename' && v) {
    const name = prompt(LANGNOW === 'zh' ? '修改柜型名称：' : 'Rename variant:', vLabel(v, v.code));
    if (name === null) return;
    const clean = String(name).trim();
    if (clean && clean !== vLabel(v, v.code)) renameVariant(vid, clean);
  } else if (act === 'dup' && v) {
    // 复制成一个新 model：同尺寸不同 code，方便当备选摆法留着
    const code = v.code + '-COPY';
    try {
      await api('/variants', { method: 'POST', body: {
        code, rows: v.rows, cols: v.cols, positions: v.positions,
        grid: v.grid, w: v.w, h: v.h, d: v.d,
        description: v.description, block_name: v.code,
      }});
      toast((LANGNOW === 'zh' ? '已复制为 ' : 'Duplicated as ') + code, 'ok');
      await loadVariants();
    } catch (e) { toast('duplicate failed: ' + e.message, 'err'); }
  } else if (act === 'del' && v) {
    if (confirm((LANGNOW === 'zh' ? '删除这个柜型？' : 'Delete this variant?')
      + `\n${vLabel(v, v.code)}`)) await delVariant(vid);
  } else if (act === 'delall' && units) {
    const ids = S.variants.filter(x => Number(x.positions) === units).map(x => x.id);
    if (ids.length && confirm(
      (LANGNOW === 'zh' ? `删除 ${units} 套的 ${ids.length} 个柜型？`
                        : `Delete ${ids.length} cupboards of ${units} units?`))) {
      await api('/variants/delete', { method: 'POST', body: { ids } });
      toast(t('lib.deldone'), 'ok');
      S.treeSel = null;
      await loadVariants();
      renderHub();
    }
  } else if (act === 'clear') {
    if (confirm(LANGNOW === 'zh'
      ? '清空柜型库（只清从 DWG 解析进来的，保留手工录入的）？'
      : 'Clear the cupboard library?')) {
      const r = await api('/variants/clear', { method: 'POST', body: { only_dwg: true } });
      toast(`${t('lib.deldone')} ${r.deleted ?? ''}`, 'ok');
      S.treeSel = null;
      await loadVariants();
      renderHub();
    }
  } else if (act === 'bparse') {
    $('#bparse')?.click();
  }
}

function bindTree() {
  $$('#tree .node').forEach(n => n.onclick = ev => {
    // 点箭头只折叠/展开，不触发选中
    const tw = ev.target.closest('.tw');
    if (tw && tw.dataset.fold) {
      const k = tw.dataset.fold;
      S.fold[k] = !S.fold[k];
      renderTree();
      return;
    }
    if (n.dataset.b) { S.curBuilding = +n.dataset.b; S.treeSel = null; renderTree(); }
    else if (n.dataset.lu !== undefined) {
      // 柜型库根节点 = units 数量。点它 -> 右侧显示该套数下**全部** model。
      const nUnits = Number(n.dataset.lu);
      S.lfOpen = S.lfOpen || {};
      const ukey = 'u' + nUnits;
      // 展开的同时把该组选中：用户口径是「点击父节点，右侧可以显示这个
      // units 下面所有的 cupboard model」
      S.lfOpen[ukey] = true;
      S.treeSel = ukey;
      renderTree();
      showUnitsGroup(unitsGroupKey(nUnits));
      return;
    }
    else if (n.dataset.lf) {
      // 点根节点：只切换展开，**不动选中态**。
      //
      // 实测 bug：以前这里会顺手把 treeSel 设成 'f:key'，而展开态
      // 又只看 treeSel，于是「点子节点 -> 再点根节点」这种正常操作
      // 会互相打架。现在展开记在 S.lfOpen，选中分开管。
      const key = n.dataset.lf;
      S.lfOpen = S.lfOpen || {};
      S.lfOpen[key] = !S.lfOpen[key];
      if (S.lfOpen[key] && !isSelUnder(key)) {
        // 展开时若该文件下没有任何选中项，默认选第一个 Units，
        // 这样右栏立刻有内容（但不覆盖用户已有的选中）。
        const g = libraryGroups().find(f => f.fileKey === key);
        if (g?.units.length) {
          const u0 = g.units[0];
          const k0 = u0.labels.length === 1
            ? u0.key : u0.key + '@' + u0.labels[0].v.id;
          S.treeSel = k0;
          renderTree();
          showUnitsGroup(k0);
          return;
        }
      }
      renderTree();
      return;
    }
    else if (n.dataset.lg) {
      // 点子节点：只改选中态，展开态保持不变 —— 树不会自己收起。
      const k = n.dataset.lg;
      S.treeSel = k;
      renderTree();
      showUnitsGroup(k);
    }
    else if (n.dataset.sel) {
      const k = n.dataset.sel;
      if (k.startsWith('d')) {
        const did = +k.slice(1);
        // 再次点同一张图纸 -> 收起
        S.openDrawing = S.openDrawing === did ? null : did;
        S.treeSel = S.openDrawing ? 'floors' : null;
        renderTree();
        return;
      }
      S.treeSel = S.treeSel === k ? null : k;
      renderTree();
    }
    else if (n.dataset.floor) {
      // 建筑图纸 tab：点楼层 -> 右栏显示该层 units 数对应的柜型种类；
      // 工作台 tab：沿用原来的户表筛选。
      if (S.view === 'building') {
        S.treeSel = 'floors';
        S.floorSel = S.floorSel === n.dataset.floor ? null : n.dataset.floor;
        renderTree();
        if (S.floorSel) showFloorPanel(S.floorSel);
        else { S.floorFilter = null; renderHub(); }
      } else {
        filterFloor(n.dataset.floor);
      }
    }
    else if (n.dataset.vg) {
      S.treeSel = S.treeSel === n.dataset.vg ? null : n.dataset.vg;
      renderTree();
      if (S.treeSel) showVariantGroup(n.dataset.vg);
    }
  });
}

function variantGroups() {
  const g = {};
  for (const v of S.variants) {
    // 按 water+gas 表位组合分组（需求 2：按 meter 组合分组）
    const key = v.bucket || ('p' + v.positions);
    (g[key] = g[key] || []).push(v);
  }
  return Object.entries(g).map(([key, items]) => ({
    key, count: items.length,
    title: items[0].bucket_label || (items[0].positions + ' 表位'),
  }));
}

// ============================================================ 楼层 × 柜型矩阵（需求 1 核心）
function renderMatrix() {
  const j = S.job;
  if (!j) return emptyBox(t('empty.notparsed'), t('empty.t1'));
  const s = j.summary || {};
  const cv = j.cross_validation || {};

  let h = '<div class="rpane">';

  // KPI
  h += `<div class="kpis">
    <div class="kpi g"><div class="v">${s.total_units ?? 0}</div><div class="l">${t('kpi.units')}</div></div>
    <div class="kpi p"><div class="v">${s.communal_units ?? 0}</div><div class="l">CO-LIVING</div></div>
    <div class="kpi"><div class="v">${(j.floors || []).length}</div><div class="l">${t('kpi.floor')}</div></div>
    <div class="kpi ${s.errors ? 'r' : 'o'}"><div class="v">${s.errors ?? 0}/${s.warnings ?? 0}</div><div class="l">${t('kpi.compliance')}</div></div>
  </div>`;

  // 交叉验证
  if (cv && cv.verdict) {
    const cls = cv.verdict === 'AGREE' ? 'ok' : 'warn';
    h += `<div class="alert ${cls}">
      <b>${t('cv.title')}: ${esc(cv.verdict)}</b> — ${t('cv.plan')} ${cv.plan_units} ↔ ${t('cv.sched')} ${cv.schedule_units},
      ${t('cv.agreed')} ${cv.agreed}, ${t('cv.rate')} ${cv.consistency ?? 0}
      ${(cv.area_mismatch || []).length ? `· ${t('prov.mismatch')} ${cv.area_mismatch.length} ${t('cv.arean')}` : `· ${t('cv.area0')}`}
    </div>`;
  }

  // 楼层矩阵表：每层一行，内含各柜型
  //
  // 用户诉求：「右侧这个楼层x柜型，需要每层显示units的数量，然后对应的
  // cupboards 的种类。这个改成缩略图」。
  //
  // 之前这里只有纯文字的柜型编码 + 尺寸，看不出柜子长什么样；
  // 现在每个柜型前面挂一张柜型图缩略图（DWG 直接渲出来的那张，
  // 不做二次绘制），点击看中栏大图。图片缺失时退回占位图标。
  h += `<div class="sec" style="padding-left:0">${t('mtx.title')}</div>`;
  h += `<table><thead><tr><th>${t('mtx.floor')}</th><th class="num">${t('mtx.units')}</th><th class="num">COLIVING</th>`
     + `<th class="num">${t('mtx.area')}</th><th>${t('mtx.cup')}</th></tr></thead><tbody>`;

  // 缩略图点开大图：走中栏的 showCupImage，与柜型库一致
  const mtxThumbs = [];
  for (const f of (j.floors || [])) {
    const units = (j.units || []).filter(u => u.floor === f.floor_code);
    const groups = {};
    for (const u of units) {
      const k = u.variant?.code || t('mtx.nomatch');
      (groups[k] = groups[k] || { n: 0, u: [], v: u.variant || null }).n++;
      groups[k].u.push(u.unit_label);
    }
    const nVar = Object.keys(groups).length;
    // 本层 units 数对应的**全部**柜型种类（不只是本层实际用到的那些），
    // 用户要的是「这层需要几个 units，柜型库里有哪几种摆法可选」。
    const n = Number(f.unit_count || 0);
    const all = cupboardsForUnits(n);
    // 本层实际用到的柜型（units 数与本层相符的那些）
    const usedHere = all.filter(x => groups[x.code]);
    h += `<tr class="floor-row"><td>${esc(f.floor_code)}</td>
      <td class="num">${f.unit_count}</td>
      <td class="num">${f.communal_count || 0}</td>
      <td class="num">${num(f.total_area_m2, 1)}</td>
      <td>${usedHere.length || nVar} ${t('mtx.kind')}</td></tr>`;
    for (const [code, g] of Object.entries(groups).sort((a, b) => b[1].n - a[1].n)) {
      const v = g.v || {};
      // 缩略图来源：``unit.variant`` 里**没有 image_url**（job 接口不返回
      // 图片路径），所以按 variant id 去已加载的 S.variants 里查图。
      // 查不到再退回「本层 units 数匹配的柜型图」。
      const img = S.variants.find(x =>
        String(x.id) === String(v.id) && x.image_url)?.image_url
        || all.find(x => x.code === code)?.image_url || '';
      if (img) mtxThumbs.push([img, code]);
      h += `<tr>
        <td style="padding-left:16px;color:var(--dim)">└</td>
        <td class="num muted">${g.n}</td>
        <td colspan="2" class="muted">${g.u.length > 8 ? g.u.slice(0, 8).join(' ') + ' …' : g.u.join(' ')}</td>
        <td>
          <div class="mtxcell">
            ${img
              ? `<span class="mthumb" data-mt="${esc(img)}" title="${esc(code)}">
                   <img loading="lazy" src="${esc(img)}" alt="${esc(code)}"></span>`
              : `<span class="mthumb no" title="${esc(t('lib.noimg'))}">${ic('image-off')}</span>`}
            <span class="mtxinfo">
              <div><b class="mono">${esc(code)}</b>
                ${v.name ? '<span class="muted"> — ' + esc(v.name) + '</span>' : ''}
                ${g.u.some(x => x.startsWith('CLA')) ? '<span class="tag com">COLIVING</span>' : ''}
              </div>
              <div class="muted" style="font-size:10.5px">
                ${v.w ? `${fmtMM(v.w)} W × ${fmtMM(v.h)} H${
                  // 后端可能给字符串 "null"，直接 v.d 判断会当成有值
                  (v.d && v.d !== 'null') ? ' × ' + fmtMM(v.d) + ' D' : ''} mm` : t('mtx.nosize')}
                · ${v.positions ?? '?'} ${t('lib.units')}${v.grid ? ' · ' + esc(v.grid) : ''}
              </div>
              ${all.length > 1 ? `<div class="muted" style="font-size:10.5px">${
                LANGNOW === 'zh'
                  ? `${f.floor_code} 需 ${n} Units，库中 ${all.length} 种摆法`
                  : `${f.floor_code} needs ${n} units, ${all.length} layouts in library`}</div>` : ''}
            </span>
          </div>
        </td></tr>`;
    }
    // ---- 本层 units 数在柜型库里的**全部**可选柜型（缩略图）----
    // 用户诉求：「右侧这个楼层x柜型，需要每层显示units 的数量，
    // 然后对应的 cupboards 的种类。这个改成缩略图」。
    // 上面的分组是「解析器实际派给各户的柜型」，这里补的是
    // 「这一层需要 N 户，柜型库里到底有几种 N Units 的柜可选」——
    // 两者不是一回事，缺一不可。
    if (all.length) {
      h += `<tr><td colspan="5" style="padding:8px 0 12px">
        <div class="mtxlib">
          <div class="mtxlibhd">${LANGNOW === 'zh'
            ? `${f.floor_code} · ${n} Units → 柜型库中 ${all.length} 种`
            : `${f.floor_code} · ${n} units → ${all.length} layouts in library`}</div>
          <div class="cupgrid" style="padding:0">
            ${all.map(v => `<div class="cupcard${v.image_url ? ' has-img' : ''}"
              data-mtimg="${esc(v.image_url || '')}">
              <div class="thumb">${v.image_url
                ? `<img loading="lazy" src="${esc(v.image_url)}" alt="${esc(v.code)}">`
                : `<div class="noph">${t('lib.noimg')}</div>`}</div>
              <div class="meta">
                <div class="code mono">${esc(v.code)}</div>
                <div class="dim">${fmtMM(v.w)} × ${fmtMM(v.h)} mm</div>
              </div></div>`).join('')}
          </div>
        </div></td></tr>`;
    }
  }
  h += '</tbody></table>';

  // 图例
  h += '<div class="legend">';
  for (const [c, n] of Object.entries(s.by_variant || {}))
    h += `<span><b style="background:var(--accent)"></b>${esc(c)} × ${n}</span>`;
  h += '</div></div>';
  $('#rpane').innerHTML = h;
  // 缩略图 → 点开看中栏大图（矩阵内的两种：.mthumb 小图 + .cupcard 卡片）
  const openBig = (url, el) => {
    const v = S.variants.find(x => x.image_url === url);
    showCupImage(url, v
      ? `<b>${fmtMM(v.w)} × ${fmtMM(v.h)} mm</b>${
          v.label ? ' · ' + esc(v.label) : ''}<div class="muted">${
          v.positions ?? '?'} ${t('lib.units')}</div>`
      : '');
    if (el) {
      $$('#rpane .mthumb, #rpane .cupcard[data-mtimg]')
        .forEach(y => y.classList.toggle('on', y === el));
    }
  };
  $$('#rpane .mthumb[data-mt]').forEach(el => {
    el.onclick = () => openBig(el.dataset.mt, el);
  });
  $$('#rpane .cupcard[data-mtimg]').forEach(el => {
    el.onclick = () => {
      if (!el.dataset.mtimg) { toast(t('lib.noclue'), 'err'); return; }
      openBig(el.dataset.mtimg, el);
    };
  });
}

      <td class="num">${num(u.area_m2)}</td>
      <td class="num">${num(u.wet_area_m2)}</td>
      <td>${esc(u.unit_type || '—')}</td>

      <td class="mono">${esc(v.grid || '—')}</td>
      <td class="num" style="font-size:10.5px">${v.w ? `${fmtMM(v.w)}×${fmtMM(v.h)}×${fmtMM(v.d)}` : '—'}</td>

function renderProv() {
  const j = S.job;
  if (!j) return emptyBox(t('empty.notparsed'), '');
  const ms = j.multi_signals || {}, cv = j.cross_validation || {};
  let h = '<div class="rpane">';
  h += `<div class="alert info">${t('prov.rule')} <b>v${esc(ms.config_version || '—')}</b>｜
    ${t('prov.ai')}: ${ms.used_ai ? `<span class="warn-t">${t('prov.yes')}</span>` : `<span class="ok-t">${t('prov.no')}</span>`}｜
    ${t('prov.before')} ${ms.raw_units_before_dedup ?? '—'} → ${t('prov.after')} ${ms.total_units ?? '—'}｜
    ${t('prov.pages')} ${ms.pages_with_text ?? '—'}</div>`;

  h += `<div class="sec" style="padding-left:0">${t('prov.hits')}</div><table><thead><tr>`
    + `<th>${t('prov.rule2')}</th><th>${t('prov.desc')}</th><th class="num">${t('prov.hit')}</th></tr></thead><tbody>`;
  const dg = j.diagnostics || {};
  if (!Object.keys(dg).length) h += `<tr><td colspan="3" class="empty">${t('prov.none')}</td></tr>`;
  for (const [k, v] of Object.entries(dg).sort((a, b) => b[1] - a[1]))
    if (v) h += `<tr><td class="mono">${esc(k)}</td><td class="muted">${esc(j.rule_desc?.[k] || '')}</td><td class="num">${v}</td></tr>`;
  h += '</tbody></table>';

  if (cv.verdict) {
    h += `<div class="sec" style="padding-left:0">${t('prov.recon')}</div>
      <div class="alert ${cv.verdict === 'AGREE' ? 'ok' : 'warn'}">
        ${t('prov.onlyplan')}: <b>${esc((cv.only_in_plan || []).join(', ') || t('prov.none'))}</b><br>
        ${t('prov.onlysched')}: <b>${esc((cv.only_in_schedule || []).join(', ') || t('prov.none'))}</b><br>
        ${t('prov.mismatch')}: <b>${(cv.area_mismatch || []).length}</b> ${t('cv.arean')}
      </div>`;
  }
  if ((j.warnings || []).length) {
    h += `<div class="sec" style="padding-left:0">${t('prov.warn')}</div>`;
    for (const w of j.warnings) h += `<div class="alert warn">${esc(w)}</div>`;
  }
  h += '</div>';
  $('#rpane').innerHTML = h;
}

/** 参数原名 t/s 会遮蔽全局 i18n 函数 t()，故改名为 _t/_s */
function emptyBox(_t, _s) {
  $('#rpane').innerHTML = `<div class="empty"><div class="big">${ic('table')}</div><b>${esc(_t)}</b><div style="margin-top:5px">${esc(_s)}</div></div>`;
}

// ============================================================ 动作
function filterFloor(code) { S.floorFilter = S.floorFilter === code ? null : code; S.pane = 'detail'; syncTabs(); renderDetail(); }

/** 某楼层要用哪些柜型 —— 按「该层 units 数」去柜型库里取。
 *
 *  用户口径：「这个区域，会根据每层楼的 units 的数量，显示对应的柜的
 *  所有的种类，比如 L4 有 3 个 units，会显示两个不同样式的 cupboards，
 *  这个是从柜型图里面获取」。
 *
 *  也就是**按套数匹配**：L4 是 3 户 -> 柜型库里 3 Units 那一组有几种
 *  摆法就显示几种（L4 恰好命中 2 种）。柜型来自 DWG 解析入库的
 *  variants，不做任何虚构。
 *
 *  排序与libraryGroups() 保持一致（宽 -> 高 -> code），
 *  这样这里的 Model A/B 字母与柜型库里看到的顺序对得上。
 */
function cupboardsForUnits(n) {
  const want = Number(n || 0);
  return S.variants
    // 只认 DWG 实测柜型。库里还躺着 11 条早期 seed_poc 演示数据
    //（尺寸 estimated、无渲染图），把它们算进来会让「L4 有 3 户」
    // 冒出 5 种柜型 —— 演示数据不是真实选型依据。
    .filter(v => v.source === 'dwg' && v.image_url)
    .filter(v => Number(v.positions || 0) === want)
    .sort((a, b) => (Number(a.w) - Number(b.w)) || (Number(a.h) - Number(b.h))
      || String(a.code).localeCompare(String(b.code)));
}

/** 建筑图纸 tab：选中某楼层后右栏的内容。
 *
 *  三块信息，按用户「右边是显示楼层的信息，每层楼的 units 的数量」：
 *    1. 楼层概览（units 数 /  communal 数）
 *    2. 该层每一户的柜型（来自解析结果的variant）
 *    3. **该层 units 数对应的全部柜型种类**（来自柜型库/DWG，带缩略图）
 */
function showFloorPanel(code) {
  const j = S.job;
  const f = (j?.floors || []).find(x => x.floor_code === code);
  if (!f) { filterFloor(code); return; }

  // 同步楼层选中态。函数也可能被直接调用（不经过树的点击分支），
  // 这里自己兜住，否则 saveViewState 存的是上一次的旧楼层 ——
  // 表现为「刷新后跳回 L4 而不是刚才看的 L2」。
  S.floorSel = code;
  S.floorFilter = code;
  const n = Number(f.unit_count || 0);
  const list = cupboardsForUnits(n);
  const units = (j.units || []).filter(u => u.floor === code);
  const suffixOf = (v) => {
    if (list.length <= 1) return '';
    const i = list.findIndex(x => String(x.id) === String(v.id));
    return i >= 0 ? ' - ' + String.fromCharCode(65 + i) : '';
  };

  // ---- 中栏：建筑图纸 tab 也要能看到图纸本身 ----
  $('#mfn').textContent = code + ' · ' + n + (LANGNOW === 'zh' ? ' 户' : ' units');
  $('#pagelist').innerHTML = '';
  resetViewer();
  $('#bparse').style.display = 'none';
  if (S.jobId) showPdf(S.jobId, S.pages?.length ? S.pages : []);

  let h = '';
  // ---- 1. 楼层概览 ----
  h += `<div class="sec" style="padding-left:0">${esc(code)}</div>
    <div class="kpirow">
      <div class="kpi"><div class="v">${n}</div><div class="l">${t('kpi.units')}</div></div>
      <div class="kpi"><div class="v">${f.communal_count || 0}</div>
        <div class="l">${LANGNOW === 'zh' ? '公共' : 'Communal'}</div></div>
      <div class="kpi"><div class="v">${list.length}</div>
        <div class="l">${LANGNOW === 'zh' ? '柜型种类' : 'Cupboards'}</div></div>
    </div>`;

  // ---- 2. 该层每户的柜型 ----
  if (units.length) {
    // unit_count 只数住宅，不含 communal。所以L4 上面写「3 户」、
    // 下面却列出 401/402/403/CLA2 四行，看着像漏了一户 —— 把口径写明。
    const nPriv = units.filter(u => !u.is_communal).length;
    const nCom = units.length - nPriv;
    h += `<div class="sec" style="padding-left:0">${
      LANGNOW === 'zh' ? '本层各户配置' : 'Units on this floor'}${
      nCom ? `<span style="color:var(--dim);font-weight:400"> · ${
        LANGNOW === 'zh'
          ? `${nPriv} 住宅 + ${nCom} 公共（上方 units 数不含公共户）`
          : `${nPriv} private + ${nCom} communal (unit count excludes communal)`}</span>` : ''
    }</div>
      <table><thead><tr><th>${t('d.empty')}</th><th>${t('d.type')}</th>
      <th>${t('d.cup')}</th><th class="num">${t('d.size')}</th></tr></thead><tbody>`;
    for (const u of units) {
      const v = u.variant || {};
      h += `<tr><td class="mono"><b>${esc(u.unit_label)}</b>${
        u.is_communal ? ' <span class="tag com">C</span>' : ''}</td>
        <td>${esc(u.unit_type || '—')}</td>
        <td class="mono">${esc(v.code || t('mtx.nomatch'))}</td>
        <td class="num" style="font-size:10.5px">${
          v.w ? `${fmtMM(v.w)}×${fmtMM(v.h)}` : '—'}</td></tr>`;
    }
    h += '</tbody></table>';
  }

  // ---- 3. 该 units 数对应的全部柜型种类（用户核心诉求）----
  h += `<div class="sec" style="padding-left:0">${
    LANGNOW === 'zh' ? `柜型库中 ${n} Units 的全部种类`
                    : `All ${n}-unit cupboards in the library`}</div>`;
  if (!list.length) {
    h += `<div class="empty"><div class="big">${ic('image-off')}</div><b>${
      LANGNOW === 'zh' ? '柜型库里还没有这个套数的柜型'
                      : 'No cupboard of this size in the library'}</b></div>`;
  } else {
    if (list.length > 1) {
      h += `<div class="alert ok" style="margin-bottom:10px">${
        LANGNOW === 'zh'
          ? `${code} 每层 ${n} 户，需要 ${n} Units 的柜；柜型库里有 ${list.length} 种不同摆法可选。`
          : `${code} has ${n} units per floor; the library holds ${list.length} layouts.`}</div>`;
    }
    h += '<div class="cupgrid">';
    for (const v of list) {
      h += `<div class="cupwrap"><div class="cupcard${v.image_url ? ' has-img' : ''}"
        data-img="${esc(v.image_url || '')}">
        <div class="thumb">${v.image_url
          ? `<img loading="lazy" src="${esc(v.image_url)}" alt="${esc(v.code)}">`
          : `<div class="noph">${t('lib.noimg')}</div>`}</div>
        <div class="meta">
          <div class="code mono">${esc(vLabel(v, n + ' ' + t('lib.units')) + suffixOf(v))}</div>
          <div class="dim">${n} ${t('lib.units')}${esc(suffixOf(v))} · ${esc(v.grid || '-')}</div>
          <div class="dim">${fmtMM(v.w)} × ${fmtMM(v.h)} × ${fmtMM(v.d)} mm</div>
        </div></div></div>`;
    }
    h += '</div>';
  }
  $('#rpane').innerHTML = h;
  // 楼层选中也要持久化 —— 刷新后要回到这一层。saveViewState 原本
  // 只在 gotoView 末尾调，那时 floorSel 还是上一次的旧值。
  saveViewState();

  // 点缩略图 -> 中栏看大图（直接用 DWG 渲出来的原版图，不做二次绘制）
  $$('#rpane .cupcard').forEach(x => x.onclick = () => {
    const u = x.dataset.img;
    if (!u) { toast(t('lib.noclue'), 'err'); return; }
    const v = list.find(y => y.image_url === u);
    // 尺寸一行、型号一行，别把套数写两遍（同 capOf 的叠字问题）
    showCupImage(u, v ? `<b>${fmtMM(v.w)} × ${fmtMM(v.h)} mm</b>${
      v.label ? ` · ${esc(v.label)}` : ''}<div class="muted">${
      n} ${t('lib.units')}${esc(suffixOf(v))}</div>` : '');
    $$('#rpane .cupcard').forEach(y => y.classList.toggle('on', y === x));
  });
  applyZoomToImages();
}

/** 柜型库详情：柜型卡片带缩略图，点卡片看中栏大图。
 *  需求：「将里面的不同的柜型都导出成jpg 格式，放在 library 里，可以点击查看」 */
/** 右侧：显示某个「N Units」下的**全部**摆法
 *
 *  key 形如 ``<dwgFileName>#<units>``。不去重（用户明确要求），
 *  所以同套数下有几个柜就平铺几张图，每张标注尺寸与排布，
 *  尺寸不同就是不同的摆法（1315×2250 与 1315×2300 算两种）。
 */
function showUnitsGroup(key, keepScroll) {
  // key 有两种形态：
  //   ``<fname>#<units>``      整个套数组（平铺全部摆法）
  //   ``<fname>#<units>@<id>`` 某一个具体摆法（树上「6 Units - B」）
  const at = String(key).indexOf('@');
  const onlyId = at >= 0 ? String(key).slice(at + 1) : '';
  const base = at >= 0 ? String(key).slice(0, at) : String(key);
  const hash = base.lastIndexOf('#');
  const fname = hash >= 0 ? base.slice(0, hash) : base;
  const n = hash >= 0 ? Number(base.slice(hash + 1)) : 0;
  // 按 units 找，不限定来自哪份 DWG —— 树上根节点就是 units，
  // 同一套数下多份图纸的柜型都该列出来（用户按套数找柜，不关心来源）。
  // 同样只取 DWG 实测柜型，理由同 libraryGroups()：seed_poc 演示数据
  // 不是选型依据，混进来会让同一套数凭空多出几种「柜型」。
  const pool = S.variants.filter(v => {
    if (v.source !== 'dwg') return false;
    if (fname && !onlyId) {
      const vf = v.source_name || v.dwg_name || t('tree.library');
      if (vf !== fname) return false;
    }
    return Number(v.positions || 0) === n;
  });
  // 与 libraryGroups() 保持同样的排序，树上第 i 个字母对应这里第 i 个
  const sortedPool = [...pool].sort((a, b) =>
    (Number(a.w) - Number(b.w)) || (Number(a.h) - Number(b.h))
    || String(a.code).localeCompare(String(b.code)));
  const items = onlyId
    ? pool.filter(v => String(v.id) === onlyId)
    : sortedPool;
  // 后缀字母：始终按**整组**的排序位置算，不能用 items.indexOf ——
  // 选中单个变体时 items 只有一条，会永远算成 "A"。
  const suffixOf = (v) => {
    if (sortedPool.length <= 1) return '';
    const i = sortedPool.findIndex(x => String(x.id) === String(v.id));
    return i >= 0 ? ' - ' + String.fromCharCode(65 + i) : '';
  };
  const withImg = items.filter(v => v.image_url);
  const scroll0 = keepScroll ? ($('#rpane')?.scrollTop || 0) : 0;

  $('#mfn').textContent = dispName(fname) + ' · ' + n + ' ' + t('lib.units')
    + (items.length === 1 ? suffixOf(items[0]) : '');
  $('#pagelist').innerHTML = '';
  resetViewer();
  $('#bpage').style.display = withImg.length ? '' : 'none';
  if (withImg.length) $('#bpage').textContent = `${withImg.length} ${t('lib.img')}`;
  $('#bparse').style.display = 'none';

  // 尺寸标注块：图下方直接写实际尺寸（用户要求「图片 + 下面显示尺寸」）
  const capOf = (v) => {
    if (!v) return '';
    const src = v.size_source || 'estimated';
    const tag = src === 'measured' ? (LANGNOW === 'zh' ? 'DWG 实测' : 'measured')
      : src === 'manual' ? (LANGNOW === 'zh' ? '人工录入' : 'manual')
      : (LANGNOW === 'zh' ? '待实测' : 'estimated');
    // 这一行只放尺寸本身。柜型名（有 label 就用 label）另起，
    // 套数在下面那行已经写了 —— 之前这里回退成「5 Units」，
    // 渲染出来是「1065 × 2350 mm · 5 套5 套 · 2x4」这种叠字。
    return `<b>${fmtMM(v.w)} × ${fmtMM(v.h)} mm</b>`
      + ((v.d && v.d !== 'null') ? ` · D ${fmtMM(v.d)}` : '')
      + (v.label ? ` · ${esc(v.label)}` : '')
      + `<div class="muted">${n} ${t('lib.units')} · ${esc(v.grid || '-')} · ${tag}</div>`;
  };

  if (withImg.length) showCupImage(withImg[0].image_url, capOf(withImg[0]));
  else $('#viewer').innerHTML = `<div class="ph"><div class="big">${ic('image-off')}</div>
    <div>${t('lib.noimg')}</div></div>`;

  let h = `<div class="sec" style="padding-left:0">
      ${dispName(fname)} · <b>${n} ${t('lib.units')}</b> ·
      ${LANGNOW === 'zh' ? '共' : ''} ${pool.length}
      ${LANGNOW === 'zh' ? '种摆法' : (pool.length === 1 ? 'layout' : 'layouts')}
      ${onlyId ? `<span style="color:var(--dim)"> · ${LANGNOW === 'zh' ? '仅显示' : 'showing'} ${
        n}${suffixOf(items[0])}</span>` : ''}
    </div>`;
  if (pool.length > 1 && !onlyId) {
    h += `<div class="alert ok" style="margin-bottom:10px">
      ${LANGNOW === 'zh'
        ? `同样是 ${n} 套，柜子的尺寸和 meter 摆放方式可以不同 —— 下面 ${pool.length} 种都是这个套数的合法柜型。`
        : `All ${pool.length} below hold ${n} units; only the size and meter layout differ.`}
    </div>`;
  }
  h += '<div class="cupgrid">';
  for (const v of items) {
    const src = v.size_source || 'estimated';
    const srcTag = src === 'measured' ? `<span class="tag ok">${t('lib.measured')}</span>`
      : src === 'manual' ? `<span class="tag">${t('lib.manual')}</span>`
      : `<span class="tag warn">${t('lib.estimated')}</span>`;
    h += `<div class="cupwrap">
    <div class="cupcard${v.image_url ? ' has-img' : ''}" data-img="${esc(v.image_url || '')}">
      <div class="thumb">${v.image_url
        ? `<img loading="lazy" src="${esc(v.image_url)}" alt="${esc(v.code)}">`
        : `<div class="noph">${t('lib.noimg')}</div>`}</div>
      <div class="meta">
        <div class="code mono">${esc(v.code)}</div>
        <div class="dim">${n} ${t('lib.units')}${esc(suffixOf(v))} · ${esc(v.grid || '-')}</div>
        <div class="dim">${fmtMM(v.w)} × ${fmtMM(v.h)} × ${fmtMM(v.d)} mm ${srcTag}</div>
        ${v.description ? `<div class="desc">${esc(v.description)}</div>` : ''}
      </div></div>
      <button class="cupdel" data-del="${v.id}" data-code="${esc(v.code)}"
        title="${t('lib.del')}">${ic('x')}</button></div>`;
  }
  h += '</div>';
  $('#rpane').innerHTML = h;
  if (scroll0) $('#rpane').scrollTop = scroll0;

  $$('#rpane .cupcard').forEach(x => x.onclick = () => {
    const u = x.dataset.img;
    if (!u) { toast(t('lib.noclue'), 'err'); return; }
    showCupImage(u);
    $$('#rpane .cupcard').forEach(y => y.classList.toggle('on', y === x));
  });
  bindCupDelete();
}

function showVariantGroup(key) {
  const items = S.variants.filter(v => (v.bucket || 'p' + v.positions) === key);
  const withImg = items.filter(v => v.image_url);
  $('#mfn').textContent = t('tree.library') + ' · ' + (items[0]?.bucket_label || key);
  $('#pagelist').innerHTML = '';
  resetViewer();
  $('#bpage').style.display = '';
  $('#bpage').textContent = `${withImg.length} ${t('lib.img')}`;

  // 默认展示第一张有图的柜型
  if (withImg.length) showCupImage(withImg[0].image_url);
  else $('#viewer').innerHTML = `<div class="ph"><div class="big">${ic('image-off')}</div>

  h += '<div class="cupgrid">';
  for (const v of items) {
    const src = v.size_source || 'estimated';
    const srcTag = src === 'measured' ? `<span class="tag ok">${t('lib.measured')}</span>`

      : `<span class="tag warn">${t('lib.estimated')}</span>`;
    // 删除按钮挂在卡片外层右上角，避免和「点击看大图」抢事件
    h += `<div class="cupwrap">
    <div class="cupcard${v.image_url ? ' has-img' : ''}" data-img="${esc(v.image_url || '')}">
      <div class="thumb">${v.image_url
        ? `<img loading="lazy" src="${esc(v.image_url)}" alt="${esc(v.code)}">`
        : `<div class="noph">${t('lib.noimg')}</div>`}</div>
      <div class="meta">
        <div class="code mono">${esc(v.code)}</div>
        <div class="dim">${v.positions} ${t('dwg.pos')} · ${esc(v.grid || '-')}</div>
        <div class="dim">${fmtMM(v.w)} × ${fmtMM(v.h)} × ${fmtMM(v.d)} mm ${srcTag}</div>
        ${v.description ? `<div class="desc">${esc(v.description)}</div>` : ''}
      </div></div>
      <button class="cupdel" data-del="${v.id}" data-code="${esc(v.code)}"
        title="${t('lib.del')}">${ic('x')}</button></div>`;
  }

  $('#rpane').innerHTML = h;

  $$('#rpane .cupcard').forEach(n => n.onclick = () => {

    if (!u) { toast(t('lib.noclue'), 'err'); return; }
    showCupImage(u);
    $$('#rpane .cupcard').forEach(x => x.classList.toggle('on', x === n));
  });
  bindCupDelete();
}

/** 删除柜型 —— 用户诉求：「里面不需要的数据，我需要可以删除」。
 *  删完必须重建当前分组视图，否则卡片还挂在界面上，
 *  用户会以为没删掉。 */
function bindCupDelete() {
  $$('#rpane .cupdel').forEach(btn => {
    btn.onclick = async (ev) => {
      ev.stopPropagation();
      const id = +btn.dataset.del;
      const code = btn.dataset.code;
      if (!confirm((LANGNOW === 'zh'
        ? `确定删除柜型 ${code}？\n该柜型的图纸也会一并删除。`
        : `Delete cupboard ${code}? Its drawing will be removed too.`))) return;
      btn.disabled = true;
      try {
        await api(`/variants/${id}`, { method: 'DELETE' });
        toast(`${t('lib.deldone')} ${code}`, 'ok');
        await loadVariants();
        const cur = $('#mfn').textContent.split('·').pop().trim();
        showVariantGroup(cur);       // 重绘当前分组
      } catch (e) {
        toast(t('lib.delfail') + ': ' + e.message, 'err');
        btn.disabled = false;
      }
    };
  });
}

/** 中栏展示柜型大图 —— 直接用服务端渲染的 JPG，不做二次加载 */
/** 中栏显示柜型图。
 *
 *  user 诉求：「这个图不要自己绘制，直接使用 dwg 里面的图」——
 *  src 就是后端从 DWG 抠出来渲的那张 JPG，这里不做任何二次绘制。
 *  图下方标尺寸（用户要求「图片 + 下面显示尺寸」）。
 */
function showCupImage(url, cap) {
  $('#viewer').innerHTML =
    `<div class="cupview"><div class="zoomslot">
       <img id="cupimg" src="${esc(url)}" alt="cupboard">
     </div>
     ${cap ? `<div class="cupcap">${cap}</div>` : ''}</div>`;
  $('#viewer').scrollTop = 0;
  // 重建了 DOM，重新贴一次当前缩放（否则切图后缩放被重置成 100%）
  applyZoomToImages();
}

async function loadVariants() {
  try { S.variants = await api('/variants'); } catch (e) { S.variants = []; }
  // 后端按 meter 组合分组（需求 2：左侧种类 / 右侧排布）
  try {
    const g = await api('/cupboards');
    if (g && g.length) S.variants = S.variants.map(v => {
      const c = g.find(x => x.variants.some(y => y.code === v.code));
      return c ? { ...v, bucket: c.key, bucket_label: c.title } : v;
    });
  } catch (e) {}
  renderTree();
}

async function loadJob(jobId) {
  try {
    const j = await api(`/jobs/${jobId}`);
    S.job = {
      summary: j.summary, floors: j.floors || j.multi_signals?.floor_summary || [],
      units: j.units || [], multi_signals: j.multi_signals,
      diagnostics: j.diagnostics, warnings: j.warnings || [],
      cross_validation: j.cross_validation || {},
      rule_desc: j.rule_desc || {},
      config_version: j.config_version,
    };
    S.jobId = jobId;
    renderTree(); syncTabs(); renderPane();
    loadExports(jobId);
    // 中栏恢复原图预览：优先用解析时记录的页面角色清单
    const pages = S.job.pages || (j.multi_signals?.pages || []);
    if (pages.length) showPdf(jobId, pages);
    else showPdf(jobId, Array.from({ length: j.multi_signals?.page_count || 1 },
      (_, i) => ({ title: 'p' + (i + 1) })));
  } catch (e) { toast(t('load.fail') + ': ' + e.message, 'err'); }
}

function syncTabs() {
  $$('.rtabs button').forEach(b => b.classList.toggle('on', b.dataset.pane === S.pane));
}
function renderPane() {
  ({ matrix: renderMatrix, detail: renderDetail, prov: renderProv })[S.pane]();
}

  $('#viewer').innerHTML = `<div class="ph"><div class="big">${ic('file-text')}</div><div>${t('mid.ph')}</div></div>`;
