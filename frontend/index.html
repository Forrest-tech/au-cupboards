<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>AU Cupboards — 计量柜选型系统</title>
<style>
:root{
  --bg:#0f172a; --panel:#1e293b; --panel2:#334155; --line:#475569;
  --txt:#e2e8f0; --dim:#94a3b8; --accent:#3b82f6; --accent2:#1d4ed8;
  --ok:#22c55e; --warn:#f59e0b; --err:#ef4444; --purple:#a855f7;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{
  font:13px/1.5 -apple-system,"Segoe UI","Microsoft YaHei",sans-serif;
  background:var(--bg);color:var(--txt);overflow:hidden;
}
button{font:inherit;cursor:pointer;border:none;background:none;color:inherit}
input,select{font:inherit}

/* ---------- 顶栏 ---------- */
header{
  height:52px;display:flex;align-items:center;gap:18px;
  background:var(--panel);border-bottom:1px solid var(--line);padding:0 16px;flex-shrink:0;
}
.logo{font-weight:700;font-size:15px;color:#fff;letter-spacing:.3px;white-space:nowrap}
.logo span{color:var(--accent)}
nav{display:flex;gap:2px;flex:1}
nav button{
  padding:7px 14px;border-radius:6px;color:var(--dim);font-weight:500;transition:.15s;
}
nav button:hover{background:var(--panel2);color:var(--txt)}
nav button.on{background:var(--accent2);color:#fff}
.hstat{font-size:11px;color:var(--dim);white-space:nowrap}
.hstat b{color:var(--ok)}
.badge{
  display:inline-block;padding:2px 7px;border-radius:10px;font-size:10px;font-weight:600;
  background:var(--panel2);color:var(--dim);
}
.badge.on{background:#14532d;color:#4ade80}

/* ---------- 主体三栏 ---------- */
main{display:flex;height:calc(100% - 52px)}
#tree{
  width:250px;flex-shrink:0;background:var(--panel);border-right:1px solid var(--line);
  overflow-y:auto;padding:10px 0;
}
#mid{flex:1;min-width:0;display:flex;flex-direction:column;background:#0b1220;border-right:1px solid var(--line)}
#right{width:520px;flex-shrink:0;background:var(--panel);overflow-y:auto}

.sec{padding:9px 12px 4px;font-size:10px;font-weight:700;color:var(--dim);
  letter-spacing:1px;text-transform:uppercase}
.node{
  display:flex;align-items:center;gap:7px;padding:5px 12px;cursor:pointer;
  border-left:3px solid transparent;transition:.1s;
}
.node:hover{background:var(--panel2)}
.node.on{background:var(--panel2);border-left-color:var(--accent)}
.node .ico{width:14px;text-align:center;opacity:.75;font-size:11px}
.node .nm{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.node .ct{font-size:10px;color:var(--dim);font-variant-numeric:tabular-nums}
.node.lv1{padding-left:26px}
.node.lv2{padding-left:40px;font-size:12px;color:var(--dim)}

/* ---------- 中栏 ---------- */
.mid-bar{
  display:flex;align-items:center;gap:8px;padding:7px 12px;
  background:var(--panel);border-bottom:1px solid var(--line);flex-shrink:0;
}
.mid-bar .fn{
  flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;
  font-size:12px;color:var(--txt);
}
.btn{
  padding:5px 11px;border-radius:5px;background:var(--panel2);color:var(--txt);
  font-size:12px;font-weight:500;transition:.15s;white-space:nowrap;
}
.btn:hover{background:var(--line)}
.btn.pri{background:var(--accent2);color:#fff}
.btn.pri:hover{background:var(--accent)}
.btn.ok{background:#15803d;color:#fff}
.btn:disabled{opacity:.4;cursor:not-allowed}
.viewer{flex:1;overflow:auto;position:relative;background:#111827}
.viewer iframe,.viewer embed{width:100%;height:100%;border:none;display:block}
.viewer img{display:block;max-width:100%;margin:0 auto}
.viewer .ph{display:flex;height:100%;align-items:center;justify-content:center;color:var(--dim);flex-direction:column;gap:10px}
.page-list{
  width:120px;flex-shrink:0;background:var(--panel);border-right:1px solid var(--line);
  overflow-y:auto;padding:5px 0;
}
.page-list .pg{
  padding:4px 10px;font-size:11px;cursor:pointer;color:var(--dim);
  border-left:3px solid transparent;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;
}
.page-list .pg:hover{background:var(--panel2)}
.page-list .pg.on{background:var(--panel2);border-left-color:var(--accent);color:#fff}

/* ---------- 右栏 ---------- */
.rtabs{display:flex;background:var(--panel);border-bottom:1px solid var(--line);position:sticky;top:0;z-index:5}
.rtabs button{flex:1;padding:10px 4px;font-size:12px;color:var(--dim);border-bottom:2px solid transparent}
.rtabs button.on{color:#fff;border-bottom-color:var(--accent);background:var(--panel2)}
.rpane{padding:12px}
.kpis{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-bottom:12px}
.kpi{background:var(--panel2);border-radius:7px;padding:9px 10px;border-left:3px solid var(--accent)}
.kpi.g{border-left-color:var(--ok)} .kpi.p{border-left-color:var(--purple)}
.kpi.o{border-left-color:var(--warn)} .kpi.r{border-left-color:var(--err)}
.kpi .v{font-size:19px;font-weight:700;font-variant-numeric:tabular-nums;line-height:1.2}
.kpi .l{font-size:10px;color:var(--dim);margin-top:1px}

table{width:100%;border-collapse:collapse;font-size:11.5px}
th{
  background:var(--panel2);padding:6px 5px;text-align:left;font-weight:600;
  font-size:10.5px;color:var(--dim);position:sticky;top:0;white-space:nowrap;
  border-bottom:1px solid var(--line);
}
td{padding:5px;border-bottom:1px solid #33415580;vertical-align:top}
tr:hover td{background:#ffffff08}
tr.floor-row td{background:var(--panel2);font-weight:700;border-top:2px solid var(--line)}
.num{text-align:right;font-variant-numeric:tabular-nums}
.mono{font-family:ui-monospace,Menlo,Consolas,monospace;font-size:11px}
.tag{
  display:inline-block;padding:1px 6px;border-radius:4px;font-size:10px;
  font-weight:600;white-space:nowrap;
}
.tag.high{background:#14532d;color:#4ade80}
.tag.medium{background:#78350f;color:#fbbf24}
.tag.low{background:#7f1d1d;color:#fca5a5}
.tag.acc{background:#4c1d95;color:#c4b5fd}
.tag.com{background:#1e3a8a;color:#93c5fd}
.tag.err{background:#7f1d1d;color:#fca5a5}
.tag.warn{background:#78350f;color:#fbbf24}
.muted{color:var(--dim)}
.err-t{color:var(--err)} .ok-t{color:var(--ok)} .warn-t{color:var(--warn)}

.alert{
  padding:8px 11px;border-radius:6px;font-size:11.5px;margin-bottom:11px;
  border-left:3px solid;
}
.alert.ok{background:#052e16aa;border-color:var(--ok);color:#86efac}
.alert.warn{background:#422006aa;border-color:var(--warn);color:#fcd34d}
.alert.err{background:#450a0aaa;border-color:var(--err);color:#fca5a5}
.alert.info{background:#0c1e3faa;border-color:var(--accent);color:#93c5fd}

.empty{padding:36px 20px;text-align:center;color:var(--dim);font-size:12px}
.empty .big{font-size:30px;margin-bottom:8px;opacity:.4}

.bar{height:16px;background:var(--panel2);border-radius:3px;overflow:hidden;display:flex}
.bar i{display:block;height:100%}
.legend{display:flex;gap:12px;flex-wrap:wrap;font-size:11px;margin:8px 0}
.legend span{display:flex;align-items:center;gap:5px}
.legend b{width:11px;height:11px;border-radius:2px;display:inline-block}

/* ---------- 抽屉/弹窗 ---------- */
.mask{
  position:fixed;inset:0;background:#000a;display:none;
  align-items:center;justify-content:center;z-index:100;padding:20px;
}
.mask.on{display:flex}
.modal{
  background:var(--panel);border-radius:10px;width:100%;max-width:820px;
  max-height:88vh;display:flex;flex-direction:column;
  border:1px solid var(--line);box-shadow:0 20px 60px #000b;
}
.modal h2{
  padding:13px 16px;font-size:14px;border-bottom:1px solid var(--line);
  display:flex;align-items:center;justify-content:space-between;
}
.mbody{padding:16px;overflow-y:auto;flex:1}
.mfoot{padding:11px 16px;border-top:1px solid var(--line);display:flex;gap:8px;justify-content:flex-end}
.x{font-size:18px;color:var(--dim);line-height:1}
.x:hover{color:var(--txt)}

.drop{
  border:2px dashed var(--line);border-radius:9px;padding:26px;text-align:center;
  cursor:pointer;transition:.15s;margin-bottom:14px;
}
.drop:hover,.drop.hot{border-color:var(--accent);background:#1d4ed822}
.drop .big{font-size:28px;margin-bottom:6px;opacity:.5}
.flist{display:flex;flex-direction:column;gap:5px;font-size:11.5px}
.flist .f{
  display:flex;align-items:center;gap:9px;padding:6px 10px;
  background:var(--panel2);border-radius:5px;
}
.flist .f .n{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}

.fld{margin-bottom:12px}
.fld label{display:block;font-size:11px;color:var(--dim);margin-bottom:4px}
.fld input,.fld select,.fld textarea{
  width:100%;padding:7px 9px;background:var(--panel2);border:1px solid var(--line);
  border-radius:5px;color:var(--txt);font:inherit;
}
.fld textarea{resize:vertical;min-height:70px}
.row{display:flex;gap:10px}
.row>*{flex:1}

.spin{
  display:inline-block;width:13px;height:13px;border:2px solid #fff4;
  border-top-color:#fff;border-radius:50%;animation:sp .7s linear infinite;
}
@keyframes sp{to{transform:rotate(360deg)}}
.toast{
  position:fixed;bottom:18px;right:18px;background:var(--panel);
  border:1px solid var(--line);border-left:3px solid var(--accent);
  padding:10px 15px;border-radius:7px;font-size:12px;z-index:200;
  box-shadow:0 8px 26px #000a;max-width:380px;
}
.toast.ok{border-left-color:var(--ok)}
.toast.err{border-left-color:var(--err)}
</style>
</head>
<body>

<header>
  <div class="logo">AU<span>·</span>Cupboards</div>
  <nav>
    <button class="on" data-view="work">工作台</button>
    <button data-view="cupboard">柜型库</button>
    <button data-view="building">Buildings</button>
  </nav>
  <div class="hstat" id="hstat">连接中…</div>
</header>

<main>
  <!-- ============ 左：树导航 ============ -->
  <div id="tree"></div>

  <!-- ============ 中：文档原样预览 ============ -->
  <div id="mid">
    <div class="mid-bar">
      <span class="fn" id="mfn">未选择文件</span>
      <button class="btn" id="bprev">◀</button>
      <span class="badge" id="bpage">– / –</span>
      <button class="btn" id="bnext">▶</button>
      <button class="btn pri" id="bparse">重新解析</button>
    </div>
    <div style="display:flex;flex:1;min-height:0">
      <div class="page-list" id="pagelist"></div>
      <div class="viewer" id="viewer">
        <div class="ph"><div class="big">▤</div><div>上传建筑图纸后在此原样预览</div></div>
      </div>
    </div>
  </div>

  <!-- ============ 右：工作区 ============ -->
  <div id="right">
    <div class="rtabs">
      <button class="on" data-pane="matrix">楼层 × 柜型</button>
      <button data-pane="detail">单元明细</button>
      <button data-pane="prov">溯源诊断</button>
    </div>
    <div id="rpane"></div>
  </div>
</main>

<div class="mask" id="mask"><div class="modal" id="modal"></div></div>

<script>
const S = {          // 全局状态
  view: 'work', pane: 'matrix',
  projects: [], job: null, curBuilding: null, curPage: 0,
  variants: [], treeSel: null,
};
const $ = s => document.querySelector(s);
const $$ = s => [...document.querySelectorAll(s)];
const esc = s => String(s ?? '').replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const num = (v, d = 2) => (v === null || v === undefined || v === '') ? '—' : Number(v).toFixed(d);

function toast(msg, kind = '') {
  const t = document.createElement('div');
  t.className = 'toast ' + kind; t.textContent = msg;
  document.body.appendChild(t);
  setTimeout(() => t.remove(), kind === 'err' ? 6500 : 3500);
}
async function api(path, opt = {}) {
  const r = await fetch('/api' + path, opt);
  if (!r.ok) {
    let d = ''; try { d = (await r.json()).detail || ''; } catch (e) {}
    throw new Error(`${r.status} ${d || r.statusText}`);
  }
  return r.json();
}
function modal(html) { $('#modal').innerHTML = html; $('#mask').classList.add('on'); }
function closeModal() { $('#mask').classList.remove('on'); }

// ============================================================ 启动
async function boot() {
  try {
    const h = await api('/health');
    $('#hstat').innerHTML =
      `规则 v${esc(h.config_version)} · ${h.dwg_ready
        ? '<span class="badge on">DWG 就绪</span>'
        : '<span class="badge">DWG 未装后端</span>'}`;
  } catch (e) {
    $('#hstat').innerHTML = '<span class="err-t">后端未连接</span>';
  }
  await loadTree();
  await loadVariants();
  // 自动恢复最近一次解析结果 —— 否则刷新后界面是空的
  try {
    const jobs = await api('/jobs?limit=1');
    if (jobs.length) {
      S.curBuilding = jobs[0].building_id ?? S.curBuilding;
      await loadJob(jobs[0].id);
      showPdf(jobs[0].id, S.pages?.length ? S.pages : []);
    }
  } catch (e) {}
}

async function loadTree() {
  try {
    S.projects = await api('/projects');
  } catch (e) { S.projects = []; }
  renderTree();
}

function renderTree() {
  let h = '<div class="sec">建筑项目</div>';
  if (!S.projects.length) {
    h += '<div class="node lv1" style="color:var(--dim)">（暂无，点顶部 Buildings 上传）</div>';
  }
  for (const p of S.projects) {
    const on = S.curBuilding === p.id ? ' on' : '';
    const job = S.job;
    h += `<div class="node${on}" data-b="${p.id}">
      <span class="ico">▦</span><span class="nm">${esc(p.name)}</span>
      <span class="ct">${(p.drawings || []).length} 图</span></div>`;
    if (S.curBuilding === p.id) {
      const d = (p.drawings || [])[0];
      if (d) {
        h += `<div class="node lv1${S.treeSel === 'drawing' ? ' on' : ''}" data-sel="drawing">
          <span class="ico">▤</span><span class="nm">${esc(d.title || '图纸')}</span>
          <span class="ct">${d.page_count || 0}p</span></div>`;
        if (job) {
          h += `<div class="node lv1${S.treeSel === 'floors' ? ' on' : ''}" data-sel="floors">
            <span class="ico">≡</span><span class="nm">楼层 × units</span>
            <span class="ct">${job.floors?.length || 0}</span></div>`;
          for (const f of (job.floors || [])) {
            h += `<div class="node lv2" data-floor="${esc(f.floor_code)}">
              <span class="nm">${esc(f.floor_code)}</span>
              <span class="ct">${f.unit_count}户${f.communal_count ? '+' + f.communal_count : ''}</span></div>`;
          }
        }
      }
    }
  }
  h += '<div class="sec">柜型库</div>';
  for (const g of variantGroups()) {
    h += `<div class="node lv1${S.treeSel === 'vg:' + g.key ? ' on' : ''}" data-vg="${esc(g.key)}">
      <span class="ico">⊞</span><span class="nm">${esc(g.title)}</span>
      <span class="ct">${g.count} 种</span></div>`;
  }
  $('#tree').innerHTML = h;
  $$('#tree .node').forEach(n => n.onclick = () => {
    if (n.dataset.b) { S.curBuilding = +n.dataset.b; S.treeSel = null; renderTree(); }
    else if (n.dataset.sel) { S.treeSel = n.dataset.sel; renderTree(); }
    else if (n.dataset.floor) filterFloor(n.dataset.floor);
    else if (n.dataset.vg) { S.treeSel = n.dataset.vg; showVariantGroup(n.dataset.vg); }
  });
}

function variantGroups() {
  const g = {};
  for (const v of S.variants) {
    // 按 water+gas 表位组合分组（需求 2：按 meter 组合分组）
    const key = v.bucket || ('p' + v.positions);
    (g[key] = g[key] || []).push(v);
  }
  return Object.entries(g).map(([key, items]) => ({
    key, count: items.length,
    title: items[0].bucket_label || (items[0].positions + ' 表位'),
  }));
}

// ============================================================ 楼层 × 柜型矩阵（需求 1 核心）
function renderMatrix() {
  const j = S.job;
  if (!j) return emptyBox('尚未解析', '上传建筑图纸（PDF）后自动识别楼层与每层 units');
  const s = j.summary || {};
  const cv = j.cross_validation || {};

  let h = '<div class="rpane">';

  // KPI
  h += `<div class="kpis">
    <div class="kpi g"><div class="v">${s.total_units ?? 0}</div><div class="l">住宅 units</div></div>
    <div class="kpi p"><div class="v">${s.communal_units ?? 0}</div><div class="l">CO-LIVING</div></div>
    <div class="kpi"><div class="v">${(j.floors || []).length}</div><div class="l">楼层数</div></div>
    <div class="kpi ${s.errors ? 'r' : 'o'}"><div class="v">${s.errors ?? 0}/${s.warnings ?? 0}</div><div class="l">合规 错误/警告</div></div>
  </div>`;

  // 交叉验证
  if (cv && cv.verdict) {
    const cls = cv.verdict === 'AGREE' ? 'ok' : 'warn';
    h += `<div class="alert ${cls}">
      <b>双源交叉验证：${esc(cv.verdict)}</b> — 平面图 ${cv.plan_units} 户 ↔ 单元表 ${cv.schedule_units} 户，
      互证 ${cv.agreed} 户，一致率 ${cv.consistency ?? 0}
      ${(cv.area_mismatch || []).length ? `· 面积矛盾 ${cv.area_mismatch.length} 条` : '· 面积零矛盾'}
    </div>`;
  }

  // 楼层矩阵表：每层一行，内含各柜型
  h += '<div class="sec" style="padding-left:0">按楼层 × 柜型</div>';
  h += '<table><thead><tr><th>楼层</th><th class="num">units</th><th class="num">COLIVING</th>'
     + '<th class="num">总面积 m²</th><th>柜型（类型 / 样式 / 尺寸）</th></tr></thead><tbody>';

  for (const f of (j.floors || [])) {
    const units = (j.units || []).filter(u => u.floor === f.floor_code);
    const groups = {};
    for (const u of units) {
      const k = u.variant?.code || '未匹配';
      (groups[k] = groups[k] || { n: 0, u: [], v: u.variant || null }).n++;
      groups[k].u.push(u.unit_label);
    }
    const nVar = Object.keys(groups).length;
    h += `<tr class="floor-row"><td>${esc(f.floor_code)}</td>
      <td class="num">${f.unit_count}</td>
      <td class="num">${f.communal_count || 0}</td>
      <td class="num">${num(f.total_area_m2, 1)}</td>
      <td>${nVar} 种</td></tr>`;
    for (const [code, g] of Object.entries(groups).sort((a, b) => b[1].n - a[1].n)) {
      const v = g.v || {};
      h += `<tr>
        <td style="padding-left:16px;color:var(--dim)">└</td>
        <td class="num muted">${g.n}</td>
        <td colspan="2" class="muted">${g.u.length > 8 ? g.u.slice(0, 8).join(' ') + ' …' : g.u.join(' ')}</td>
        <td>
          <div><b class="mono">${esc(code)}</b>
            ${v.name ? '<span class="muted"> — ' + esc(v.name) + '</span>' : ''}
            ${g.u.some(x => x.startsWith('CLA')) ? '<span class="tag com">COLIVING</span>' : ''}
          </div>
          <div class="muted" style="font-size:10.5px">
            ${v.w ? `${v.w}W × ${v.h}H × ${v.d}D mm` : '尺寸待入库'}
            · ${v.positions ?? '?'} 表位 · ${v.grid ?? ''}
          </div>
          ${v.description ? `<div class="muted" style="font-size:10.5px">${esc(v.description.slice(0, 60))}</div>` : ''}
        </td></tr>`;
    }
  }
  h += '</tbody></table>';

  // 图例
  h += '<div class="legend">';
  for (const [c, n] of Object.entries(s.by_variant || {}))
    h += `<span><b style="background:var(--accent)"></b>${esc(c)} × ${n}</span>`;
  h += '</div></div>';
  $('#rpane').innerHTML = h;
}

function renderDetail() {
  const j = S.job;
  if (!j) return emptyBox('尚未解析', '上传图纸后此处显示逐户明细');
  const f = S.floorFilter;
  const units = (j.units || []).filter(u => !f || u.floor === f);
  let h = '<div class="rpane"><table><thead><tr>'
    + '<th>单元</th><th class="num">DRY</th><th class="num">WET</th><th>户型</th>'
    + '<th>柜型</th><th>排布</th><th class="num">尺寸 mm</th><th>溯源</th></tr></thead><tbody>';
  if (!units.length) h += '<tr><td colspan="8" class="empty">无匹配单元</td></tr>';
  for (const u of units) {
    const v = u.variant || {};
    const d = u.requirement_derivation || {};
    h += `<tr>
      <td class="mono"><b>${esc(u.unit_label)}</b>${u.is_communal ? ' <span class="tag com">C</span>' : ''}
        ${u.accessible ? '<span class="tag acc">ACC</span>' : ''}</td>
      <td class="num">${num(u.area_m2)}</td>
      <td class="num">${num(u.wet_area_m2)}</td>
      <td>${esc(u.unit_type || '—')}</td>
      <td class="mono">${esc(v.code || '未匹配')}</td>
      <td class="mono">${esc(v.grid || '—')}</td>
      <td class="num" style="font-size:10.5px">${v.w ? `${v.w}×${v.h}×${v.d}` : '—'}</td>
      <td style="font-size:10px">
        <span class="tag ${u.confidence_tier}">${({high:'高',medium:'中',low:'低'})[u.confidence_tier] || '—'}</span>
        ${d.bucket ? `<div class="muted">${esc(d.bucket)} ${esc(d.bucket_label || '')}</div>` : ''}
      </td></tr>`;
  }
  h += '</tbody></table></div>';
  $('#rpane').innerHTML = h;
}

function renderProv() {
  const j = S.job;
  if (!j) return emptyBox('尚未解析', '');
  const ms = j.multi_signals || {}, cv = j.cross_validation || {};
  let h = '<div class="rpane">';
  h += `<div class="alert info">规则版本 <b>v${esc(ms.config_version || '—')}</b>｜
    用 AI：${ms.used_ai ? '<span class="warn-t">是</span>' : '<span class="ok-t">否</span>'}｜
    解析前 ${ms.raw_units_before_dedup ?? '—'} 条 → 去重后 ${ms.total_units ?? '—'} 户｜
    有文本层页面 ${ms.pages_with_text ?? '—'}</div>`;

  h += '<div class="sec" style="padding-left:0">规则命中</div><table><thead><tr>'
    + '<th>规则</th><th>说明</th><th class="num">命中</th></tr></thead><tbody>';
  const dg = j.diagnostics || {};
  if (!Object.keys(dg).length) h += '<tr><td colspan="3" class="empty">无</td></tr>';
  for (const [k, v] of Object.entries(dg).sort((a, b) => b[1] - a[1]))
    if (v) h += `<tr><td class="mono">${esc(k)}</td><td class="muted">${esc(j.rule_desc?.[k] || '')}</td><td class="num">${v}</td></tr>`;
  h += '</tbody></table>';

  if (cv.verdict) {
    h += `<div class="sec" style="padding-left:0">双源对账明细</div>
      <div class="alert ${cv.verdict === 'AGREE' ? 'ok' : 'warn'}">
        仅平面图有：<b>${esc((cv.only_in_plan || []).join(', ') || '无')}</b><br>
        仅单元表有：<b>${esc((cv.only_in_schedule || []).join(', ') || '无')}</b><br>
        面积矛盾：<b>${(cv.area_mismatch || []).length}</b> 条
      </div>`;
  }
  if ((j.warnings || []).length) {
    h += '<div class="sec" style="padding-left:0">警告</div>';
    for (const w of j.warnings) h += `<div class="alert warn">${esc(w)}</div>`;
  }
  h += '</div>';
  $('#rpane').innerHTML = h;
}

function emptyBox(t, s) {
  $('#rpane').innerHTML = `<div class="empty"><div class="big">◫</div><b>${esc(t)}</b><div style="margin-top:5px">${esc(s)}</div></div>`;
}

// ============================================================ 动作
function filterFloor(code) { S.floorFilter = S.floorFilter === code ? null : code; S.pane = 'detail'; syncTabs(); renderDetail(); }

function showVariantGroup(key) {
  const items = S.variants.filter(v => (v.bucket || 'p' + v.positions) === key);
  modal(`<h2>柜型分组：${esc(items[0]?.bucket_label || key)}
      <span class="x" onclick="closeModal()">×</span></h2>
    <div class="mbody"><table><thead><tr>
      <th>变体编码</th><th>排布</th><th class="num">表位</th><th class="num">宽×高×深</th>
      <th class="num">表位间距</th><th>说明</th></tr></thead><tbody>
      ${items.map(v => `<tr><td class="mono">${esc(v.code)}</td><td class="mono">${esc(v.grid)}</td>
        <td class="num">${v.positions}</td>
        <td class="num">${v.w}×${v.h}×${v.d}</td>
        <td class="num">${v.spacing_h}/${v.spacing_v}</td>
        <td class="muted" style="font-size:10.5px">${esc(v.description || '')}</td></tr>`).join('')}
    </tbody></table></div>
    <div class="mfoot"><button class="btn" onclick="closeModal()">关闭</button></div>`);
}

async function loadVariants() {
  try { S.variants = await api('/variants'); } catch (e) { S.variants = []; }
  // 后端按 meter 组合分组（需求 2：左侧种类 / 右侧排布）
  try {
    const g = await api('/cupboards');
    if (g && g.length) S.variants = S.variants.map(v => {
      const c = g.find(x => x.variants.some(y => y.code === v.code));
      return c ? { ...v, bucket: c.key, bucket_label: c.title } : v;
    });
  } catch (e) {}
  renderTree();
}

async function loadJob(jobId) {
  try {
    const j = await api(`/jobs/${jobId}`);
    S.job = {
      summary: j.summary, floors: j.floors || j.multi_signals?.floor_summary || [],
      units: j.units || [], multi_signals: j.multi_signals,
      diagnostics: j.diagnostics, warnings: j.warnings || [],
      cross_validation: j.cross_validation || {},
      rule_desc: j.rule_desc || {},
      config_version: j.config_version,
    };
    S.jobId = jobId;
    renderTree(); syncTabs(); renderPane();
    loadExports(jobId);
    // 中栏恢复原图预览：优先用解析时记录的页面角色清单
    const pages = S.job.pages || (j.multi_signals?.pages || []);
    if (pages.length) showPdf(jobId, pages);
    else showPdf(jobId, Array.from({ length: j.multi_signals?.page_count || 1 },
      (_, i) => ({ title: 'p' + (i + 1) })));
  } catch (e) { toast('加载任务失败: ' + e.message, 'err'); }
}

function syncTabs() {
  $$('.rtabs button').forEach(b => b.classList.toggle('on', b.dataset.pane === S.pane));
}
function renderPane() {
  ({ matrix: renderMatrix, detail: renderDetail, prov: renderProv })[S.pane]();
}

// ============================================================ 预览
function showPlaceholder() {
  $('#viewer').innerHTML = '<div class="ph"><div class="big">▤</div><div>上传建筑图纸后在此原样预览</div></div>';
  $('#pagelist').innerHTML = '';
}
function showPdf(jobId, pages) {
  // /api/file/{job_id} 直接回传原始 PDF 字节（需求 1「原样显示」）
  S.curPage = 0; S.pdfUrl = '/api/file/' + jobId;
  renderPages(pages);
  gotoPage(0);
}
function renderPages(pages) {
  S.pages = pages || [];
  $('#pagelist').innerHTML = S.pages.map((p, i) =>
    `<div class="pg" data-p="${i}">${i + 1}. ${esc((p.title || '').slice(0, 14) || 'p' + (i + 1))}</div>`).join('');
  $$('#pagelist .pg').forEach(e => e.onclick = () => gotoPage(+e.dataset.p));
}
function gotoPage(i) {
  if (!S.pdfUrl || !S.pages?.length) return;
  S.curPage = Math.max(0, Math.min(i, S.pages.length - 1));
  const p = S.pages[S.curPage];
  $('#viewer').innerHTML = `<iframe src="${S.pdfUrl}#page=${S.curPage + 1}"></iframe>`;
  $('#bpage').textContent = `${S.curPage + 1} / ${S.pages.length}`;
  $$('#pagelist .pg').forEach((e, k) => e.classList.toggle('on', k === S.curPage));
  $('#mfn').textContent = S.curFile + ' — ' + (p.title || p.drawing_no || '');
}

// ============================================================ 导出
async function loadExports(jobId) {
  try {
    const ex = await api(`/jobs/${jobId}/exports`);
    S.exports = ex;
    $('#bexp')?.remove();
    const bar = document.createElement('div');
    bar.id = 'bexp'; bar.style.cssText = 'display:flex;gap:5px';
    bar.innerHTML = ['pdf', 'docx', 'jpg', 'xlsx', 'json'].map(k =>
      (ex[k] ? `<button class="btn ok" onclick="dlExport('${k}')">↓ ${k.toUpperCase()}</button>` : '')
    ).join('') || '<span class="muted" style="font-size:11px">尚未导出</span>';
    $('.mid-bar').appendChild(bar);
  } catch (e) {}
}
function dlExport(k) {
  const p = S.exports?.[k];
  if (!p) return;
  window.open('/api/download?path=' + encodeURIComponent(p), '_blank');
}

// ============================================================ 上传解析
function openUpload(kind) {
  const cfg = {
    building: { t: '添加 Building 图纸', accept: '.pdf,.docx,.jpg,.jpeg,.png,.dwg,.dxf',
      d: '需求 3：上传 building 图纸（PDF 为主，支持 Word/JPG/DWG）。系统会预览并自动解析楼层数与每层 unit 数量。' },
    cupboard: { t: '柜型库入库', accept: '.dwg,.dxf,.pdf',
      d: '需求 2：上传 DWG 柜型图 → 系统自动解析并分解成不同种类 → 确认后入库。' },
  }[kind];
  modal(`<h2>${esc(cfg.t)}<span class="x" onclick="closeModal()">×</span></h2>
    <div class="mbody">
      <div class="alert info">${esc(cfg.d)}</div>
      <div class="drop" id="dz">
        <div class="big">⬆</div>
        <div><b>点击选择</b> 或拖拽文件到此处</div>
        <div class="muted" style="font-size:11px;margin-top:4px">${esc(cfg.accept)}</div>
      </div>
      <input type="file" id="fi" style="display:none" accept="${cfg.accept}">
      <div id="upbox"></div>
      <div id="preview"></div>
    </div>
    <div class="mfoot">
      <button class="btn" onclick="closeModal()">取消</button>
      <button class="btn pri" id="bgo" disabled>解析并确认入库</button>
    </div>`);
  const dz = $('#dz'), fi = $('#fi');
  dz.onclick = () => fi.click();
  dz.ondragover = e => { e.preventDefault(); dz.classList.add('hot'); };
  dz.ondragleave = () => dz.classList.remove('hot');
  dz.ondrop = e => { e.preventDefault(); dz.classList.remove('hot'); if (e.dataTransfer.files[0]) doFile(e.dataTransfer.files[0], kind); };
  fi.onchange = () => fi.files[0] && doFile(fi.files[0], kind);
  S.uploadKind = kind;
}

async function doFile(f, kind) {
  S.uploadFile = f; S.uploadKind = kind;
  $('#bgo').disabled = false;
  // 本地预览
  const box = $('#preview');
  if (f.type.startsWith('image/')) {
    box.innerHTML = `<div class="alert info">图片预览</div><img src="${URL.createObjectURL(f)}" style="max-width:100%;border-radius:6px">`;
  } else {
    box.innerHTML = `<div class="alert info">已选择 <b>${esc(f.name)}</b>（${(f.size / 1024 / 1024).toFixed(2)} MB）。点击「解析并确认入库」开始。</div>`;
  }
  $('#upbox').innerHTML = `<div class="flist"><div class="f"><span class="n">${esc(f.name)}</span>
    <span class="badge">${(f.size / 1024 / 1024).toFixed(2)} MB</span></div></div>`;
}

async function submitUpload() {
  if (!S.uploadFile) return;
  const btn = $('#bgo');
  btn.disabled = true; btn.innerHTML = '<span class="spin"></span> 解析中…';
  const fd = new FormData();
  fd.append('file', S.uploadFile);
  fd.append('project', document.querySelector('#pname')?.value || '74 KEELER ST CARLINGFORD');
  try {
    const r = await api(`/parse?kind=${S.uploadKind}`, { method: 'POST', body: fd });
    if (r.kind === 'dwg') showDwgResult(r); else showPdfResult(r);
  } catch (e) {
    btn.disabled = false; btn.textContent = '解析并确认入库';
    toast('解析失败: ' + e.message, 'err');
  }
}

function showDwgResult(r) {
  S.dwgRes = r;
  // 弹窗未打开时 #bgo 不存在 —— 防御性判空，避免整个渲染函数抛错
  const btn = $('#bgo');
  if (btn) {
    btn.disabled = !r.ok;
    btn.textContent = r.ok ? '确认入库' : '不可入库';
    btn.onclick = () => commitDwg();
  }

  // 完整性分级：corrupt 必须显式红色警示，不能与 degraded/ok 混为一谈
  const integrityMap = {
    ok:       { cls: 'ok',   label: '完整性通过' },
    degraded: { cls: 'warn', label: '可用但存疑' },
    corrupt:  { cls: 'err',  label: '数据损坏' },
  };
  const ig = integrityMap[r.integrity] || { cls: '', label: r.integrity || '未知' };

  // r.blocks 是字符串数组，r.block_layers / r.block_entity_counts 是对照表
  const blocks = r.blocks || [];
  const bl = r.block_layers || {};
  const bc = r.block_entity_counts || {};
  const mspTotal = Object.values(r.entity_counts || {}).reduce((a, b) => a + b, 0);
  const blkTotal = Object.values(bc).reduce((a, b) => a + b, 0);

  $('#preview').innerHTML = `
    <div class="alert ${ig.cls}">
      解析后端：<b>${esc(r.backend)}</b>｜完整性：<b>${esc(ig.label)}</b>
      ${r.error ? '<br/>' + esc(r.error) : ''}
    </div>
    <div class="kpis">
      <div class="kpi"><div class="v">${(r.layers || []).length}</div><div class="l">图层</div></div>
      <div class="kpi p"><div class="v">${blocks.length}</div><div class="l">块定义</div></div>
      <div class="kpi g"><div class="v">${mspTotal + blkTotal}</div><div class="l">实体总数</div></div>
      <div class="kpi ${r.integrity === 'corrupt' ? 'r' : 'o'}"><div class="v">${(r.warnings || []).length}</div><div class="l">警告</div></div>
    </div>
    ${(r.integrity_notes || []).map(n => `<div class="alert ${r.integrity === 'corrupt' ? 'err' : 'warn'}">${esc(n)}</div>`).join('')}
    <div class="sec" style="padding-left:0">块定义（柜型候选）</div>
    <table><thead><tr><th>块名</th><th>所属图层</th><th class="num">实体数</th></tr></thead><tbody>
      ${blocks.slice(0, 40).map(b => `<tr><td class="mono">${esc(b)}</td>
        <td class="muted">${esc((bl[b] || []).join(', ') || '—')}</td>
        <td class="num">${(bc[b] ?? '—')}</td></tr>`).join('')
        || '<tr><td colspan="3" class="empty">未发现块定义</td></tr>'}
    </tbody></table>
    <div class="sec" style="padding-left:0">图层清单</div>
    <div>${(r.layers || []).map(l => `<span class="tag">${esc(l)}</span>`).join('') || '<span class="muted">无</span>'}</div>
    ${(r.warnings || []).map(w => `<div class="alert warn">${esc(w)}</div>`).join('')}`;
}

async function showPdfResult(r) {
  S.job = {
    summary: r.summary, floors: r.floor_summary || r.multi_signals?.floor_summary || [],
    units: r.units || [], multi_signals: r.multi_signals,
    diagnostics: r.diagnostics, warnings: r.warnings || [],
    cross_validation: r.cross_validation || r.multi_signals?.cross_validation || {},
    rule_desc: r.rule_desc || {},
    config_version: r.config_version,
  };
  S.curFile = S.uploadFile.name;
  S.curBuilding = r.building_id;
  $('#preview').innerHTML = `<div class="alert ok">
    <b>解析完成</b>｜住宅 ${r.summary.total_units} 户 + CO-LIVING ${r.summary.communal_units} 处
    ｜ 平均置信度 ${r.summary.avg_confidence}<br>
    交叉验证：${esc(S.job.cross_validation.verdict || 'n/a')}，一致率 ${S.job.cross_validation.consistency ?? '—'}
  </div>`;
  closeModal();
  await loadTree();
  await loadJob(r.job_id);
  showPdf(r.job_id, r.pages || []);
  renderPane();
}

async function commitDwg() {
  try {
    const r = await api('/cupboards/from-dwg', {
      method: 'POST', headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify(S.dwgRes),
    });
    toast(`已入库 ${r.created} 个柜型变体`, 'ok');
    closeModal(); await loadVariants();
  } catch (e) { toast('入库失败: ' + e.message, 'err'); }
}

// ============================================================ 绑定
$$('nav button').forEach(b => b.onclick = () => {
  $$('nav button').forEach(x => x.classList.remove('on'));
  b.classList.add('on'); S.view = b.dataset.view;
  if (S.view === 'cupboard') openUpload('cupboard');
  else if (S.view === 'building') openUpload('building');
  else { renderTree(); renderPane(); }
});
$$('.rtabs button').forEach(b => b.onclick = () => { S.pane = b.dataset.pane; syncTabs(); renderPane(); });
$('#bprev').onclick = () => gotoPage(S.curPage - 1);
$('#bnext').onclick = () => gotoPage(S.curPage + 1);
$('#bparse').onclick = () => openUpload('building');
$('#mask').onclick = e => { if (e.target.id === 'mask') closeModal(); };
document.addEventListener('keydown', e => {
  if (e.key === 'Escape') closeModal();
  if (e.key === 'ArrowLeft' && S.curPage) gotoPage(S.curPage - 1);
  if (e.key === 'ArrowRight') gotoPage(S.curPage + 1);
});

boot();
</script>
</body>
</html>
