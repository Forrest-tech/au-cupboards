<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>AU Cupboards — 计量柜选型系统</title>
<style>
:root{
  /* ---- 白色基调（light theme）----
     浅灰画布 + 纯白卡片 + 细分隔线，靠层次而非重色区分区块 */
  --bg:#f1f5f9; --panel:#ffffff; --panel2:#f8fafc; --line:#e2e8f0;
  --txt:#0f172a; --dim:#64748b; --accent:#2563eb; --accent2:#1d4ed8;
  --ok:#16a34a; --warn:#d97706; --err:#dc2626; --purple:#9333ea;
  /* 语义底色统一为浅色调，保证文字对比度 ≥4.5:1 */
  --ok-bg:#f0fdf4; --warn-bg:#fffbeb; --err-bg:#fef2f2; --info-bg:#eff6ff;
  --shadow:0 1px 3px #0f172a12, 0 1px 2px #0f172a0a;
  --shadow-lg:0 10px 40px #0f172a1f, 0 4px 12px #0f172a14;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{
  font:13px/1.5 -apple-system,"Segoe UI","Microsoft YaHei",sans-serif;
  background:var(--bg);color:var(--txt);overflow:hidden;
}
button{font:inherit;cursor:pointer;border:none;background:none;color:inherit}
input,select{font:inherit}

/* ---------- 顶栏 ---------- */
header{
  height:52px;display:flex;align-items:center;gap:18px;
  background:var(--panel);border-bottom:1px solid var(--line);padding:0 16px;flex-shrink:0;
}
.logo{font-weight:700;font-size:15px;color:var(--txt);letter-spacing:.3px;white-space:nowrap}
.logo span{color:var(--accent)}
nav{display:flex;gap:2px;flex:1}
nav button{
  padding:7px 14px;border-radius:6px;color:var(--dim);font-weight:500;transition:.15s;
}
nav button:hover{background:var(--panel2);color:var(--txt)}
nav button.on{background:var(--accent);color:#fff}
.hstat{font-size:11px;color:var(--dim);white-space:nowrap;display:flex;align-items:center;gap:10px}
.hstat b{color:var(--ok)}

/* 语言切换 + 顶栏上传按钮 */
.langsw{display:flex;border:1px solid var(--line);border-radius:5px;overflow:hidden;background:#fff}
.langsw button{padding:4px 9px;font-size:11px;color:var(--dim);transition:.15s}
.langsw button.on{background:var(--accent);color:#fff}
.langsw button:not(.on):hover{background:var(--panel2)}
.hupload{
  padding:6px 13px;border-radius:6px;background:var(--accent);color:#fff;
  font-size:12px;font-weight:600;transition:.15s;white-space:nowrap;
}
.hupload:hover{background:var(--accent2)}
.badge{
  display:inline-block;padding:2px 7px;border-radius:10px;font-size:10px;font-weight:600;
  background:var(--panel2);color:var(--dim);border:1px solid var(--line);
}
.badge.on{background:var(--ok-bg);color:var(--ok);border-color:#bbf7d0}
/* DWG 未就绪时徽章可点击，提示「点我装后端」 */
.badge.link{cursor:pointer;background:var(--warn-bg);color:var(--warn);border-color:#fde68a}
.badge.link:hover{background:#fef3c7}

/* ---- 柜型库：卡片网格 + 大图查看 ---- */
.cupgrid{
  display:grid;grid-template-columns:repeat(auto-fill,minmax(184px,1fr));
  gap:10px;padding:0 12px 14px;
}
.cupcard{
  border:1px solid var(--line);border-radius:8px;background:var(--panel);
  overflow:hidden;cursor:pointer;transition:border-color .12s,box-shadow .12s;
}
.cupcard:hover{border-color:var(--accent);box-shadow:var(--shadow)}
.cupcard.on{border-color:var(--accent);box-shadow:0 0 0 2px #2563eb33}
.cupcard .thumb{
  height:124px;background:var(--panel2);display:flex;
  align-items:center;justify-content:center;border-bottom:1px solid var(--line);
}
.cupcard .thumb img{max-width:100%;max-height:124px;object-fit:contain;display:block}
.cupcard .noph{font-size:11px;color:var(--dim);text-align:center;padding:0 8px}
.cupcard .meta{padding:7px 9px 9px}
.cupcard .code{font-size:11.5px;font-weight:600;color:var(--txt);
  word-break:break-all;line-height:1.35}
.cupcard .dim{font-size:10.5px;color:var(--dim);margin-top:2px}
.cupcard .desc{
  font-size:10.5px;color:var(--dim);margin-top:4px;
  display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;
}
/* ---- 卡片删除：按钮放外层，避免和「点卡片看大图」抢事件 ---- */
.cupwrap{position:relative}
.cupdel{
  position:absolute;top:3px;right:3px;width:19px;height:19px;line-height:17px;
  border:1px solid var(--line);border-radius:50%;background:#fff;color:var(--dim);
  font-size:13px;cursor:pointer;padding:0;text-align:center;opacity:0;
  transition:opacity .12s;
}
.cupwrap:hover .cupdel{opacity:1}
.cupdel:hover{background:#dc2626;border-color:#dc2626;color:#fff}
.cupdel:disabled{opacity:.4;cursor:not-allowed}
/* ---- 上传确认弹窗里的勾选 ---- */
.rendops{display:flex;align-items:center;gap:10px;margin:6px 0 9px;padding:0 2px}
.rendops .sp{flex:1}
.rendops label{cursor:pointer;font-size:12.5px;display:flex;align-items:center;gap:5px}
.cupcard[data-sel] .tick{
  position:absolute;top:5px;left:5px;width:17px;height:17px;line-height:17px;
  border-radius:50%;background:#2563eb;color:#fff;font-size:11px;text-align:center;
}
.cupcard .thumb{position:relative}
.cupcard[data-sel]{cursor:pointer}
.cupcard[data-sel]:not(.on){opacity:.42}
.cupcard[data-sel]:not(.on) .thumb{filter:grayscale(1)}
/* ---- 被排除的非柜型 block：折叠，默认可有可无 ---- */
.rejd{margin-top:12px;font-size:12px;color:var(--dim)}
.rejd summary{cursor:pointer;padding:5px 0;user-select:none}
.rejd summary:hover{color:var(--txt)}
.rejlist{
  max-height:190px;overflow:auto;border:1px solid var(--line);
  border-radius:6px;padding:6px 8px;background:#fafbfc;margin-top:5px;
}
.rejlist>div{display:flex;gap:8px;padding:2px 0;border-bottom:1px solid #f0f0f0}
.rejlist code{font-size:11px;color:var(--txt);flex:1;word-break:break-all}
.rejlist span{font-size:10.5px;color:var(--dim);white-space:nowrap}
/* ---- 柜型库批量管理条 ---- */
.mgmt{
  display:flex;align-items:center;gap:8px;margin:0 0 8px;padding:6px 9px;
  border:1px solid var(--line);border-radius:7px;background:#fafbfc;
}
.mgmt .sp{flex:1}
.mgmt .muted{font-size:11.5px}
.btn.sm{padding:3px 9px;font-size:11.5px}
.btn.sm.danger{color:#dc2626;border-color:#f0c4c4}
.btn.sm.danger:hover{background:#fef2f2}
.tag.ok{background:var(--ok-bg);color:var(--ok);border-color:#bbf7d0}
.tag.warn{background:var(--warn-bg);color:var(--warn);border-color:#fde68a}
.cupview{
  display:flex;align-items:center;justify-content:center;
  min-height:100%;padding:14px;background:var(--panel2);
}
.cupview img{max-width:100%;height:auto;background:#fff;
  border:1px solid var(--line);border-radius:6px}

/* ---- 柜型库 / Buildings 的文件列表页 ---- */
.filelist{padding:10px 12px}
.filelist .row-item{
  display:flex;align-items:center;gap:11px;padding:10px 12px;background:#fff;
  border:1px solid var(--line);border-radius:7px;margin-bottom:8px;box-shadow:var(--shadow);
}
.filelist .row-item .ico{
  width:30px;height:30px;border-radius:6px;background:var(--info-bg);color:var(--accent);
  display:flex;align-items:center;justify-content:center;font-size:14px;flex-shrink:0;
}
.filelist .row-item .nm{flex:1;min-width:0}
.filelist .row-item .nm .t{font-weight:600;font-size:12px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.filelist .row-item .nm .s{font-size:10.5px;color:var(--dim);margin-top:2px}

/* ---------- 主体三栏 ---------- */
main{display:flex;height:calc(100% - 52px)}
#tree{
  width:250px;flex-shrink:0;background:var(--panel);border-right:1px solid var(--line);
  overflow-y:auto;padding:10px 0;
}
#mid{flex:1;min-width:0;display:flex;flex-direction:column;background:#e8edf3;border-right:1px solid var(--line)}
#right{width:520px;flex-shrink:0;background:var(--panel);overflow-y:auto}

.sec{padding:9px 12px 4px;font-size:10px;font-weight:700;color:var(--dim);
  letter-spacing:1px;text-transform:uppercase}
.node{
  display:flex;align-items:center;gap:7px;padding:5px 12px;cursor:pointer;
  border-left:3px solid transparent;transition:.1s;
}
.node:hover{background:var(--panel2)}
.node.on{background:var(--panel2);border-left-color:var(--accent)}
.node .ico{width:14px;text-align:center;opacity:.75;font-size:11px}
/* 折叠箭头 */
.node .tw{
  width:11px;flex-shrink:0;font-size:9px;color:var(--dim);
  cursor:pointer;text-align:center;transition:.1s;
}
.node .tw:hover{color:var(--accent)}
.node .nm{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.node .ct{font-size:10px;color:var(--dim);font-variant-numeric:tabular-nums}
.node.lv1{padding-left:26px}
.node.lv2{padding-left:40px;font-size:12px;color:var(--dim)}
/* 同套数下的具体摆法（「6 Units - A」）：再缩进一级，字色加深 —— 它们
   才是真正会被选中的叶子节点，光靠 lv2 的灰色会显得像分类标题。 */
.node.lv2.lv3{padding-left:54px;color:var(--fg)}
.node.lv2.lv3:hover{background:#f2f6fb}

/* ---------- 中栏 ---------- */
.mid-bar{
  display:flex;align-items:center;gap:8px;padding:7px 12px;
  background:var(--panel);border-bottom:1px solid var(--line);flex-shrink:0;
}
.mid-bar .fn{
  flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;
  font-size:12px;color:var(--txt);
}
/* 滚动模式提示 —— 说明「整份连续显示」+ 怎么快速翻页 */
.mid-bar .hint{
  font-size:10.5px;color:var(--dim);white-space:nowrap;
  padding:2px 7px;background:var(--panel2);border-radius:4px;
}
@media (max-width:1200px){.mid-bar .hint{display:none}}
.btn{
  padding:5px 11px;border-radius:5px;background:var(--panel2);color:var(--txt);
  font-size:12px;font-weight:500;transition:.15s;white-space:nowrap;
}
.btn:hover{background:#e2e8f0}
.btn.pri{background:var(--accent);color:#fff}
.btn.pri:hover{background:var(--accent)}
.btn.ok{background:var(--ok);color:#fff}
.btn:disabled{opacity:.4;cursor:not-allowed}
.viewer{flex:1;overflow:auto;position:relative;background:#e8edf3}
/* ---- 连续滚动模式：全部页面依次排开，像看长文档 ---- */
.viewer.scrollmode{padding:10px 0 40vh;scroll-behavior:smooth}
/* 每个页面占位块：高度按 A4 比例预留，图片到位前不跳动 */
.vpage{position:relative;margin:0 auto 10px;background:#fff;box-shadow:0 1px 4px #0002}
.vpage > img{width:100%;display:block;opacity:0;transition:opacity .18s}
/* 懒加载占位：先出一个骨架，图片加载完才显示真实内容 */
.vpage .skel{
  width:100%;display:flex;align-items:center;justify-content:center;
  color:var(--dim);font-size:12px;background:#f6f8fa;
}
.vpage > img.on{opacity:1}
.vpage .skel.on{display:none}
/* 页码角标：滚到哪页一眼看到 */
.vpage .pno{
  position:absolute;right:6px;bottom:6px;z-index:2;
  background:#0f172aa8;color:#fff;font-size:10.5px;padding:1px 7px;border-radius:9px;
  pointer-events:none;font-variant-numeric:tabular-nums;
}
/* 连续滚动时页码条高亮当前可见页（.pg.on 定义在下方基础样式里） */
.viewer img{
  display:block;margin:0 auto;transition:width .15s;
  image-rendering:-webkit-optimize-contrast;
}
.viewer.loading{position:relative}
.viewer .ph{display:flex;height:100%;align-items:center;justify-content:center;color:var(--dim);flex-direction:column;gap:10px}
.page-list{
  width:120px;flex-shrink:0;background:var(--panel);border-right:1px solid var(--line);
  overflow-y:auto;padding:5px 0;
}
.page-list .pg{
  padding:4px 10px;font-size:11px;cursor:pointer;color:var(--dim);
  border-left:3px solid transparent;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;
}
.page-list .pg:hover{background:var(--panel2)}
.page-list .pg.on{background:#dbeafe;border-left-color:var(--accent);color:var(--accent2)}

/* ---------- 右栏 ---------- */
.rtabs{display:flex;background:var(--panel);border-bottom:1px solid var(--line);position:sticky;top:0;z-index:5}
.rtabs button{flex:1;padding:10px 4px;font-size:12px;color:var(--dim);border-bottom:2px solid transparent}
.rtabs button.on{color:var(--accent);border-bottom-color:var(--accent);background:var(--panel2)}
.rpane{padding:12px}
.kpis{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-bottom:12px}
.kpi{background:#fff;border:1px solid var(--line);border-radius:7px;padding:9px 10px;
  border-left:3px solid var(--accent);box-shadow:var(--shadow)}
.kpi.g{border-left-color:var(--ok)} .kpi.p{border-left-color:var(--purple)}
.kpi.o{border-left-color:var(--warn)} .kpi.r{border-left-color:var(--err)}
.kpi .v{font-size:19px;font-weight:700;font-variant-numeric:tabular-nums;line-height:1.2}
.kpi .l{font-size:10px;color:var(--dim);margin-top:1px}

table{width:100%;border-collapse:collapse;font-size:11.5px}
th{
  background:var(--panel2);padding:6px 5px;text-align:left;font-weight:600;
  font-size:10.5px;color:var(--dim);position:sticky;top:0;white-space:nowrap;
  border-bottom:1px solid var(--line);
}
td{padding:6px 5px;border-bottom:1px solid var(--line);vertical-align:top}
tr:hover td{background:var(--panel2)}
tr.floor-row td{background:#eef2f7;font-weight:700;border-top:2px solid var(--line)}
.num{text-align:right;font-variant-numeric:tabular-nums}
.mono{font-family:ui-monospace,Menlo,Consolas,monospace;font-size:11px}
.tag{
  display:inline-block;padding:1px 6px;border-radius:4px;font-size:10px;
  font-weight:600;white-space:nowrap;
  /* 无语义修饰的通用 tag（图层清单等）也要有底色，
     否则浅色主题下是无色透明文字，等于隐形 */
  background:var(--panel2);color:var(--dim);border:1px solid var(--line);
}
.tag.high{background:#dcfce7;color:#15803d}
.tag.medium{background:#fef3c7;color:#b45309}
.tag.low{background:#fee2e2;color:#b91c1c}
.tag.acc{background:#ede9fe;color:#6d28d9}
.tag.com{background:#dbeafe;color:#1d4ed8}
.tag.err{background:#fee2e2;color:#b91c1c}
.tag.warn{background:#fef3c7;color:#b45309}
.muted{color:var(--dim)}
.err-t{color:var(--err)} .ok-t{color:var(--ok)} .warn-t{color:var(--warn)}

.alert{
  padding:8px 11px;border-radius:6px;font-size:11.5px;margin-bottom:11px;
  border-left:3px solid;
}
.alert.ok{background:var(--ok-bg);border-color:var(--ok);color:#15803d}
.alert.warn{background:var(--warn-bg);border-color:var(--warn);color:#b45309}
.alert.err{background:var(--err-bg);border-color:var(--err);color:#b91c1c}
.alert.info{background:var(--info-bg);border-color:var(--accent);color:var(--accent2)}

.empty{padding:36px 20px;text-align:center;color:var(--dim);font-size:12px}
.empty .big{font-size:30px;margin-bottom:8px;opacity:.4}

.bar{height:16px;background:var(--panel2);border-radius:3px;overflow:hidden;display:flex}
.bar i{display:block;height:100%}
.legend{display:flex;gap:12px;flex-wrap:wrap;font-size:11px;margin:8px 0}
.legend span{display:flex;align-items:center;gap:5px}
.legend b{width:11px;height:11px;border-radius:2px;display:inline-block}

/* ---------- 抽屉/弹窗 ---------- */
.mask{
  position:fixed;inset:0;background:#0f172a59;display:none;
  align-items:center;justify-content:center;z-index:100;padding:20px;
}
.mask.on{display:flex}
.modal{
  background:var(--panel);border-radius:10px;width:100%;max-width:820px;
  max-height:88vh;display:flex;flex-direction:column;
  border:1px solid var(--line);box-shadow:var(--shadow-lg);
}
.modal h2{
  padding:13px 16px;font-size:14px;border-bottom:1px solid var(--line);
  display:flex;align-items:center;justify-content:space-between;
}
.mbody{padding:16px;overflow-y:auto;flex:1}
.mfoot{padding:11px 16px;border-top:1px solid var(--line);display:flex;gap:8px;justify-content:flex-end}
.x{font-size:18px;color:var(--dim);line-height:1}
.x:hover{color:var(--txt)}

.drop{
  border:2px dashed var(--line);border-radius:9px;padding:26px;text-align:center;
  cursor:pointer;transition:.15s;margin-bottom:14px;
}
.drop:hover,.drop.hot{border-color:var(--accent);background:var(--info-bg)}
.drop .big{font-size:28px;margin-bottom:6px;opacity:.5}
.flist{display:flex;flex-direction:column;gap:5px;font-size:11.5px}
.flist .f{
  display:flex;align-items:center;gap:9px;padding:6px 10px;
  background:var(--panel2);border:1px solid var(--line);border-radius:5px;
}
.flist .f .n{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}

.fld{margin-bottom:12px}
.fld label{display:block;font-size:11px;color:var(--dim);margin-bottom:4px}
.fld input,.fld select,.fld textarea{
  width:100%;padding:7px 9px;background:#fff;border:1px solid var(--line);
  border-radius:5px;color:var(--txt);font:inherit;
}
.fld input:focus,.fld select:focus,.fld textarea:focus{
  outline:2px solid #bfdbfe;outline-offset:0;border-color:var(--accent);
}
.fld textarea{resize:vertical;min-height:70px}
.row{display:flex;gap:10px}
.row>*{flex:1}

.spin{
  display:inline-block;width:13px;height:13px;border:2px solid #fff6;
  border-top-color:#fff;border-radius:50%;animation:sp .7s linear infinite;
}
@keyframes sp{to{transform:rotate(360deg)}}
.toast{
  position:fixed;bottom:18px;right:18px;background:var(--panel);
  border:1px solid var(--line);border-left:3px solid var(--accent);
  padding:10px 15px;border-radius:7px;font-size:12px;z-index:200;
  box-shadow:var(--shadow-lg);max-width:380px;
}
.toast.ok{border-left-color:var(--ok)}
.toast.err{border-left-color:var(--err)}
</style>
</head>
<body>

<header>
  <div class="logo">AU<span>·</span>Cupboards</div>
  <nav>
    <button class="on" data-view="work" data-i18n="nav.work">工作台</button>
    <button data-view="cupboard" data-i18n="nav.cupboard">柜型库</button>
    <button data-view="building" data-i18n="nav.building">建筑图纸</button>
  </nav>
  <!-- 工作台不放上传入口，默认隐藏，由 gotoView 按 tab 控制 -->
  <button class="hupload" id="bup" data-i18n="btn.upload" style="display:none">⬆ 上传图纸</button>
  <div class="langsw">
    <button id="lzh" class="on">中文</button>
    <button id="len">EN</button>
  </div>
  <div class="hstat" id="hstat">连接中…</div>
</header>

<main>
  <!-- ============ 左：树导航 ============ -->
  <div id="tree"></div>

  <!-- ============ 中：文档原样预览 ============ -->
  <div id="mid">
    <div class="mid-bar">
      <span class="fn" id="mfn"></span>
      <button class="btn" id="bprev" data-i18n-title="ui.prevpage">◀</button>
      <span class="badge" id="bpage">– / –</span>
      <button class="btn" id="bnext" data-i18n-title="ui.nextpage">▶</button>
      <span class="hint" id="bhelp" data-i18n="ui.scrollhint"></span>
      <span style="width:6px"></span>
      <button class="btn" id="bzout" title="zoom out">−</button>
      <span class="badge" id="bzoom">100%</span>
      <button class="btn" id="bzin" title="zoom in">+</button>
      <button class="btn pri" id="bparse" data-i18n="btn.reparse">重新解析</button>
    </div>
    <div style="display:flex;flex:1;min-height:0">
      <div class="page-list" id="pagelist"></div>
      <div class="viewer" id="viewer">
        <!-- 静态 HTML 里的 ${...} 不会被求值，必须给真实文本，
             boot() 会用 t('mid.ph') 覆盖 -->
        <div class="ph"><div class="big">▤</div><div>上传建筑图纸后在此原样预览</div></div>
      </div>
    </div>
  </div>

  <!-- ============ 右：工作区 ============ -->
  <div id="right">
    <div class="rtabs">

let LANGNOW = 'zh';
const t = k => (I18N[LANGNOW][k] !== undefined ? I18N[LANGNOW][k] : k);
/** 按语种重新渲染整页 —— 切换语言后调用 */
function applyI18n() {
  document.documentElement.lang = LANGNOW === 'zh' ? 'zh-CN' : 'en';
  $$('[data-i18n]').forEach(e => { e.textContent = t(e.dataset.i18n); });
  // title 型翻译单独处理：翻页按钮要写清快捷键，
  // 只改textContent 会把title 留在旧语言上
  $$('[data-i18n-title]').forEach(e => { e.title = t(e.dataset.i18nTitle); });
  $('#lzh').classList.toggle('on', LANGNOW === 'zh');
  $('#len').classList.toggle('on', LANGNOW === 'en');
  gotoView(S.view);
}

const S = {          // 全局状态
  view: 'work', pane: 'matrix',
  // 与后端 API_VERSION 一致。改后端契约时必须同步改这里，
  // 否则启动会直接横幅提示「版本错配，请强制刷新」而不是等到入库才报 500。
  apiver: '2',
  projects: [], job: null, curBuilding: null, curPage: 0,
  variants: [], treeSel: null,
  openDrawing: null, // 哪张图纸处于展开状态（drawing id）
  fold: {},          // 楼的折叠状态：key 'b<buildingId>' -> true=折叠
  parsing: false,    // 正在解析 —— 用于禁止关闭弹窗
  dwgHint: null,     // 后端 /health 返回的 DWG 安装指引原文
  renders: [],       // 柜型block → JPG 的渲染结果
  storedName: null,   // DWG 上传后的文件名（渲染/入库都用它）

  detected: null,     // 柜型识别摘要（识别到几个/排除几个）
  rejected: [],       // 被排除的非柜体区域（含排除理由）
  cupboards: [],      // 柜型几何明细（套数/排布/尺寸）—— 按柜体识别时才有

const $ = s => document.querySelector(s);
const $$ = s => [...document.querySelectorAll(s)];
const esc = s => String(s ?? '').replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const num = (v, d = 2) => (v === null || v === undefined || v === '') ? '—' : Number(v).toFixed(d);

function toast(msg, kind = '') {
  const t = document.createElement('div');
  t.className = 'toast ' + kind; t.textContent = msg;
  document.body.appendChild(t);
  setTimeout(() => t.remove(), kind === 'err' ? 6500 : 3500);
}
async function api(path, opt = {}) {
  const r = await fetch('/api' + path, opt);
  if (!r.ok) {
    let d = ''; try { d = (await r.json()).detail || ''; } catch (e) {}
    // 500 且后端已带可读原因 → 直接把原因摊开给用户，
    // 不再显示干巴巴的「入库失败 500」让人猜。
    throw new Error(`${r.status} ${d || r.statusText}`);
  }
  return r.json();
}
function modal(html) { $('#modal').innerHTML = html; $('#mask').classList.add('on'); }

/* ============================================================ 版本错配横幅
 *  前端是单文件 HTML，浏览器缓存住旧版本是最难查的一类故障：
 *  界面还是旧的（点了没反应），但后端已经是新的（入库直接 500）。
 *  与其让用户对着 500 猜，不如启动时就把话说明白。 */
const APIVER = '2';
function showVerMismatch(serverVer) {
  const bar = document.createElement('div');
  bar.id = 'vermismatch';
  bar.style.cssText = [
    'position:fixed', 'left:0', 'right:0', 'top:0', 'z-index:9999',
    'background:#b91c1c', 'color:#fff', 'padding:9px 14px',
    'font-size:13px', 'line-height:1.5', 'text-align:center',
    'box-shadow:0 2px 10px #0003'
  ].join(';');
  bar.innerHTML =
    `<b>${LANGNOW === 'zh' ? '页面版本与后端不一致' : 'Page/backend version mismatch'}</b> · `
    + (LANGNOW === 'zh'
      ? `浏览器缓存了旧页面（页面 ${APIVER} / 后端 ${serverVer}）。`
      : `Browser cached an old page (page ${APIVER} / server ${serverVer}). `)
    + (LANGNOW === 'zh'
      ? `请<b>强制刷新</b>：Mac 按 <kbd>Cmd+Shift+R</kbd>，Windows 按 <kbd>Ctrl+Shift+R</kbd>。`
      : `<b>Hard-reload</b>: <kbd>Cmd+Shift+R</kbd> / <kbd>Ctrl+Shift+R</kbd>.`)
    + ' ';
  const btn = document.createElement('button');
  btn.textContent = LANGNOW === 'zh' ? '立即刷新' : 'Reload now';
  btn.style.cssText = 'margin-left:10px;padding:3px 12px;border:0;border-radius:5px;'
    + 'cursor:pointer;font-weight:600';
  btn.onclick = () => location.reload(true);
  bar.appendChild(btn);
  document.body.appendChild(bar);
  setTimeout(() => bar.remove(), 30000);
}
function closeModal() {
  // 解析中禁止关闭 —— 否则用户一点就把进度弄丢了，
  // 而且后台仍在跑，前端却以为失败了
  if (S.parsing) {
    toast(t('up.busy'), 'err');
    return;
  }
  $('#mask').classList.remove('on');
}

/** DWG 后端缺失时的安装指引弹窗。
 *  文案走 i18n（后端返回的 dwg_hint 只有中文，英文界面下不可用），
 *  h.dwg_hint 仅作为兜底原文展示。 */
function showDwgHint(hint) {
  modal(`<h2>${esc(t('dwg.hint.title'))}<span class="x" onclick="closeModal()">×</span></h2>
    <div class="mbody">
      <div class="alert warn">${esc(t('dwg.none'))}</div>
      <div style="margin:10px 0 4px"><b>1.</b>
        <a href="https://www.opendesign.com/guestfiles/oda_file_converter" target="_blank"
           rel="noreferrer">${esc(t('dwg.hint.oda'))}</a></div>
      <div class="mono muted" style="font-size:11.5px">https://www.opendesign.com/guestfiles/oda_file_converter</div>
      <div style="margin:12px 0 4px"><b>2.</b> ${esc(t('dwg.hint.brew'))}</div>
      <div class="mono" style="font-size:12px;background:var(--panel2);border:1px solid var(--line);
           border-radius:6px;padding:6px 8px">brew install libredwg</div>
      <div class="muted" style="margin-top:12px;font-size:11.5px">${esc(t('dwg.hint.done'))}</div>
      ${hint ? `<details style="margin-top:10px"><summary class="muted"
           style="font-size:11.5px;cursor:pointer">${esc(LANGNOW==='zh'?'后端原文':'backend message')}</summary>
           <pre class="mono" style="white-space:pre-wrap;font-size:11.5px;margin-top:6px">${esc(hint)}</pre></details>` : ''}
    </div>
    <div class="mfoot">
      <button class="btn pri" id="bhintok" onclick="closeModal()">${esc(t('dwg.hint.close'))}</button>
    </div>`);
}

async function boot() {
  // 先固化静态文案，避免首屏「连接中…」/「未选择文件」残留
  $$('[data-i18n]').forEach(e => { e.textContent = t(e.dataset.i18n); });
  $('#mfn').textContent = t('mid.none');
  try {
    const h = await api('/health');
    // 版本一致性校验 —— 前后端必须同步升级。
    // 前端是单文件 HTML，浏览器极易缓存住旧版本，而用户往往只记得
    // 「重启服务」，不记得强刷，于是旧 JS 提交旧字段给新后端 → 500。
    // 实测踩坑：用户 pull 新版 + 重启后端，仍报「入库失败 500」，
    // 根因就是浏览器还在跑旧 index.html。这里主动比对并横幅提示。
    if (h.api_version && h.api_version !== APIVER) {
      showVerMismatch(h.api_version);
    }
    // 记住后端给的 dwg_hint，供徽章点击时展示
    S.dwgHint = h.dwg_hint || null;
    $('#hstat').innerHTML =
      `${LANGNOW==='zh'?'规则':'Rules'} v${esc(h.config_version)} · ${h.dwg_ready
        ? `<span class="badge on">${t('dwg.ready')}</span>`
        : `<span class="badge link" id="bdwg" title="${esc(t('dwg.hint.title'))}">${t('dwg.none')}</span>`}`;
    // 后端已给出可执行指引，前端必须消费它 —— 否则用户只看到「未装后端」却不知道怎么办
    const bw = $('#bdwg');
    if (bw) bw.onclick = () => showDwgHint(S.dwgHint);
  } catch (e) {
    $('#hstat').innerHTML = `<span class="err-t">${t('hstat.offline')}</span>`;
  }
  await loadTree();
  await loadVariants();
  // 自动恢复最近一次解析结果 —— 否则刷新后界面是空的
  try {
    const jobs = await api('/jobs?limit=1');
    if (jobs.length) {
      S.curBuilding = jobs[0].building_id ?? S.curBuilding;
      await loadJob(jobs[0].id);
      showPdf(jobs[0].id, S.pages?.length ? S.pages : []);
    }
  } catch (e) {}
  // 统一走 gotoView 归位：首屏也必须把上传按钮、树、中栏按 tab 摆对，
  // 否则默认可见 #bup（工作台不该有上传入口）
  gotoView(S.view);
}

async function loadTree() {
  try {
    S.projects = await api('/projects');
  } catch (e) { S.projects = []; }
  renderTree();
}

function renderTree() {
  // 柜型库 tab：树里**只**显示柜型分组，不再混入楼栋（用户诉求：
  //「切换到柜型库，还是显示的楼栋的内容」）
  if (S.view === 'cupboard') { renderTreeLibrary(); return; }

  let h = `<div class="sec">${t('tree.projects')}</div>`;
  if (!S.projects.length) {
    h += `<div class="node lv1" style="color:var(--dim)">${t('tree.empty')}</div>`;
  }
  for (const p of S.projects) {
    const on = S.curBuilding === p.id ? ' on' : '';
    const job = S.job;
    const dw = p.drawings || [];
    // 楼栋节点上的箭头：折叠/展开。展开后每张图纸各占一个 item
    const open = !S.fold['b' + p.id];
    h += `<div class="node${on}" data-b="${p.id}">
      <span class="tw" data-fold="b${p.id}">${open ? '▾' : '▸'}</span>
      <span class="ico">▦</span><span class="nm">${esc(p.name)}</span>
      <span class="ct">${dw.length}${t('tree.drawings')}</span></div>`;
    if (!open) continue;
    // ---- 每张图纸一个 item ----
    for (const d of dw) {
      const sel = S.treeSel === 'floors' && S.openDrawing === d.id ? ' on' : '';
      const dopen = S.openDrawing === d.id;
      h += `<div class="node lv1${sel}" data-sel="d${d.id}">
        <span class="tw">${d.latest_job_id ? (dopen ? '▾' : '▸') : '·'}</span>
        <span class="ico">▤</span><span class="nm">${esc(d.title || t('nav.building'))}</span>
        <span class="ct">${d.page_count || 0}p</span></div>`;
      // 图纸展开 -> 该图纸自己的楼层（按 latest_job_id 过滤）
      const djob = (d.latest_job_id === S.jobId) ? job : null;
      if (dopen && djob) {
        h += `<div class="node lv1${S.treeSel === 'floors' ? ' on' : ''}" data-sel="floors">
          <span class="tw">▸</span>
          <span class="ico">≡</span><span class="nm">${t('tree.floors')}</span>
          <span class="ct">${djob.floors?.length || 0}</span></div>`;
        if (S.treeSel === 'floors') {
          for (const f of (djob.floors || [])) {
            h += `<div class="node lv2" data-floor="${esc(f.floor_code)}">
              <span class="nm">${esc(f.floor_code)}</span>
              <span class="ct">${f.unit_count}${LANGNOW==='zh'?'户':' u'}${f.communal_count ? '+' + f.communal_count : ''}</span></div>`;
          }
        }
      }
    }
    if (!dw.length && job) {
      // 兼容：老数据只有 job 没有 drawing 记录
      h += `<div class="node lv1${S.treeSel === 'floors' ? ' on' : ''}" data-sel="floors">
        <span class="tw">▸</span><span class="ico">≡</span>
        <span class="nm">${t('tree.floors')}</span>
        <span class="ct">${job.floors?.length || 0}</span></div>`;
    }
  }
  $('#tree').innerHTML = h;
  bindTree();
}

/** 柜型库 tab 的树：只列柜型分组 */
/** 柜型库左树：**DWG 文件名（可改名） → N Units**
 *
 *  用户口径（明确要求）：
 *    · 根节点 = DWG 文件名，可以改
 *    · 子节点 = 「5 Units」「6 Units」…
 *    · 点子节点 → 右侧平铺该套数下的**全部**摆法（不去重）
 *
 *  为什么不去重
 *  ------------
 *  真实样本实测：同一张图里 13 Units 的 2115×2350 那个柜出现了 3 次
 *  （楼上有三个楼层各画一遍）。用户明确要求「不去重，每次出现都算
 *  一种」—— 因为「这张图上一共画了几个柜」本身就是有用信息。
 *  所以分组只看 units 数，不看尺寸；同组内尺寸不同自然就分开了。
 *
 *  差异判定也按用户要求：**严格区分尺寸**，1315×2250 与 1315×2300
 *  是两种摆法（差 50mm）。
 */
function libraryGroups() {
  // 先按来源图纸分组（一个库里可能有多份 DWG 都导过柜型）
  const byFile = new Map();
  for (const v of S.variants) {
    const fname = v.source_name || v.dwg_name || t('tree.library');
    if (!byFile.has(fname)) byFile.set(fname, []);
    byFile.get(fname).push(v);
  }
  const files = [];
  for (const [fname, items] of byFile) {
    const byUnits = new Map();
    for (const v of items) {
      const n = Number(v.positions || 0);
      if (!byUnits.has(n)) byUnits.set(n, []);
      byUnits.get(n).push(v);
    }
    // 套数从少到多排：5 Units 在 6 Units 前面，符合直觉
    const units = [...byUnits.entries()]
      .map(([n, list]) => {
        // 同套数下的多个柜用 A / B / C 区分（用户口径）。
        //
        // 排序依据必须是**柜体尺寸**而不是入库顺序：真实样本里
        // 同一套数下三个柜的入库顺序受DXF 实体顺序影响，
        // 每次解析可能不同，按顺序编号会让 A/B 换来换去。
        // 尺寸（宽×高）稳定，且正是用户区分"不同摆法"的依据。
        const sorted = [...list].sort((a, b) =>
          (Number(a.w) - Number(b.w)) || (Number(a.h) - Number(b.h))
          || String(a.code).localeCompare(String(b.code)));
        return {
          n,
          list: sorted,
          key: `${fname}#${n}`,
          labels: sorted.map((v, i) => ({
            // 只有 1 个柜时不需要后缀，多了反而啰嗦
            suffix: sorted.length > 1
              ? '-' + String.fromCharCode(65 + i)
              : '',
            v,
          })),
        };
      })
      .sort((a, b) => a.n - b.n);
    files.push({
      name: fname,
      fileKey: fname,
      count: items.length,
      units,
      // 该文件总共多少套
      unitsTotal: items.reduce((a, v) => a + Number(v.positions || 0), 0),
    });
  }
  files.sort((a, b) => a.name.localeCompare(b.name));
  return files;
}

function renderTreeLibrary() {
  const groups = libraryGroups();
  let h = `<div class="sec">${t('tree.library')}</div>`;
  if (!groups.length) {
    h += `<div class="node lv1" style="color:var(--dim)">${t('dwg.empty')}</div>`;
    $('#tree').innerHTML = h;
    return;
  }
  for (const f of groups) {
    const fsel = S.treeSel === 'f:' + f.fileKey ? ' on' : '';
    const fopen = S.treeSel === 'f:' + f.fileKey;
    h += `<div class="node lv1${fsel}" data-lf="${esc(f.fileKey)}">
      <span class="tw">▸</span><span class="ico">⊞</span>
      <span class="nm" title="${esc(f.name)}">${esc(f.name)}</span>
      <span class="ct">${f.count}</span>
      <button class="renam" data-rename="${esc(f.fileKey)}"
        title="${t('lib.rename')}">✎</button></div>`;
    if (fopen) {
      for (const u of f.units) {
        // 只有一个摆法时不加后缀；有多个时逐个列成
        // 「6 Units - A」「6 Units - B」…（「13 Units」有三个）
        const rows = u.labels.length === 1
          ? [{ key: u.key, label: `${u.n} ${t('lib.units')}`, ct: 1 }]
          : u.labels.map(x => ({
            key: u.key + '@' + x.v.id,
            label: `${u.n} ${t('lib.units')}${x.suffix}`,
            ct: null,
          }));
        for (const r of rows) {
          const on = S.treeSel === r.key ? ' on' : '';
          const ct = r.ct === null ? '' : `<span class="ct">${r.ct}</span>`;
          h += `<div class="node lv2${on}${r.ct === null ? ' lv3' : ''}"
            data-lg="${esc(r.key)}" data-vid="${esc(r.key.split('@')[1] || '')}">
            <span class="nm">${esc(r.label)}</span>${ct}</div>`;
        }
      }
    }
  }
  $('#tree').innerHTML = h;
  bindTree();
  bindTreeRename();
}

/** 重命名 DWG 节点 —— 用户要求「根目录的名字就是 dwg 文件的名字（可以修改）」。
 *  改名只改显示名，**不动原文件**：柜型图已经渲成 JPG 存库了，
 *  原DWG 改了名反而对不上。名字存在 sessionStorage，刷新后仍在。 */
function bindTreeRename() {
  $$('#tree [data-rename]').forEach(b => {
    b.onclick = ev => {
      ev.stopPropagation();
      const key = b.dataset.rename;
      const cur = (S.renames || {})[key] || key;
      const name = prompt(
        LANGNOW === 'zh' ? '修改显示名称：' : 'Rename display name:', cur);
      if (name === null) return;
      const clean = String(name).trim();
      S.renames = S.renames || {};
      if (!clean || clean === key) delete S.renames[key];
      else S.renames[key] = clean;
      try {
        sessionStorage.setItem('cupRename', JSON.stringify(S.renames));
      } catch (e) { /* 隐私模式下写不了，忽略 */ }
      renderTree();
      // 正在看的那个分组要刷新标题
      if (S.treeSel === 'f:' + key) showUnitsGroup(key + '#0', true);
      else if (S.treeSel?.startsWith(key + '#')) showUnitsGroup(S.treeSel, true);
    };
  });
}

/** 取显示名（应用过重命名的优先） */
function dispName(fname) {
  return (S.renames || {})[fname] || fname;
}

function bindTree() {
  $$('#tree .node').forEach(n => n.onclick = ev => {
    // 点箭头只折叠/展开，不触发选中
    const tw = ev.target.closest('.tw');
    if (tw && tw.dataset.fold) {
      const k = tw.dataset.fold;
      S.fold[k] = !S.fold[k];
      renderTree();
      return;
    }
    if (n.dataset.b) { S.curBuilding = +n.dataset.b; S.treeSel = null; renderTree(); }
    else if (n.dataset.lf) {
      // 点根节点：展开/收起，默认展开后自动选中第一个 Units
      const key = n.dataset.lf;
      if (S.treeSel === 'f:' + key) { S.treeSel = null; renderTree(); return; }
      S.treeSel = 'f:' + key;
      renderTree();
      const g = libraryGroups().find(f => f.fileKey === key);
      if (g?.units.length) showUnitsGroup(g.units[0].key);
      return;
    }
    else if (n.dataset.lg) {
      const k = n.dataset.lg;
      S.treeSel = (S.treeSel === k) ? null : k;
      renderTree();
      if (S.treeSel) showUnitsGroup(k);
    }
    else if (n.dataset.sel) {
      const k = n.dataset.sel;
      if (k.startsWith('d')) {
        const did = +k.slice(1);
        // 再次点同一张图纸 -> 收起
        S.openDrawing = S.openDrawing === did ? null : did;
        S.treeSel = S.openDrawing ? 'floors' : null;
        renderTree();
        return;
      }
      S.treeSel = S.treeSel === k ? null : k;
      renderTree();
    }
    else if (n.dataset.floor) filterFloor(n.dataset.floor);
    else if (n.dataset.vg) {
      S.treeSel = S.treeSel === n.dataset.vg ? null : n.dataset.vg;
      renderTree();
      if (S.treeSel) showVariantGroup(n.dataset.vg);
    }
  });
}

function variantGroups() {
  const g = {};
  for (const v of S.variants) {
    // 按 water+gas 表位组合分组（需求 2：按 meter 组合分组）
    const key = v.bucket || ('p' + v.positions);
    (g[key] = g[key] || []).push(v);
  }
  return Object.entries(g).map(([key, items]) => ({
    key, count: items.length,
    title: items[0].bucket_label || (items[0].positions + ' 表位'),
  }));
}

// ============================================================ 楼层 × 柜型矩阵（需求 1 核心）
function renderMatrix() {
  const j = S.job;
  if (!j) return emptyBox(t('empty.notparsed'), t('empty.t1'));
  const s = j.summary || {};
  const cv = j.cross_validation || {};

  let h = '<div class="rpane">';

  // KPI
  h += `<div class="kpis">
    <div class="kpi g"><div class="v">${s.total_units ?? 0}</div><div class="l">${t('kpi.units')}</div></div>
    <div class="kpi p"><div class="v">${s.communal_units ?? 0}</div><div class="l">CO-LIVING</div></div>
    <div class="kpi"><div class="v">${(j.floors || []).length}</div><div class="l">${t('kpi.floor')}</div></div>
    <div class="kpi ${s.errors ? 'r' : 'o'}"><div class="v">${s.errors ?? 0}/${s.warnings ?? 0}</div><div class="l">${t('kpi.compliance')}</div></div>
  </div>`;

  // 交叉验证
  if (cv && cv.verdict) {
    const cls = cv.verdict === 'AGREE' ? 'ok' : 'warn';
    h += `<div class="alert ${cls}">
      <b>${t('cv.title')}: ${esc(cv.verdict)}</b> — ${t('cv.plan')} ${cv.plan_units} ↔ ${t('cv.sched')} ${cv.schedule_units},
      ${t('cv.agreed')} ${cv.agreed}, ${t('cv.rate')} ${cv.consistency ?? 0}
      ${(cv.area_mismatch || []).length ? `· ${t('prov.mismatch')} ${cv.area_mismatch.length} ${t('cv.arean')}` : `· ${t('cv.area0')}`}
    </div>`;
  }

  // 楼层矩阵表：每层一行，内含各柜型
  h += `<div class="sec" style="padding-left:0">${t('mtx.title')}</div>`;
  h += `<table><thead><tr><th>${t('mtx.floor')}</th><th class="num">${t('mtx.units')}</th><th class="num">COLIVING</th>`
     + `<th class="num">${t('mtx.area')}</th><th>${t('mtx.cup')}</th></tr></thead><tbody>`;

  for (const f of (j.floors || [])) {
    const units = (j.units || []).filter(u => u.floor === f.floor_code);
    const groups = {};
    for (const u of units) {
      const k = u.variant?.code || t('mtx.nomatch');
      (groups[k] = groups[k] || { n: 0, u: [], v: u.variant || null }).n++;
      groups[k].u.push(u.unit_label);
    }
    const nVar = Object.keys(groups).length;
    h += `<tr class="floor-row"><td>${esc(f.floor_code)}</td>
      <td class="num">${f.unit_count}</td>
      <td class="num">${f.communal_count || 0}</td>
      <td class="num">${num(f.total_area_m2, 1)}</td>
      <td>${nVar} ${t('mtx.kind')}</td></tr>`;
    for (const [code, g] of Object.entries(groups).sort((a, b) => b[1].n - a[1].n)) {
      const v = g.v || {};
      h += `<tr>
        <td style="padding-left:16px;color:var(--dim)">└</td>
        <td class="num muted">${g.n}</td>
        <td colspan="2" class="muted">${g.u.length > 8 ? g.u.slice(0, 8).join(' ') + ' …' : g.u.join(' ')}</td>
        <td>
          <div><b class="mono">${esc(code)}</b>
            ${v.name ? '<span class="muted"> — ' + esc(v.name) + '</span>' : ''}
            ${g.u.some(x => x.startsWith('CLA')) ? '<span class="tag com">COLIVING</span>' : ''}
          </div>
          <div class="muted" style="font-size:10.5px">
            ${v.w ? `${v.w}W × ${v.h}H × ${v.d}D mm` : t('mtx.nosize')}
            · ${v.positions ?? '?'} 表位 · ${v.grid ?? ''}
          </div>
          ${v.description ? `<div class="muted" style="font-size:10.5px">${esc(v.description.slice(0, 60))}</div>` : ''}
        </td></tr>`;
    }
  }
  h += '</tbody></table>';

  // 图例
  h += '<div class="legend">';
  for (const [c, n] of Object.entries(s.by_variant || {}))
    h += `<span><b style="background:var(--accent)"></b>${esc(c)} × ${n}</span>`;
  h += '</div></div>';
  $('#rpane').innerHTML = h;
}

function renderDetail() {
  const j = S.job;
  if (!j) return emptyBox(t('empty.notparsed'), t('empty.t2'));
  const f = S.floorFilter;
  const units = (j.units || []).filter(u => !f || u.floor === f);
  let h = '<div class="rpane"><table><thead><tr>'
    + `<th>${t('d.empty')}</th><th class="num">${t('d.dry')}</th><th class="num">${t('d.wet')}</th><th>${t('d.type')}</th>`
    + `<th>${t('d.cup')}</th><th>${t('d.grid')}</th><th class="num">${t('d.size')}</th><th>${t('d.prov')}</th></tr></thead><tbody>`;
  if (!units.length) h += `<tr><td colspan="8" class="empty">${t('empty.unit')}</td></tr>`;
  for (const u of units) {
    const v = u.variant || {};
    const d = u.requirement_derivation || {};
    h += `<tr>
      <td class="mono"><b>${esc(u.unit_label)}</b>${u.is_communal ? ' <span class="tag com">C</span>' : ''}
        ${u.accessible ? '<span class="tag acc">ACC</span>' : ''}</td>
      <td class="num">${num(u.area_m2)}</td>
      <td class="num">${num(u.wet_area_m2)}</td>
      <td>${esc(u.unit_type || '—')}</td>
      <td class="mono">${esc(v.code || t('mtx.nomatch'))}</td>
      <td class="mono">${esc(v.grid || '—')}</td>
      <td class="num" style="font-size:10.5px">${v.w ? `${v.w}×${v.h}×${v.d}` : '—'}</td>
      <td style="font-size:10px">
        <span class="tag ${u.confidence_tier}">${t('tier.'+(u.confidence_tier||''))||'—'}</span>
        ${d.bucket ? `<div class="muted">${esc(d.bucket)} ${esc(d.bucket_label || '')}</div>` : ''}
      </td></tr>`;
  }
  h += '</tbody></table></div>';
  $('#rpane').innerHTML = h;
}

function renderProv() {
  const j = S.job;
  if (!j) return emptyBox(t('empty.notparsed'), '');
  const ms = j.multi_signals || {}, cv = j.cross_validation || {};
  let h = '<div class="rpane">';
  h += `<div class="alert info">${t('prov.rule')} <b>v${esc(ms.config_version || '—')}</b>｜
    ${t('prov.ai')}: ${ms.used_ai ? `<span class="warn-t">${t('prov.yes')}</span>` : `<span class="ok-t">${t('prov.no')}</span>`}｜
    ${t('prov.before')} ${ms.raw_units_before_dedup ?? '—'} → ${t('prov.after')} ${ms.total_units ?? '—'}｜
    ${t('prov.pages')} ${ms.pages_with_text ?? '—'}</div>`;

  h += `<div class="sec" style="padding-left:0">${t('prov.hits')}</div><table><thead><tr>`
    + `<th>${t('prov.rule2')}</th><th>${t('prov.desc')}</th><th class="num">${t('prov.hit')}</th></tr></thead><tbody>`;
  const dg = j.diagnostics || {};
  if (!Object.keys(dg).length) h += `<tr><td colspan="3" class="empty">${t('prov.none')}</td></tr>`;
  for (const [k, v] of Object.entries(dg).sort((a, b) => b[1] - a[1]))
    if (v) h += `<tr><td class="mono">${esc(k)}</td><td class="muted">${esc(j.rule_desc?.[k] || '')}</td><td class="num">${v}</td></tr>`;
  h += '</tbody></table>';

  if (cv.verdict) {
    h += `<div class="sec" style="padding-left:0">${t('prov.recon')}</div>
      <div class="alert ${cv.verdict === 'AGREE' ? 'ok' : 'warn'}">
        ${t('prov.onlyplan')}: <b>${esc((cv.only_in_plan || []).join(', ') || t('prov.none'))}</b><br>
        ${t('prov.onlysched')}: <b>${esc((cv.only_in_schedule || []).join(', ') || t('prov.none'))}</b><br>
        ${t('prov.mismatch')}: <b>${(cv.area_mismatch || []).length}</b> ${t('cv.arean')}
      </div>`;
  }
  if ((j.warnings || []).length) {
    h += `<div class="sec" style="padding-left:0">${t('prov.warn')}</div>`;
    for (const w of j.warnings) h += `<div class="alert warn">${esc(w)}</div>`;
  }
  h += '</div>';
  $('#rpane').innerHTML = h;
}

/** 参数原名 t/s 会遮蔽全局 i18n 函数 t()，故改名为 _t/_s */
function emptyBox(_t, _s) {
  $('#rpane').innerHTML = `<div class="empty"><div class="big">◫</div><b>${esc(_t)}</b><div style="margin-top:5px">${esc(_s)}</div></div>`;
}

// ============================================================ 动作
function filterFloor(code) { S.floorFilter = S.floorFilter === code ? null : code; S.pane = 'detail'; syncTabs(); renderDetail(); }

/** 柜型库详情：柜型卡片带缩略图，点卡片看中栏大图。
 *  需求：「将里面的不同的柜型都导出成jpg 格式，放在 library 里，可以点击查看」 */
/** 右侧：显示某个「N Units」下的**全部**摆法
 *
 *  key 形如 ``<dwgFileName>#<units>``。不去重（用户明确要求），
 *  所以同套数下有几个柜就平铺几张图，每张标注尺寸与排布，
 *  尺寸不同就是不同的摆法（1315×2250 与 1315×2300 算两种）。
 */
function showUnitsGroup(key, keepScroll) {
  // key 有两种形态：
  //   ``<fname>#<units>``      整个套数组（平铺全部摆法）
  //   ``<fname>#<units>@<id>`` 某一个具体摆法（树上「6 Units - B」）
  const at = String(key).indexOf('@');
  const onlyId = at >= 0 ? String(key).slice(at + 1) : '';
  const base = at >= 0 ? String(key).slice(0, at) : String(key);
  const hash = base.lastIndexOf('#');
  const fname = hash >= 0 ? base.slice(0, hash) : base;
  const n = hash >= 0 ? Number(base.slice(hash + 1)) : 0;
  const pool = S.variants.filter(v => {
    const vf = v.source_name || v.dwg_name || t('tree.library');
    return vf === fname && Number(v.positions || 0) === n;
  });
  // 与 libraryGroups() 保持同样的排序，树上第 i 个字母对应这里第 i 个
  const sortedPool = [...pool].sort((a, b) =>
    (Number(a.w) - Number(b.w)) || (Number(a.h) - Number(b.h))
    || String(a.code).localeCompare(String(b.code)));
  const items = onlyId
    ? pool.filter(v => String(v.id) === onlyId)
    : sortedPool;
  // 后缀字母：始终按**整组**的排序位置算，不能用 items.indexOf ——
  // 选中单个变体时 items 只有一条，会永远算成 "A"。
  const suffixOf = (v) => {
    if (sortedPool.length <= 1) return '';
    const i = sortedPool.findIndex(x => String(x.id) === String(v.id));
    return i >= 0 ? ' - ' + String.fromCharCode(65 + i) : '';
  };
  const withImg = items.filter(v => v.image_url);
  const scroll0 = keepScroll ? ($('#rpane')?.scrollTop || 0) : 0;

  $('#mfn').textContent = dispName(fname) + ' · ' + n + ' ' + t('lib.units')
    + (items.length === 1 ? suffixOf(items[0]) : '');
  $('#pagelist').innerHTML = '';
  resetViewer();
  $('#bpage').style.display = withImg.length ? '' : 'none';
  if (withImg.length) $('#bpage').textContent = `${withImg.length} ${t('lib.img')}`;
  $('#bparse').style.display = 'none';

  if (withImg.length) showCupImage(withImg[0].image_url);
  else $('#viewer').innerHTML = `<div class="ph"><div class="big">⊞</div>
    <div>${t('lib.noimg')}</div></div>`;

  let h = `<div class="sec" style="padding-left:0">
      ${dispName(fname)} · <b>${n} ${t('lib.units')}</b> ·
      ${LANGNOW === 'zh' ? '共' : ''} ${pool.length}
      ${LANGNOW === 'zh' ? '种摆法' : (pool.length === 1 ? 'layout' : 'layouts')}
      ${onlyId ? `<span style="color:var(--dim)"> · ${LANGNOW === 'zh' ? '仅显示' : 'showing'} ${
        n}${suffixOf(items[0])}</span>` : ''}
    </div>`;
  if (pool.length > 1 && !onlyId) {
    h += `<div class="alert ok" style="margin-bottom:10px">
      ${LANGNOW === 'zh'
        ? `同样是 ${n} 套，柜子的尺寸和 meter 摆放方式可以不同 —— 下面 ${pool.length} 种都是这个套数的合法柜型。`
        : `All ${pool.length} below hold ${n} units; only the size and meter layout differ.`}
    </div>`;
  }
  h += '<div class="cupgrid">';
  for (const v of items) {
    const src = v.size_source || 'estimated';
    const srcTag = src === 'measured' ? `<span class="tag ok">${t('lib.measured')}</span>`
      : src === 'manual' ? `<span class="tag">${t('lib.manual')}</span>`
      : `<span class="tag warn">${t('lib.estimated')}</span>`;
    h += `<div class="cupwrap">
    <div class="cupcard${v.image_url ? ' has-img' : ''}" data-img="${esc(v.image_url || '')}">
      <div class="thumb">${v.image_url
        ? `<img loading="lazy" src="${esc(v.image_url)}" alt="${esc(v.code)}">`
        : `<div class="noph">${t('lib.noimg')}</div>`}</div>
      <div class="meta">
        <div class="code mono">${esc(v.code)}</div>
        <div class="dim">${n} ${t('lib.units')}${esc(suffixOf(v))} · ${esc(v.grid || '-')}</div>
        <div class="dim">${v.w ?? '—'} × ${v.h ?? '—'} × ${v.d ?? '—'} mm ${srcTag}</div>
        ${v.description ? `<div class="desc">${esc(v.description)}</div>` : ''}
      </div></div>
      <button class="cupdel" data-del="${v.id}" data-code="${esc(v.code)}"
        title="${t('lib.del')}">×</button></div>`;
  }
  h += '</div>';
  $('#rpane').innerHTML = h;
  if (scroll0) $('#rpane').scrollTop = scroll0;

  $$('#rpane .cupcard').forEach(x => x.onclick = () => {
    const u = x.dataset.img;
    if (!u) { toast(t('lib.noclue'), 'err'); return; }
    showCupImage(u);
    $$('#rpane .cupcard').forEach(y => y.classList.toggle('on', y === x));
  });
  bindCupDelete();
}

/** 删除柜型 —— 用户诉求：「里面不需要的数据，我需要可以删除」。
 *  删完必须重建当前分组视图，否则卡片还挂在界面上，
 *  用户会以为没删掉。 */
function bindCupDelete() {
  $$('#rpane .cupdel').forEach(btn => {
    btn.onclick = async (ev) => {
      ev.stopPropagation();
      const id = +btn.dataset.del;
      const code = btn.dataset.code;
      if (!confirm((LANGNOW === 'zh'
        ? `确定删除柜型 ${code}？\n该柜型的图纸也会一并删除。`
        : `Delete cupboard ${code}? Its drawing will be removed too.`))) return;
      btn.disabled = true;
      try {
        await api(`/variants/${id}`, { method: 'DELETE' });
        toast(`${t('lib.deldone')} ${code}`, 'ok');
        await loadVariants();
        const cur = $('#mfn').textContent.split('·').pop().trim();
        showVariantGroup(cur);       // 重绘当前分组
      } catch (e) {
        toast(t('lib.delfail') + ': ' + e.message, 'err');
        btn.disabled = false;
      }
    };
  });
}

/** 中栏展示柜型大图 —— 直接用服务端渲染的 JPG，不做二次加载 */
function showCupImage(url) {
  $('#viewer').innerHTML =
    `<div class="cupview"><img id="cupimg" src="${esc(url)}" alt="cupboard"></div>`;
  $('#viewer').scrollTop = 0;
}

async function loadVariants() {
  try { S.variants = await api('/variants'); } catch (e) { S.variants = []; }
  // 后端按 meter 组合分组（需求 2：左侧种类 / 右侧排布）
  try {
    const g = await api('/cupboards');
    if (g && g.length) S.variants = S.variants.map(v => {
      const c = g.find(x => x.variants.some(y => y.code === v.code));
      return c ? { ...v, bucket: c.key, bucket_label: c.title } : v;
    });
  } catch (e) {}
  renderTree();
}

async function loadJob(jobId) {
  try {
    const j = await api(`/jobs/${jobId}`);
    S.job = {
      summary: j.summary, floors: j.floors || j.multi_signals?.floor_summary || [],
      units: j.units || [], multi_signals: j.multi_signals,
      diagnostics: j.diagnostics, warnings: j.warnings || [],
      cross_validation: j.cross_validation || {},
      rule_desc: j.rule_desc || {},
      config_version: j.config_version,
    };
    S.jobId = jobId;
    renderTree(); syncTabs(); renderPane();
    loadExports(jobId);
    // 中栏恢复原图预览：优先用解析时记录的页面角色清单
    const pages = S.job.pages || (j.multi_signals?.pages || []);
    if (pages.length) showPdf(jobId, pages);
    else showPdf(jobId, Array.from({ length: j.multi_signals?.page_count || 1 },
      (_, i) => ({ title: 'p' + (i + 1) })));
  } catch (e) { toast(t('load.fail') + ': ' + e.message, 'err'); }
}

function syncTabs() {
  $$('.rtabs button').forEach(b => b.classList.toggle('on', b.dataset.pane === S.pane));
}
function renderPane() {
  ({ matrix: renderMatrix, detail: renderDetail, prov: renderProv })[S.pane]();
}

// ============================================================ 预览
function showPlaceholder() {
  $('#viewer').innerHTML = `<div class="ph"><div class="big">▤</div><div>${t('mid.ph')}</div></div>`;
  $('#pagelist').innerHTML = '';
}

/* ============================================================ 连续滚动预览
 *用户诉求：「按顺序显示全部内容，不要翻页。还是可以鼠标上下快速翻页」
 *
 * 之前是「一页一屏 + 点页码换图」，35 页要点 35 次。
 * 现在改为**整份文档连续排开**，像读长文档一样一路滚下去；
 * 同时保留「快速翻页」：滚轮/ PageUp/PageDown/方向键都能整页跳。
 *
 * 实现要点：
 *  1. 每页先按 A4 比例（1:1.414）占好位，图片到位后不跳动 ——
 *     否则懒加载时页面高度突变，滚动位置会跳，体验比翻页还糟。
 *  2. IntersectionObserver 只加载**邻近 2 页**，远处的先占位。
 *     35 页全load 会把 37MB PDF 相关的渲染请求全打出去。
 *  3. 滚轮翻页用 scrollBy 而不是换img —— 这样用户能停在
 *     「两页中间」的位置，而整页跳转时也能快速定位。
 *  4. 快捷键/按钮走 gotoPage(n) 的「滚动到该页」，与滚轮共用一条路径。
 */
const A4_RATIO = 1.414;

/** 把中栏复位成「非滚动预览」状态。
 *  柜型库/建筑图纸 tab 会覆盖 #viewer 内容，但不会自动清掉
 *  .scrollmode —— 于是切回工作台时容器还带着 padding 与
 *  smooth滚动，单页预览会莫名偏移。统一在这里收口。 */
function resetViewer() {
  const v = $('#viewer');
  v.classList.remove('scrollmode');
  v.scrollTop = 0;
  $('#bprev').style.display = 'none';
  $('#bnext').style.display = 'none';
  $('#bpage').style.display = 'none';
  $('#bhelp').style.display = 'none';
}

/** 打开一份 PDF —— 整份连续排开，不做一页一屏 */
function showPdf(jobId, pages) {
  S.curPage = 0; S.jobId = jobId; S.zoom = S.zoom || 1;
  if (!pages?.length) {
    $('#viewer').classList.remove('scrollmode');
    $('#viewer').innerHTML =
      `<div class="ph"><div class="big">▤</div><div>${t('mid.ph')}</div></div>`;
    $('#pagelist').innerHTML = '';
    $('#bpage').textContent = `0 / 0`;
    return;
  }
  $('#bprev').style.display = '';
  $('#bnext').style.display = '';
  $('#bpage').style.display = '';
  renderPages(pages);
  bindScrollNav();
}

/** 单页图片 URL —— 走服务端渲染，不加载整份 PDF */
function pageUrl(n, dpi) { return `/api/page/${S.jobId}/${n}?dpi=${dpi || 110}`; }

/** 建好全部页面的占位骨架，一次性铺完（图片随后懒加载） */
function renderPages(pages) {
  S.pages = pages || [];
  const z = S.zoom || 1;
  // 内容宽度 = 中栏宽度 × 缩放。用 CSS 变量统一控制，
  // 改缩放时只需更新 --pw，所有页一起变
  const vw = $('#viewer').clientWidth || 800;
  const pw = Math.round((vw - 36) * z);
  const ph = Math.round(pw * A4_RATIO);

  const v = $('#viewer');
  v.classList.add('scrollmode');
  v.innerHTML = S.pages.map((p, i) =>
    `<div class="vpage" data-p="${i}" style="width:${pw}px;height:${ph}px">
       <div class="skel" style="height:${ph}px">${LANGNOW==='zh'?'加载中…':'Loading…'}${i + 1}</div>
       <img loading="lazy" alt="p${i + 1}" data-src="${pageUrl(i + 1)}">
       <div class="pno">${i + 1} / ${S.pages.length}</div>
     </div>`).join('');

  $('#pagelist').innerHTML = S.pages.map((p, i) =>
    `<div class="pg" data-p="${i}">${i + 1}. ${esc((p.title || '').slice(0, 14) || 'p' + (i + 1))}</div>`).join('');
  $$('#pagelist .pg').forEach(e => e.onclick = () => gotoPage(+e.dataset.p));

  observePages();
  v.scrollTop = 0;
  syncCurFromScroll();
}

/** 懒加载：进入视口 ±600px 的页才真正去取图 */
let _pgObserver = null;
function observePages() {
  if (_pgObserver) _pgObserver.disconnect();
  _pgObserver = new IntersectionObserver((es) => {
    for (const e of es) {
      if (!e.isIntersecting) continue;
      const img = e.target.querySelector('img[data-src]');
      if (!img || img.dataset.loaded) continue;
      img.dataset.loaded = '1';
      img.onload = () => {
        img.classList.add('on');
        img.parentElement.querySelector('.skel')?.classList.add('on');
      };
      img.onerror = () => {
        const s = img.parentElement.querySelector('.skel');
        if (s) s.textContent = `${LANGNOW==='zh'?'第':'Page '}${(+img.alt.slice(1))}${LANGNOW==='zh'?'页加载失败':' failed'}`;
      };
      img.src = img.dataset.src;
    }
  }, { root: $('#viewer'), rootMargin: '600px 0px' });
  $$('#viewer .vpage').forEach(n => _pgObserver.observe(n));
}

/** 滚动位置 → 当前页（页码条高亮 + 顶部计数） */
function syncCurFromScroll() {
  const v = $('#viewer');
  if (!v || !S.pages?.length) return;
  const nodes = $$('#viewer .vpage');
  // 切到柜型库/图纸 tab 后 .vpage 已被清空。此时若还照常遍历，
  // cur 会恒为 0 并把 S.curPage 写坏 —— 从 tab 切回来就再也回不到
  // 离开前那一页。DOM 不在时只更新计数，不碰状态。
  if (!nodes.length) {
    $('#bpage').textContent = `${S.curPage + 1} / ${S.pages.length}`;
    return;
  }
  const mid = v.scrollTop + v.clientHeight * 0.35;
  let cur = 0;
  nodes.forEach(n => {
    if (n.offsetTop <= mid) cur = +n.dataset.p;
  });
  S.curPage = cur;
  $('#bpage').textContent = `${cur + 1} / ${S.pages.length}`;
  $$('#pagelist .pg').forEach((e, k) => e.classList.toggle('on', k === cur));
  const p = S.pages[cur];
  const fn = [S.curFile, p?.title || p?.drawing_no].filter(Boolean).join(' — ');
  $('#mfn').textContent = fn || t('mid.none');
}

/** 滚动到指定页 —— 翻页按钮/页码条/键盘都走这里。
 *  behavior='auto' 用于切 tab 回来时的瞬时还原，不做二次平滑滚动。 */
function gotoPage(i, behavior) {
  if (!S.jobId || !S.pages?.length) return;
  const target = Math.max(0, Math.min(i, S.pages.length - 1));
  const node = $(`#viewer .vpage[data-p="${target}"]`);
  if (node) {
    $('#viewer').scrollTo({ top: node.offsetTop - 8,
                            behavior: behavior || 'smooth' });
  } else { S.curPage = target; syncCurFromScroll(); }
}

/** 相对翻页（◀ ▶ 按钮） */
function pageStep(d) { gotoPage(S.curPage + d); }

/** 重新按当前缩放重排全部页面 */
function reflowPages() {
  if (!S.pages?.length || !$('#viewer').classList.contains('scrollmode')) return;
  const keepTop = $('#viewer').scrollTop;
  renderPages(S.pages);
  //重排后按比例还原滚动位置，避免跳回开头
  requestAnimationFrame(() => { $('#viewer').scrollTop = keepTop; });
}

/** 滚动联动 + 滚轮快速翻页 —— 只绑一次。
 *
 *  用户诉求：「还是可以鼠标上下快速翻页」。
 *  连续滚动下滚轮本来就会滚，但**要滚一整屏**才能翻页，太慢。
 *  所以：Ctrl/⌘ + 滚轮 = 整页跳（细调靠裸滚轮）；
 *  PageUp/PageDown / 空格 / 方向键也整页跳。
 *  没有修饰键时保持原生连续滚动 —— 细看图纸时不能一滚就是一页。
 */
let _scrollBound = false;
function bindScrollNav() {
  const v = $('#viewer');
  if (!_scrollBound) {
    _scrollBound = true;
    let raf = 0;
    v.addEventListener('scroll', () => {
      if (raf) return;                    // 合并同一帧内的多次 scroll 事件
      raf = requestAnimationFrame(() => { raf = 0; syncCurFromScroll(); });
    }, { passive: true });
    v.addEventListener('wheel', (e) => {
      if (!(e.ctrlKey || e.metaKey)) return;// 裸滚轮= 连续滚动，不拦截
      e.preventDefault();
      pageStep(e.deltaY > 0 ? 1 : -1);
    }, { passive: false });
  }
}

function setZoom(z) {
  S.zoom = Math.max(0.4, Math.min(4, z));
  $('#bzoom').textContent = `${Math.round(S.zoom * 100)}%`;
  reflowPages();
}

// ============================================================ 导出
async function loadExports(jobId) {
  try {
    const ex = await api(`/jobs/${jobId}/exports`);
    S.exports = ex;
    $('#bexp')?.remove();
    const bar = document.createElement('div');
    bar.id = 'bexp'; bar.style.cssText = 'display:flex;gap:5px';
    bar.innerHTML = ['pdf', 'docx', 'jpg', 'xlsx', 'json'].map(k =>
      (ex[k] ? `<button class="btn ok" onclick="dlExport('${k}')">↓ ${k.toUpperCase()}</button>` : '')
    ).join('') || `<span class="muted" style="font-size:11px">${t('exp.none')}</span>`;
    $('.mid-bar').appendChild(bar);
  } catch (e) {}
}
function dlExport(k) {
  const p = S.exports?.[k];
  if (!p) return;
  window.open('/api/download?path=' + encodeURIComponent(p), '_blank');
}

    </div>
    <div class="mfoot">
      <button class="btn" id="bcancel">${t('up.cancel')}</button>
      <button class="btn pri" id="bgo" disabled>${t('up.go')}</button>
    </div>`);
  const dz = $('#dz'), fi = $('#fi');
  dz.onclick = () => fi.click();
  dz.ondragover = e => { e.preventDefault(); dz.classList.add('hot'); };
  dz.ondragleave = () => dz.classList.remove('hot');
  dz.ondrop = e => { e.preventDefault(); dz.classList.remove('hot'); if (e.dataTransfer.files[0]) doFile(e.dataTransfer.files[0], kind); };
  fi.onchange = () => fi.files[0] && doFile(fi.files[0], kind);
  S.uploadKind = kind;
  // 【bug 修复】submitUpload 此前从未被绑定 —— 按钮点了没反应。
  // 这里显式绑定，并复位按钮文案（showDwgResult 可能改过它）。
  const btn = $('#bgo');
  btn.onclick = submitUpload;
  btn.disabled = true;
  btn.textContent = t('up.go');
  $('#bcancel').onclick = closeModal;
}

async function doFile(f, kind) {
  S.uploadFile = f; S.uploadKind = kind;
  const btn = $('#bgo');
  btn.disabled = false;
  btn.onclick = submitUpload;      // 防御：确保任何路径下都可点
  btn.textContent = t('up.go');
  // 本地预览
  const box = $('#preview');
  if (f.type.startsWith('image/')) {
    box.innerHTML = `<div class="alert info">${t('up.imgprev')}</div><img src="${URL.createObjectURL(f)}" style="max-width:100%;border-radius:6px">`;
  } else {
    box.innerHTML = `<div class="alert info">${t('up.picked')} <b>${esc(f.name)}</b>（${(f.size / 1024 / 1024).toFixed(2)} MB）。${t('up.clickgo')}</div>`;
  }
  $('#upbox').innerHTML = `<div class="flist"><div class="f"><span class="n">${esc(f.name)}</span>
    <span class="badge">${(f.size / 1024 / 1024).toFixed(2)} MB</span></div></div>`;
}

async function submitUpload() {
  if (!S.uploadFile || S.parsing) return;
  const btn = $('#bgo');
  S.parsing = true;                       // 期间禁止关闭弹窗
  btn.disabled = true; btn.innerHTML = `<span class="spin"></span> ${t('up.parsing')}`;
  $('#bcancel').disabled = true;
  // 大文件解析要十几秒以上（实测 37MB/35页 = 18.5 秒），
  // 没有进度条用户会以为卡死并去点关闭 —— 于是「点一下就跳出去」
  const mb = S.uploadFile.size / 1024 / 1024;
  $('#prog').style.display = 'block';
  $('#pm').textContent = t('up.parsing');
  $('#pe').textContent = `${mb.toFixed(1)} MB`;
  let fake = 8;
  const t0 = Date.now();
  // 假进度：真实进度需要后端配合SSE/轮询，这里先给一个不会卡死的递增指示
  const timer = setInterval(() => {
    fake = Math.min(92, fake + Math.max(1, (95 - fake) / 8));
    $('#pb').style.width = fake + '%';
    $('#pe').textContent = `${mb.toFixed(1)} MB · ${Math.round((Date.now() - t0) / 1000)}s`;
  }, 700);

  const fd = new FormData();
  fd.append('file', S.uploadFile);
  fd.append('project', document.querySelector('#pname')?.value || '74 KEELER ST CARLINGFORD');
  try {
    const r = await api(`/parse?kind=${S.uploadKind}`, { method: 'POST', body: fd });
    clearInterval(timer);
    $('#pb').style.width = '100%';
    $('#pm').textContent = t('up.done');
    if (r.kind === 'dwg') {
      showDwgResult(r);
      // 解析完立刻渲染柜型图纸 —— 用户要求「读取 DWG 后把不同柜型导出成 JPG」。
      // 这步要等渲染完才允许关闭，否则用户会以为卡死。
      await renderCupboards(r.stored_name);
    } else showPdfResult(r);
    // 解析已完成，允许关闭
    S.parsing = false;
    $('#bcancel').disabled = false;
  } catch (e) {
    clearInterval(timer);
    S.parsing = false;                   // 失败才允许关闭，否则用户被困住
    $('#prog').style.display = 'none';
    $('#bcancel').disabled = false;
    btn.disabled = false; btn.textContent = t('up.go'); btn.onclick = submitUpload;
    toast(t('up.parsefail') + ': ' + e.message, 'err');
  }
}

function showDwgResult(r) {
  S.dwgRes = r;
  // 弹窗未打开时 #bgo 不存在 —— 防御性判空，避免整个渲染函数抛错
  const btn = $('#bgo');
  if (btn) {
    btn.disabled = !r.ok;
    btn.textContent = r.ok ? t('up.commit') : t('up.nogo');
    btn.onclick = () => commitDwg();
  }

  // 完整性分级：corrupt 必须显式红色警示，不能与 degraded/ok 混为一谈
  const integrityMap = {
    ok:       { cls: 'ok',   label: t('dwg.iok') },
    degraded: { cls: 'warn', label: t('dwg.ideg') },
    corrupt:  { cls: 'err',  label: t('dwg.icor') },
  };
  const ig = integrityMap[r.integrity] || { cls: '', label: r.integrity || t('dwg.un') };

  // r.blocks 是字符串数组，r.block_layers / r.block_entity_counts 是对照表
  const blocks = r.blocks || [];
  const bl = r.block_layers || {};
  const bc = r.block_entity_counts || {};
  const mspTotal = Object.values(r.entity_counts || {}).reduce((a, b) => a + b, 0);
  const blkTotal = Object.values(bc).reduce((a, b) => a + b, 0);

  $('#preview').innerHTML = `
    <div class="alert ${ig.cls}">
      ${t('dwg.backend')}: <b>${esc(r.backend)}</b>｜${t('dwg.integ')}: <b>${esc(ig.label)}</b>
      ${r.error ? '<br/>' + esc(r.error) : ''}
    </div>
    <div class="kpis">
      <div class="kpi"><div class="v">${(r.layers || []).length}</div><div class="l">${t('dwg.layer')}</div></div>
      <div class="kpi p"><div class="v">${blocks.length}</div><div class="l">${t('dwg.block')}</div></div>
      <div class="kpi g"><div class="v">${mspTotal + blkTotal}</div><div class="l">${t('dwg.entity')}</div></div>
      <div class="kpi ${r.integrity === 'corrupt' ? 'r' : 'o'}"><div class="v">${(r.warnings || []).length}</div><div class="l">${t('dwg.warn')}</div></div>
    </div>
    ${(r.integrity_notes || []).map(n => `<div class="alert ${r.integrity === 'corrupt' ? 'err' : 'warn'}">${esc(n)}</div>`).join('')}
    <div id="rendbox"></div>`;
}

/** 渲染完成后把缩略图贴进确认弹窗 —— 用户要先看到图再决定要不要入库。
 *
 *  用户诉求：「不应该只是左侧的类型树状结构，预览一下」
 *  → 每张卡片带复选框，可以只勾选需要的柜型入库，
 *    并且默认全选（他也可以全不勾就取消入库）。
 *  用户诉求：「里面的不需要的数据，我需要可以删除」
 *  → 勾选状态 S.selBlocks 驱动 commitDwg 只提交勾中的。 */
function paintRenders() {
  const box = $('#rendbox');
  if (!box) return;
  const rs = (S.renders || []).filter(r => r.ok);
  if (!rs.length) {
    const all = S.renders || [];
    box.innerHTML = `<div class="sec" style="padding-left:0">${t('lib.title')}</div>`
      + `<div class="alert err">${esc((all[0] || {}).error || t('lib.noimg'))}</div>`;
    return;
  }
  // 默认全选 —— 但只针对**判定为柜型**的那些（renders 已过滤）
  if (!S.selBlocks || S.selBlocks.length !== rs.length) {
    S.selBlocks = rs.map(r => r.block_name);
  }
  const sel = new Set(S.selBlocks);
  const det = S.detected || {};
  let h = `<div class="sec" style="padding-left:0">${t('lib.title')} · ${rs.length}/${t('lib.picked')}</div>`;
  // 识别摘要 —— 解释「一整张图纸里为什么只切出这几个柜型」
  if (det.rejected !== undefined) {
    h += `<div class="alert ok">
      ${LANGNOW==='zh'?'已识别柜型':'Cupboards detected'}: <b>${det.detected ?? rs.length}</b> ·
      ${LANGNOW==='zh'?'已排除非柜体区域':'non-cupboard regions filtered'}: <b>${det.rejected}</b>
      ${det.sample ? `<br/><span style="font-size:12px;opacity:.85">${esc(det.sample)}</span>` : ''}
    </div>`;
  }
  h += `<div class="rendops">
      <label><input type="checkbox" id="selall" ${sel.size === rs.length ? 'checked' : ''}> ${t('lib.selall')}</label>
      <span class="muted" id="selcnt">${sel.size} / ${rs.length}</span>
      <button class="btn" id="selnone">${t('lib.selnone')}</button>
    </div><div class="cupgrid" style="padding-left:0">`;
  // 柜型尺寸/套数明细 —— 后端返回 cupboards 时按柜型展示，
  // 没有就退回旧的「实体数 × 尺寸」写法。
  const cupByCode = new Map((S.cupboards || []).map(c => [c.code, c]));
  for (const r of rs) {
    const on = sel.has(r.block_name);
    const c = cupByCode.get(r.block_name);
    const meta = c
      ? `<div class="dim">${LANGNOW==='zh'
          ? `${c.positions_total} ${t('lib.units')}${c.grid_aspect ? ' · ' + c.grid_aspect : ''}`
          : `${c.positions_total} units${c.grid_aspect ? ' · ' + c.grid_aspect : ''}`}
          ${c.gas_count}/${c.water_count} · ${c.w} × ${c.h} mm</div>`
      : `<div class="dim">${r.entity_count} ${t('dwg.entity')} · ${r.width_mm ?? '—'} × ${r.height_mm ?? '—'} mm</div>`;
    h += `<div class="cupcard has-img${on ? ' on' : ''}" data-sel="${esc(r.block_name)}">
        <div class="thumb"><img loading="lazy" src="/api/thumbs/${esc(r.image_name)}"
             alt="${esc(r.block_name)}"><span class="tick">${on ? '✓' : ''}</span></div>
        <div class="meta"><div class="code mono">${esc(r.block_name)}</div>${meta}</div></div>`;
  }
  h += '</div>';

  // 被排除的非柜体区域 —— 折叠起来，让用户能核对而不是被噪声淹没
  if ((S.rejected || []).length) {
    h += `<details class="rejd"><summary>${LANGNOW==='zh'
      ? `已排除 ${S.rejected.length} 个非柜体区域（点击查看）`
      : `${S.rejected.length} non-cupboard regions filtered (click)`}</summary>`
      + `<div class="rejlist">${S.rejected.slice(0, 80).map(x =>
          `<div><code>${x.w ?? ''}${x.h ? '×' + x.h + 'mm' : ''}</code><span>${esc(x.reason || '')}</span></div>`
        ).join('')}</div></details>`;
  }
  box.innerHTML = h;

  // 勾选交互
  const cards = $$('#rendbox .cupcard');
  const sync = () => {
    S.selBlocks = cards.filter(c => c.classList.contains('on')).map(c => c.dataset.sel);
    const c = $('#selcnt'); if (c) c.textContent = `${S.selBlocks.length} / ${cards.length}`;
    const a = $('#selall'); if (a) a.checked = S.selBlocks.length === cards.length;
  };
  cards.forEach(n => n.onclick = () => { n.classList.toggle('on'); sync(); });
  const all = $('#selall');
  if (all) all.onchange = () => cards.forEach(c => c.classList.toggle('on', all.checked));
  const none = $('#selnone');
  if (none) none.onclick = () => { cards.forEach(c => c.classList.remove('on')); sync(); };
}

async function showPdfResult(r) {

    summary: r.summary, floors: r.floor_summary || r.multi_signals?.floor_summary || [],
    units: r.units || [], multi_signals: r.multi_signals,
    diagnostics: r.diagnostics, warnings: r.warnings || [],
    cross_validation: r.cross_validation || r.multi_signals?.cross_validation || {},
    rule_desc: r.rule_desc || {},
    config_version: r.config_version,
  };
  S.curFile = S.uploadFile.name;
  S.curBuilding = r.building_id;

    ｜${LANGNOW==='zh'?'平均置信度':'avg confidence'} ${r.summary.avg_confidence}<br>
    ${t('cv.title')}: ${esc(S.job.cross_validation.verdict || 'n/a')}, ${t('cv.rate')} ${S.job.cross_validation.consistency ?? '—'}

/** 解析完 DWG 后渲染每个柜型 block 成 JPG。
 *  需求：「读取了 dwg 文件，将里面的不同的柜型都导出成 jpg 格式，
 *  放在 library 里，可以点击查看」。渲染结果存S.renders，
 *  用户确认入库时一并回传，图片路径才会绑到变体上。 */
async function renderCupboards(storedName) {
  if (!storedName) return [];
  try {
    $('#pm').textContent = t('lib.rendering');
    const r = await api('/cupboards/render', {
      method: 'POST', headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ file: storedName }),
    });
    S.renders = r.items || [];
    S.storedName = storedName;
    // 柜型识别明细 —— 后端已从「block 名打分」改成「几何分解」，
    // 响应字段也跟着换了：
    //   detected / rejected / rejected_items （旧，按 block 打分）
    // → cupboards / discarded / diag（按柜体几何）
    // 这里做一次兼容，两个字段名都收，老后端也不会把界面搞空。
    const cupboards = r.cupboards || null;
    const discarded = r.discarded || r.rejected_items || [];
    S.detected = cupboards
      ? { detected: (cupboards).length, rejected: (discarded).length,
          sample: discarded.slice(0, 3).map(
            x => `${x.w}×${x.h}mm —— ${x.reason}`).join(' / ') }
      : { detected: r.detected, rejected: r.rejected,
          sample: (r.rejected_items || []).slice(0, 3).map(
            x => `${x.block_name} —— ${x.reason}`).join(' / ') };
    S.rejected = discarded;
    S.cupboards = cupboards || [];
    S.diag = r.diag || null;
    const totalUnits = S.cupboards.reduce(
      (a, c) => a + (c.positions_total || 0), 0);
    $('#pm').textContent = cupboards
      ? `${t('lib.rendered')} ${r.rendered}/${t('lib.of')} ${S.cupboards.length}`
        + (totalUnits ? ` · ${LANGNOW==='zh'?'总套数':'units'} ${totalUnits}` : '')
      : `${t('lib.rendered')} ${r.rendered}/${t('lib.of')} ${r.detected ?? r.rendered}`;
    paintRenders();
    return S.renders;
  } catch (e) {
    S.renders = [];
    toast(t('lib.rendering') + ' → ' + e.message, 'err');
    return [];
  }
}

/** 把渲染结果整成入库要提交的 variants。
 *  以block 为单位生成变体：尺寸全部用 DWG 实测值，不再填占位数字。 */
/** 把渲染结果整成入库要提交的 variants。
 *
 *  套数与排布必须取后端解析出的**真实几何**（`S.cupboards`），
 *  不能在这里估。
 *
 *  旧实现按 `entity_count / 8` 反推行数、`rows` 恒写 1，
 *  于是入库的柜型全是「1 行 N 列」，套数也是空的 ——
 *  左树没法按「5 Units / 6 Units」分组，整条链路就断了。
 */
function dwgVariantsFromRenders(renders) {
  // code ->柜体几何明细
  const geo = new Map((S.cupboards || []).map(c => [c.code, c]));
  return (renders || []).filter(r => r.ok).map(r => {
    const c = geo.get(r.block_name);
    return {
      code: r.block_name,
      block_name: r.block_name,
      // 套数：优先后端解析值；退化时从 code（CP-6p-09）里解析。
      // 注意 `??` 与 `||` 不能直接混用，Number(...) 外面必须加括号。
      positions: c?.positions_total
        ?? (Number((String(r.block_name).match(/CP-(\d+)p/) || [])[1]) || null),
      rows: c?.layout_rows ?? 1,
      cols: c?.layout_cols ?? 1,
      grid: c?.grid_aspect || null,
      gas_count: c?.gas_count ?? null,
      water_count: c?.water_count ?? null,
      w: c?.w ?? r.width_mm ?? null,
      h: c?.h ?? r.height_mm ?? null,
      meter_combo: r.block_name,
      description: (c?.notes?.length ? c.notes.slice(0, 4).join(' / ')
        : (r.texts || []).slice(0, 4).join(' / ')) || null,
    };
  });
}

async function commitDwg() {
  try {
    // 只提交**勾选**的柜型 —— 用户可以在预览里逐个勾，
    // 也可以一键全不勾直接放弃入库。
    const sel = new Set(S.selBlocks || []);
    const hasSel = S.selBlocks && S.selBlocks.length;
    const renders = (S.renders || []).filter(r =>
      r.ok && (!hasSel || sel.has(r.block_name)));
    const variants = dwgVariantsFromRenders(renders);
    if (!variants.length) {
      toast(t('lib.nosel'), 'err');
      return;
    }
    const r = await api('/cupboards/from-dwg', {
      method: 'POST', headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({
        source_file: S.storedName || (S.dwgRes && S.dwgRes.source_file) || '',
        // 根节点显示名 = DWG 文件名（去掉路径和扩展名）
        source_name: (S.storedName || S.dwgRes?.source_file || 'DWG')
          .split('/').pop().replace(/\.dwg$/i, '').replace(/\.dxf$/i, ''),
        cupboard_name: '柜型库（' + (S.storedName || 'DWG') + '）',
        variants,
        renders,
      }),
    });
    toast(`${t('up.ok')} ${r.created}`, 'ok');
    closeModal();
    await loadVariants();
    // 直接跳到柜型库并打开第一组，让用户立刻看到图
    gotoView('cupboard');
    const g = S.variants[0];
    if (g) {
      const first = S.variants.find(v => v.image_url);
      if (first) showVariantGroup(first.bucket || ('p' + first.positions));
      else renderHub();
    } else renderHub();
  } catch (e) { toast(t('up.fail') + ': ' + e.message, 'err'); }
}

// ============================================================ 绑定
/** 三个 tab 各自独立：**每个 tab 有自己的树、自己的主区域、自己的上传入口。
    用户原话：切到柜型库还是显示楼栋的内容 —— 根因是以前只换右栏 #rpane，
    左侧树和中栏始终是楼栋的。现在按view 整体切换。 */
function renderHub() {
  const isCup = S.view === 'cupboard';
  // 两个 hub tab 都不是楼栋预览视图，先把工作台的连续滚动状态收掉。
  // 放函数开头统一做，避免只补了 isCup 分支漏掉 building。
  resetViewer();

  if (isCup) {
    // 柜型库：中栏不该再预览楼栋图纸，改为展示分组说明
    $('#mfn').textContent = t('tree.library');
    $('#pagelist').innerHTML = '';
    $('#viewer').innerHTML = `<div class="ph"><div class="big">⊞</div>
      <div>${t('mid.cup.hint')}</div></div>`;
    $('#bparse').style.display = 'none';
  }

  let h = '';
  if (isCup) {
    const groups = variantGroups();
    const nAll = S.variants.length;
    const nImg = S.variants.filter(v => v.image_url).length;
    h += `<div class="sec" style="padding-left:0">${t('tree.library')}</div>`;
    if (!groups.length) {
      h += `<div class="empty"><div class="big">⊞</div><b>${t('dwg.empty')}</b></div>`;
    } else {
      // 批量管理工具条 —— 用户诉求：「里面不需要的数据，我需要可以删除」
      h += `<div class="mgmt">
        <span class="muted">${nAll} ${t('mtx.kind')}${nImg ? ' · ' + nImg + ' ' + t('lib.img') : ''}</span>
        <span class="sp"></span>
        <button class="btn sm" id="mginv">${t('lib.mginv')}</button>
        <button class="btn sm danger" id="mgclear">${t('lib.clear')}</button>
      </div>`;
      h += '<div class="filelist">';
      for (const g of groups) {
        h += `<div class="row-item" data-vg="${esc(g.key)}">
          <div class="ico">⊞</div>
          <div class="nm"><div class="t">${esc(g.title)}</div>
            <div class="s">${g.count} ${t('mtx.kind')}</div></div>
          <span class="badge">${t('bld.open')} ›</span></div>`;
      }
      h += '</div>';
    }
  } else {
    h += `<div class="sec" style="padding-left:0">${t('tree.projects')}</div>`;
    if (!S.projects.length) {
      h += `<div class="empty"><div class="big">▦</div><b>${t('bld.empty')}</b></div>`;
    } else {
      h += '<div class="filelist">';
      for (const p of S.projects) {
        const d = (p.drawings || [])[0];
        h += `<div class="row-item" data-b="${p.id}">
          <div class="ico">▦</div>
          <div class="nm"><div class="t">${esc(p.name)}</div>
            <div class="s">${(p.drawings || []).length} ${t('bld.count')}${d?.title ? ' · ' + esc(d.title) : ''}</div></div>
          <span class="badge">${t('bld.open')} ›</span></div>`;
      }
      h += '</div>';
    }
  }
  $('#rpane').innerHTML = h;
  $$('#rpane .row-item').forEach(n => n.onclick = () => {
    if (n.dataset.vg) { showVariantGroup(n.dataset.vg); return; }
    // 打开项目：回到工作台视图并加载该 building 的解析结果
    gotoView('work');
    S.curBuilding = +n.dataset.b; S.treeSel = 'floors';
    renderTree();
    (async () => {
      try {
        const jobs = await api('/jobs?limit=30');
        const j = jobs.find(x => (x.building_id ?? null) === S.curBuilding) || jobs[0];
        if (j) { await loadJob(j.id); showPdf(j.id, S.pages?.length ? S.pages : []); }
        else renderPane();
      } catch (e) { renderPane(); }
    })();
  });
  bindLibraryManage();
}

/** 柜型库批量管理：反向选择（批量删）+ 清空 DWG 解析结果。
 *
 *  用户诉求原文：「没有删除功能，里面的不需要的数据，我需要可以删除」。
 *  两个入口：
 *    · 卡片右上角 ×—— 删单个（见 bindCupDelete）
 *    · 这里的「反向选择 / 清空」—— 一次处理几十个，
 *      否则逐张点 × 在 141 个变体上根本没法用。
 */
function bindLibraryManage() {
  const inv = $('#mginv');
  if (inv) inv.onclick = async () => {
    const ids = S.variants.map(v => v.id);
    if (!ids.length) { toast(t('lib.empty'), 'err'); return; }
    const excluded = new Set((S.selBlocks || []).map(String));
    // 「反向选择」= 排除勾选/带图的，删掉其余 —— 语义写清楚，
    // 不能让用户猜「反向」到底是取反还是取补
    const del = S.variants.filter(v => !excluded.has(String(v.code)))
                          .map(v => v.id);
    if (!del.length) { toast(t('lib.nosel'), 'err'); return; }
    if (!confirm((LANGNOW === 'zh'
      ? `将删除 ${del.length} 个柜型（保留 ${excluded.size} 个已勾选/带图的）。\n确定继续？`
      : `Delete ${del.length} cupboards (keep ${excluded.size})?`))) return;
    try {
      const r = await api('/variants/delete', {
        method: 'POST', headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ ids: del }),
      });
      toast(`${t('lib.deldone')} ${r.deleted}`, 'ok');
      await loadVariants();
      gotoView('cupboard');
    } catch (e) { toast(t('lib.delfail') + ': ' + e.message, 'err'); }
  };

  const clr = $('#mgclear');
  if (clr) clr.onclick = async () => {
    const n = S.variants.filter(v => v.source === 'dwg').length;
    if (!n) { toast(t('lib.nodwg'), 'err'); return; }
    if (!confirm((LANGNOW === 'zh'
      ? `将清空 ${n} 个从 DWG 解析进来的柜型（手工录入与种子数据保留）。\n确定？`
      : `Clear ${n} DWG-derived cupboards?`))) return;
    try {
      const r = await api('/variants/clear', {
        method: 'POST', headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ only_dwg: true }),
      });
      toast(`${t('lib.deldone')} ${r.deleted}`, 'ok');
      await loadVariants();
      gotoView('cupboard');
    } catch (e) { toast(t('lib.delfail') + ': ' + e.message, 'err'); }
  };
}

/** 右栏 tab 也按 tab 切换 —— 「楼层×柜型」这类标签对柜型库毫无意义 */
function syncTabsForView() {
  const tabs =$$('.rtabs button');
  if (S.view === 'cupboard') {
    tabs.forEach(b => b.classList.remove('on'));
    $('#rpane').innerHTML = '';   // 由 renderHub 填充
    return;
  }
  if (S.view === 'building') {
    // 建筑图纸 tab：没有解析结果可看，隐藏三个结果页
    tabs.forEach(b => b.style.display = 'none');
    return;
  }
  tabs.forEach(b => { b.style.display = ''; b.classList.toggle('on', b.dataset.pane === S.pane); });
}

/** 统一切换 tab：三个 tab 的树/ 中栏 / 右栏整体切换，避免串内容 */
function gotoView(v) {
  S.view = v;
  $$('nav button').forEach(x => x.classList.toggle('on', x.dataset.view === v));
  // 上传按钮只在「柜型库」「建筑图纸」两个 tab 出现 ——
  // 工作台是看解析结果的，不该摆上传入口
  $('#bup').style.display = v === 'work' ? 'none' : 'inline-block';
  // 滚动提示只在工作台的连续预览里才有意义
  $('#bhelp').style.display = v === 'work' ? '' : 'none';
  syncTabsForView();
  if (v === 'work') {
    renderTree();
    // 从柜型库切回来时，renderHub() 已把 #viewer 的 DOM 换成占位提示，
    // .vpage 全没了 —— 此时 syncCurFromScroll() 里遍历不到任何节点，
    // 当前页会恒为 0，页面一片空白。必须先按S.pages 重建整条预览，
    // 再把滚动位置还原回离开前的那一页。
    if (S.jobId && S.pages?.length) {
      const back = S.curPage || 0;
      if (!document.querySelector('#viewer .vpage')) {
        renderPages(S.pages);
        requestAnimationFrame(() => gotoPage(back, 'auto'));
      } else {
        // 页面还在（建筑图纸 tab 不动中栏）—— 只同步当前页即可，
        // 直接 gotoPage 会二次平滑滚动，看着像页面自己动了一下
        syncCurFromScroll();
      }
    } else {
      $('#mfn').textContent = t('mid.none');
    }
    // renderHub/resetViewer 会把提示清掉，切回工作台要重新挂上
    $('#bhelp').style.display = S.jobId && S.pages?.length ? '' : 'none';
    renderPane();
  } else {
    renderTree();     // 树也切：柜型库时只显示柜型分组
    renderHub();
  }
}

$$('nav button').forEach(b => b.onclick = () => gotoView(b.dataset.view));
$('#bup').onclick = () => openUpload(S.view === 'cupboard' ? 'cupboard' : 'building');
$('#lzh').onclick = () => { LANGNOW = 'zh'; applyI18n(); };
$('#len').onclick = () => { LANGNOW = 'en'; applyI18n(); };
$$('.rtabs button').forEach(b => b.onclick = () => { S.pane = b.dataset.pane; syncTabs(); renderPane(); });
$('#bprev').onclick = () => pageStep(-1);
$('#bnext').onclick = () => pageStep(1);
$('#bzin').onclick = () => setZoom((S.zoom || 1) * 1.25);
$('#bzout').onclick = () => setZoom((S.zoom || 1) / 1.25);
$('#bparse').onclick = () => openUpload('building');
// 点遮罩关闭 —— 但解析中closeModal 自身会拒绝，这里只拦住冒泡
$('#mask').onclick = e => { if (e.target.id === 'mask') closeModal(); };
document.addEventListener('keydown', e => {
  if (e.key === 'Escape') closeModal();
  //输入框里打字时不抢快捷键
  if (/^(INPUT|TEXTAREA|SELECT)$/.test(e.target.tagName)) return;
  const cont = S.view === 'work' && $('#viewer').classList.contains('scrollmode');
  if (!cont) return;
  // 连续滚动模式下，方向键/翻页键 = 整页跳；
  // 上下键保持浏览器原生细滚，方便看图纸局部。
  if (e.key === 'ArrowLeft' || e.key === 'PageUp') { e.preventDefault(); pageStep(-1); }
  else if (e.key === 'ArrowRight' || e.key === 'PageDown'
        || e.key === ' ') { e.preventDefault(); pageStep(1); }
  else if (e.key === 'Home') { e.preventDefault(); gotoPage(0); }
  else if (e.key === 'End') { e.preventDefault(); gotoPage(S.pages.length - 1); }
});

boot();
</script>
</body>
