<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>AU Cupboards — 计量柜选型系统</title>
<!-- 内联 SVG favicon。
     为什么不用 /favicon.ico 文件：后端只服务 GET /（见 server.py 的
     index()），其他路径一律 404，所以浏览器每次都会请求
     /favicon.ico 并拿到 404 —— 实测每次开页面都刷一条 404 日志，
     干扰排查真正的问题。
     为什么不用外链 CDN：本应用要求能离线跑（现场解析 DWG），
     CDN 挂了就全崩，与 icons 全部内联的既定做法一致。
     data URI 浏览器直接解析，**零网络请求、零 404**。
     图形沿用界面主色 --accent(#2563eb)：一个带表位的柜子轮廓。 -->
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='6' fill='%232563eb'/%3E%3Cg fill='none' stroke='%23fff' stroke-width='2' stroke-linecap='round'%3E%3Crect x='8' y='6' width='16' height='20' rx='1.5'/%3E%3Cpath d='M8 13h16M8 19h16'/%3E%3C/g%3E%3Ccircle cx='16' cy='9.5' r='1.6' fill='%23fff'/%3E%3Ccircle cx='16' cy='16' r='1.6' fill='%23fff'/%3E%3Ccircle cx='16' cy='22.5' r='1.6' fill='%23fff'/%3E%3C/svg%3E" />
<style>
:root{
  /* ---- 白色基调（light theme）----
     浅灰画布 + 纯白卡片 + 细分隔线，靠层次而非重色区分区块 */
  --bg:#f1f5f9; --panel:#ffffff; --panel2:#f8fafc; --line:#e2e8f0;
  --txt:#0f172a; --dim:#64748b; --accent:#2563eb; --accent2:#1d4ed8;
  --ok:#16a34a; --warn:#d97706; --err:#dc2626; --purple:#9333ea;
  /* 语义底色统一为浅色调，保证文字对比度 ≥4.5:1 */
  --ok-bg:#f0fdf4; --warn-bg:#fffbeb; --err-bg:#fef2f2; --info-bg:#eff6ff;
  --shadow:0 1px 3px #0f172a12, 0 1px 2px #0f172a0a;
  --shadow-lg:0 10px 40px #0f172a1f, 0 4px 12px #0f172a14;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{
  font:13px/1.5 -apple-system,"Segoe UI","Microsoft YaHei",sans-serif;
  background:var(--bg);color:var(--txt);overflow:hidden;
}
button{font:inherit;cursor:pointer;border:none;background:none;color:inherit}
input,select{font:inherit}

/* ---------- 顶栏 ---------- */
header{
  height:52px;display:flex;align-items:center;gap:18px;
  background:var(--panel);border-bottom:1px solid var(--line);padding:0 16px;flex-shrink:0;
}
.logo{font-weight:700;font-size:15px;color:var(--txt);letter-spacing:.3px;white-space:nowrap}
.logo span{color:var(--accent)}
nav{display:flex;gap:2px;flex:1}
nav button{
  padding:7px 14px;border-radius:6px;color:var(--dim);font-weight:500;transition:.15s;
}
nav button:hover{background:var(--panel2);color:var(--txt)}
nav button.on{background:var(--accent);color:#fff}
.hstat{font-size:11px;color:var(--dim);white-space:nowrap;display:flex;align-items:center;gap:10px}
/* 问题13：标准网站式用户菜单 */
.huser{position:relative}
.huser-btn{display:inline-flex;align-items:center;gap:6px;padding:5px 10px;border:1px solid var(--line);border-radius:6px;background:var(--panel);cursor:pointer;font-size:12px;font-weight:500}
.huser-btn:hover{background:var(--panel2)}
.huser-btn .avatar{width:22px;height:22px;border-radius:50%;background:var(--accent);color:#fff;display:inline-flex;align-items:center;justify-content:center;font-size:11px;font-weight:700}
.huser-menu{position:absolute;right:0;top:calc(100% + 6px);min-width:180px;background:var(--panel);border:1px solid var(--line);border-radius:8px;box-shadow:0 8px 24px rgba(0,0,0,.12);z-index:100;display:none;overflow:hidden}
.huser-menu.on{display:block}
.huser-menu .mhead{padding:10px 14px;border-bottom:1px solid var(--line);font-size:12px}
.huser-menu .mhead b{display:block;font-size:13px}
.huser-menu .mhead span{color:var(--dim);font-size:11px}
.huser-menu button{display:flex;align-items:center;gap:8px;width:100%;padding:9px 14px;border:0;background:none;cursor:pointer;font-size:12.5px;color:var(--fg);text-align:left}
.huser-menu button:hover{background:var(--panel2)}
.huser-menu button.danger{color:#dc2626}
.hexport{padding:5px 12px;border-radius:6px;background:var(--ok);color:#fff;font-size:12px;font-weight:600;display:inline-flex;align-items:center;gap:5px;border:0;cursor:pointer}
.hexport:hover{filter:brightness(0.95)}

/* 语言切换 + 顶栏上传按钮 */
.langsw{display:flex;border:1px solid var(--line);border-radius:5px;overflow:hidden;background:#fff}
.langsw button{padding:4px 9px;font-size:11px;color:var(--dim);transition:.15s}
.langsw button.on{background:var(--accent);color:#fff}
.langsw button:not(.on):hover{background:var(--panel2)}
.hupload{
  padding:6px 13px;border-radius:6px;background:var(--accent);color:#fff;
  font-size:12px;font-weight:600;transition:.15s;white-space:nowrap;
  display:inline-flex;align-items:center;gap:5px;
}
.hupload:hover{background:var(--accent2)}
.badge{
  display:inline-block;padding:2px 7px;border-radius:10px;font-size:10px;font-weight:600;
  background:var(--panel2);color:var(--dim);border:1px solid var(--line);
}
.badge.on{background:var(--ok-bg);color:var(--ok);border-color:#bbf7d0}
/* DWG 未就绪时徽章可点击，提示「点我装后端」 */
.badge.link{cursor:pointer;background:var(--warn-bg);color:var(--warn);border-color:#fde68a}
.badge.link:hover{background:#fef3c7}

/* ---- 柜型库：卡片网格 + 大图查看 ---- */
.cupgrid{
  display:grid;grid-template-columns:repeat(auto-fill,minmax(184px,1fr));
  gap:10px;padding:0 12px 14px;
}
/* 图库网格里卡片**按图片实际比例**排版，不留固定高度的空白。
   之前 .thumb 写死 height:124px + img max-height:124pxobject-fit:contain，
   于是竖长的柜型图（如 13Units 447×502）在184px 宽的格子里只占
   几十px 宽，四周全是空白 —— 用户诉求「留白太多了，需要与其他保持一致」。
   现在改成：图片按宽度铺满卡片，高度自适应；卡片高度由图片决定。 */
.cupgrid .cupcard{height:auto}
.cupgrid .cupcard .thumb{
  height:auto;min-height:0;background:#fff;padding:5px;
  align-items:flex-start;justify-content:flex-start;
}
.cupgrid .cupcard .thumb img{
  width:100%;height:auto;max-height:none;object-fit:contain;display:block;
}
.cupcard{
  border:1px solid var(--line);border-radius:8px;background:var(--panel);
  overflow:hidden;cursor:pointer;transition:border-color .12s,box-shadow .12s;
}
.cupcard:hover{border-color:var(--accent);box-shadow:var(--shadow)}
.cupcard.on{border-color:var(--accent);box-shadow:0 0 0 2px #2563eb33}
.cupcard .thumb{
  height:124px;background:var(--panel2);display:flex;
  align-items:center;justify-content:center;border-bottom:1px solid var(--line);
}
.cupcard .thumb img{max-width:100%;max-height:124px;object-fit:contain;display:block}
.cupcard .noph{font-size:11px;color:var(--dim);text-align:center;padding:0 8px}
.cupcard .meta{padding:7px 9px 9px}
.cupcard .code{font-size:11.5px;font-weight:600;color:var(--txt);
  word-break:break-all;line-height:1.35}
.cupcard .dim{font-size:10.5px;color:var(--dim);margin-top:2px}
.cupcard .desc{
  font-size:10.5px;color:var(--dim);margin-top:4px;
  display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;
}
/* ---- 卡片删除：按钮放外层，避免和「点卡片看大图」抢事件 ---- */
.cupwrap{position:relative}
.cupdel{
  position:absolute;top:3px;right:3px;width:19px;height:19px;line-height:17px;
  border:1px solid var(--line);border-radius:50%;background:#fff;color:var(--dim);
  font-size:13px;cursor:pointer;padding:0;text-align:center;opacity:0;
  transition:opacity .12s;
}
.cupwrap:hover .cupdel{opacity:1}
.cupdel:hover{background:#dc2626;border-color:#dc2626;color:#fff}
.cupdel:disabled{opacity:.4;cursor:not-allowed}
/* ---- 上传确认弹窗里的勾选 ---- */
.rendops{display:flex;align-items:center;gap:10px;margin:6px 0 9px;padding:0 2px}
.rendops .sp{flex:1}
.rendops label{cursor:pointer;font-size:12.5px;display:flex;align-items:center;gap:5px}
.cupcard[data-sel] .tick{
  position:absolute;top:5px;left:5px;width:17px;height:17px;line-height:17px;
  border-radius:50%;background:#2563eb;color:#fff;font-size:11px;text-align:center;
}
.cupcard .thumb{position:relative}
.cupcard[data-sel]{cursor:pointer}
.cupcard[data-sel]:not(.on){opacity:.42}
.cupcard[data-sel]:not(.on) .thumb{filter:grayscale(1)}
/* ---- 被排除的非柜型 block：折叠，默认可有可无 ---- */
.rejd{margin-top:12px;font-size:12px;color:var(--dim)}
.rejd summary{cursor:pointer;padding:5px 0;user-select:none}
.rejd summary:hover{color:var(--txt)}
.rejlist{
  max-height:190px;overflow:auto;border:1px solid var(--line);
  border-radius:6px;padding:6px 8px;background:#fafbfc;margin-top:5px;
}
.rejlist>div{display:flex;gap:8px;padding:2px 0;border-bottom:1px solid #f0f0f0}
.rejlist code{font-size:11px;color:var(--txt);flex:1;word-break:break-all}
.rejlist span{font-size:10.5px;color:var(--dim);white-space:nowrap}
/* ---- 楼层×柜型矩阵里的柜型缩略图 ----
   用户诉求：「右侧这个楼层x柜型……这个改成缩略图」。
   缩略图按**固定高度 + 宽度自适应**排布，跟柜型库卡片一致，
   不给固定宽度留白。 */
.mtxcell{display:flex;gap:9px;align-items:flex-start}
.mthumb{
  flex:0 0 auto;display:flex;align-items:center;justify-content:center;
  height:62px;padding:3px;background:#fff;cursor:zoom-in;
  border:1px solid var(--line);border-radius:5px;transition:border-color .12s;
}
.mthumb:hover{border-color:var(--accent)}
.mthumb.on{border-color:var(--accent);box-shadow:0 0 0 2px #2563eb33}
.mthumb img{max-height:56px;width:auto;display:block}
.mthumb.no{color:var(--dim);cursor:default;opacity:.5}
.mthumb.no .ic{width:18px;height:18px}
.mtxinfo{flex:1 1 auto;min-width:0}
/* 每层「units 数 → 柜型库里全部可选柜型」的缩略图带 */
.mtxlib{border-left:3px solid var(--accent);padding-left:9px}
.mtxlibhd{font-size:11px;color:var(--accent2);font-weight:600;margin-bottom:6px}
.mtxlib .cupgrid{grid-template-columns:repeat(auto-fill,minmax(118px,1fr));gap:7px}
.mtxlib .cupcard .thumb{padding:3px}
.mtxlib .cupcard .thumb img{width:100%;height:auto}
.mtxlib .cupcard .meta{padding:5px 7px 7px}
/* ---- 柜型库批量管理条 ---- */
.mgmt{
  display:flex;align-items:center;gap:8px;margin:0 0 8px;padding:6px 9px;
  border:1px solid var(--line);border-radius:7px;background:#fafbfc;
}
.mgmt .sp{flex:1}
.mgmt .muted{font-size:11.5px}
.btn.sm{padding:3px 9px;font-size:11.5px}
.btn.sm.danger{color:#dc2626;border-color:#f0c4c4}
.btn.sm.danger:hover{background:#fef2f2}
.tag.ok{background:var(--ok-bg);color:var(--ok);border-color:#bbf7d0}
.tag.warn{background:var(--warn-bg);color:var(--warn);border-color:#fde68a}
.cupview{
  display:flex;flex-direction:column;align-items:flex-start !important;justify-content:flex-start !important;
  min-height:100%;padding:14px 14px 14px 0 !important;background:var(--panel2);gap:12px
}
.cupview img{max-width:100%;height:auto;background:#fff;
  border:1px solid var(--line);border-radius:6px}
/* 缩放时 scrollable，1 倍时 hidden —— setZoom 里按需切换 overflow */
.zoomslot{max-width:100%;max-height:calc(100vh - 190px);overflow:hidden;
  display:flex;align-items:flex-start !important;justify-content:flex-start !important}
/* 图下方的尺寸标注（用户要求「图片 + 下面显示尺寸」）*/
.cupcap{background:#fff;border:1px solid var(--line);border-radius:8px;
  padding:9px 16px;font-size:13px;color:var(--fg);text-align:center;
  box-shadow:0 1px 3px rgba(15,23,42,.06);max-width:92%}
.cupcap b{font-weight:700;color:var(--accent)}
.cupcap .muted{font-size:11.5px}

/* ---- 柜型库 / Buildings 的文件列表页 ---- */
.filelist{padding:10px 12px}
.filelist .row-item{
  display:flex;align-items:center;gap:11px;padding:10px 12px;background:#fff;
  border:1px solid var(--line);border-radius:7px;margin-bottom:8px;box-shadow:var(--shadow);
}
.filelist .row-item .ico{
  width:30px;height:30px;border-radius:6px;background:var(--info-bg);color:var(--accent);
  display:flex;align-items:center;justify-content:center;font-size:14px;flex-shrink:0;
}
.filelist .row-item .nm{flex:1;min-width:0}
.filelist .row-item .nm .t{font-weight:600;font-size:12px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.filelist .row-item .nm .s{font-size:10.5px;color:var(--dim);margin-top:2px}

/* ---------- 主体三栏 ---------- */
main{display:flex;height:calc(100% - 52px)}
#tree{
  width:250px;flex-shrink:0;background:var(--panel);border-right:1px solid var(--line);
  overflow-y:auto;padding:10px 0;
}
#mid{flex:1;min-width:0;display:flex;flex-direction:column;background:#e8edf3;border-right:1px solid var(--line)}
#right{width:520px;flex-shrink:0;background:var(--panel);overflow-y:auto}

/* ---------- 栏宽拖拽 ----------
   用户诉求：「所有的页面的这些工作区，都可以左右拖拽」。
   实现：两条 4px 的拖拽把手，用 pointer 事件改左右栏的 width。
   为什么用 pointer 事件而不是 mouse —— 触屏也能拖，Chrome 下
   鼠标 draggable 选中文字的问题也一并没了。 */
.dragbar{flex:0 0 4px;cursor:col-resize;background:transparent;position:relative;z-index:6}
.dragbar:hover,.dragbar.on{background:var(--accent)}
.dragbar::after{content:'';position:absolute;inset:0 -3px}   /* 扩大命中区 */
body.resizing{cursor:col-resize;user-select:none}
/* 拖拽把手放在 tree 右边界、right 左边界 */
#treewrap{position:relative}
@media (max-width:900px){.dragbar{display:none}}

.sec{padding:9px 12px 4px;font-size:10px;font-weight:700;color:var(--dim);
  letter-spacing:1px;text-transform:uppercase}
/* 问题2/3：树顶部工具栏 */
.sectreetoolbar,.treetoolbar{display:flex;align-items:center;justify-content:space-between}
.ttools{display:flex;gap:4px;flex-shrink:0}
.ttools .ib{padding:6px;font-size:12px;flex:0 0 auto;min-width:30px;min-height:30px;display:inline-flex;align-items:center;justify-content:center}
/* 工具栏图标固定 16px，避免 em 换算被裁 —— 用户报多次显示不全 */
.ttools .ic{width:16px;height:16px;flex:0 0 auto}
.ttools .ib.on{background:var(--accent);color:#fff}
/* 编辑模式下拉菜单 */
.treedrop{position:absolute;right:8px;top:50%;transform:translateY(-50%);z-index:5}
.treemenu{position:absolute;right:0;top:100%;margin-top:4px;background:#fff;
  border:1px solid var(--line);border-radius:8px;box-shadow:0 4px 16px rgba(15,23,42,.15);
  min-width:120px;z-index:50;overflow:hidden}
.treemenu button{display:flex;align-items:center;gap:8px;width:100%;padding:8px 12px;
  border:0;background:none;font-size:13px;color:var(--fg);cursor:pointer;text-align:left}
.treemenu button:hover{background:var(--panel2)}
.treemenu button.danger{color:var(--err)}
.treemenu button.danger:hover{background:#fee2e2}
.node{
  display:flex;align-items:center;gap:7px;padding:5px 12px;cursor:pointer;
  border-left:3px solid transparent;transition:.1s;
  /* 行内管理按钮（.rowact）是绝对定位，锚点必须是自己 ——
     否则它会飞到最近的定位祖先（比如整个树容器）上去，
     跑到别的行甚至面板外。加 relative 后按钮稳稳落在本行右侧。
     padding-right 预留出按钮的位置，按钮显形时不会压住计数数字。 */
  position:relative;padding-right:58px;
}
.node:hover{background:var(--panel2)}
/* 问题6a：选中高亮加强 —— 更明显的背景色 + 左侧 accent 边框 + 文字加粗 */
.node.on{background:#dbeafe;border-left-color:var(--accent)}
.node.on .nm{font-weight:600;color:var(--accent2)}
.node .ico{width:14px;text-align:center;opacity:.75;font-size:11px}
/* 折叠箭头 */
.node .tw{
  width:11px;flex-shrink:0;font-size:9px;color:var(--dim);
  cursor:pointer;text-align:center;transition:.1s;
}
.node .tw:hover{color:var(--accent)}
.node .nm{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.node .ct{font-size:10px;color:var(--dim);font-variant-numeric:tabular-nums}
.node.lv1{padding-left:26px}
.node.lv2{padding-left:40px;font-size:12px;color:var(--dim)}
.lfroot-children .node{padding-left:26px}
.lfroot-children .node.lv2{padding-left:52px}
.lfroot-children .node.lv2.lv3{padding-left:66px}
/* 同套数下的具体摆法（「6 Units - A」）：再缩进一级，字色加深 —— 它们
   才是真正会被选中的叶子节点，光靠 lv2 的灰色会显得像分类标题。 */
.node.lv2.lv3{padding-left:54px;color:var(--fg)}
.node.lv2.lv3:hover{background:#f2f6fb}
/* 树节点的编辑按钮 —— 已改为顶部「编辑」按钮下拉菜单，
   这里只保留 hover 时高亮当前行，不再有逐项按钮。 */
.node:hover{background:var(--panel2)}

/* ---- 树节点行内管理按钮（重命名 / 删除）----
 * 用户诉求：「给我管理的功能按钮，可以删除，rename 这些 items」。
 *
 * 为什么放行内而不只用顶部「编辑」下拉：
 *   顶部菜单要先选中节点、再点菜单、再在下拉里挑动作，三步；
 *   行内按钮鼠标悬停即现，**点哪一行就管哪一行**，少两步也不易点错行。
 *
 * 默认 opacity:0，:hover / :focus-within 时显形 —— 不喧宾夺主，
 * 键盘 Tab 过去也能看见（focus-within 兜底）。
 * .rowact 绝对定位、不占布局宽度，所以按钮出现不会让整棵树横向抖动。
 */
.rowact{
  position:absolute;right:8px;top:50%;transform:translateY(-50%);
  display:flex;gap:2px;
  background:var(--panel);padding:2px;border-radius:6px}
  /* 【真实 bug 修复】不能靠 opacity+pointer-events 来隐藏。
   *
   * `pointer-events:none` 会让按钮**完全不可点**，而且不只触屏 ——
   * Playwright 报「父节点 div intercepts pointer events」，
   * 自动化测试直接点不到；触屏设备上因为没有 hover，按钮永远显形不了，
   * 等于彻底不能用。opacity 为 0 的元素仍然可点，于是出现
   * 「看不见但点得到」的诡异状态：用户看不见按钮，鼠标移进去
   * 偶然点中，却什么反馈都收不到。
   *
   * 正确做法：opacity 控制视觉显隐（保留过渡动画），
   * visibility 控制可交互性（不可见时真正不接收事件）。
   */
  opacity:0;visibility:hidden;
  transition:opacity .12s ease,visibility .12s;
}
.node:hover .rowact,.node:focus-within .rowact,.rowact:focus-within{
  opacity:1;visibility:visible;
}
.ib{
  width:22px;height:22px;display:grid;place-items:center;
  border:0;border-radius:5px;background:transparent;color:var(--dim);
  cursor:pointer;font-size:13px;
}
.ib:hover{background:#fff;color:var(--accent);box-shadow:0 1px 4px rgba(15,23,42,.16)}
.ib.danger:hover{background:#fee2e2;color:var(--err)}
.ib .ic{width:13px;height:13px}
/* 触屏没有 hover，永远点不到 —— 直接常显 */
@media (hover:none){.rowact{opacity:1;visibility:visible}}

/* ---- 顶部「编辑」下拉菜单 ---- */
.editmenu{
  position:fixed;z-index:60;min-width:190px;background:#fff;
  border:1px solid var(--line);border-radius:10px;padding:5px;
  box-shadow:0 10px 28px rgba(15,23,42,.16);
}
.editmenu .emitem{
  display:flex;align-items:center;gap:9px;width:100%;
  padding:8px 10px;border:0;border-radius:7px;background:transparent;
  font-size:13px;color:var(--fg);text-align:left;cursor:pointer
}
.editmenu .emitem:hover{background:#eff5fb}
.editmenu .emico{
  width:20px;height:20px;display:grid;place-items:center;flex-shrink:0;
  color:var(--dim);font-size:13px
}

/* ---------- 中栏 ---------- */
.mid-bar{
  display:flex;align-items:center;gap:8px;padding:7px 12px;
  background:var(--panel);border-bottom:1px solid var(--line);flex-shrink:0;
}
/* 工具条上的按钮不许被压扁。中栏可拖拽变窄后，按钮里的文字会被
   挤成「重新解析」四个字竖排一列（实际踩到过），所以显式禁止收缩、
   并保持单行。窄了就让 .fn 先让位——它有 text-overflow:ellipsis。 */
.mid-bar .btn,.mid-bar .badge{flex:0 0 auto;white-space:nowrap}
.mid-bar .fn{
  flex:1 1 auto;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;
  font-size:12px;color:var(--txt);
}
/* 滚动模式提示 —— 说明「整份连续显示」+ 怎么快速翻页 */
.mid-bar .hint{
  font-size:10.5px;color:var(--dim);white-space:nowrap;
  padding:2px 7px;background:var(--panel2);border-radius:4px;
}
@media (max-width:1200px){.mid-bar .hint{display:none}}
.btn{
  padding:5px 11px;border-radius:5px;background:var(--panel2);color:var(--txt);
  font-size:12px;font-weight:500;transition:.15s;white-space:nowrap;
}
.btn:hover{background:#e2e8f0}
.btn.pri{background:var(--accent);color:#fff}
.btn.pri:hover{background:var(--accent)}
.btn.ok{background:var(--ok);color:#fff}
.btn:disabled{opacity:.4;cursor:not-allowed}
.viewer{flex:1;overflow:auto;position:relative;background:#e8edf3}
/* ---- 连续滚动模式：全部页面依次排开，像看长文档 ---- */
.viewer.scrollmode{padding:10px 0 40vh;scroll-behavior:smooth}
/* 每个页面占位块：高度按 A4 比例预留，图片到位前不跳动 */
.vpage{position:relative;margin:0 auto 10px;background:#fff;box-shadow:0 1px 4px #0002}
.vpage > img{width:100%;display:block;opacity:0;transition:opacity .18s}
/* 懒加载占位：先出一个骨架，图片加载完才显示真实内容 */
.vpage .skel{
  width:100%;display:flex;align-items:center;justify-content:center;
  color:var(--dim);font-size:12px;background:#f6f8fa;
}
.vpage > img.on{opacity:1}
.vpage .skel.on{display:none}
/* 页码角标：滚到哪页一眼看到 */
.vpage .pno{
  position:absolute;right:6px;bottom:6px;z-index:2;
  background:#0f172aa8;color:#fff;font-size:10.5px;padding:1px 7px;border-radius:9px;
  pointer-events:none;font-variant-numeric:tabular-nums;
}
/* 连续滚动时页码条高亮当前可见页（.pg.on 定义在下方基础样式里） */
.viewer img{
  display:block;margin:0 auto;transition:width .15s;
  image-rendering:-webkit-optimize-contrast;
}
.viewer.loading{position:relative}
.viewer .ph{display:flex;height:100%;align-items:center;justify-content:center;color:var(--dim);flex-direction:column;gap:10px}
.page-list{
  width:120px;flex-shrink:0;background:var(--panel);border-right:1px solid var(--line);
  overflow-y:auto;padding:5px 0;
}
/* 建筑图纸 tab 强制隐藏 pagelist（"1. A000"）—— 用户多次要求 */
body.hide-pagelist #pagelist{display:none !important}
.page-list .pg{
  padding:4px 10px;font-size:11px;cursor:pointer;color:var(--dim);
  border-left:3px solid transparent;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;
}
.page-list .pg:hover{background:var(--panel2)}
.page-list .pg.on{background:#dbeafe;border-left-color:var(--accent);color:var(--accent2)}

/* ---------- 右栏 ---------- */
.rtabs{display:flex;background:var(--panel);border-bottom:1px solid var(--line);position:sticky;top:0;z-index:5}
.rtabs button{flex:1;padding:10px 4px;font-size:12px;color:var(--dim);border-bottom:2px solid transparent}
.rtabs button.on{color:var(--accent);border-bottom-color:var(--accent);background:var(--panel2)}
.rpane{padding:12px}
.kpis{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-bottom:12px}
/* 楼层概览那排只有 2~3 个，用auto-fit 让卡片按内容宽度均分，
   不然沿用 4 列会在右栏窄的时候挤成两行 */
.kpirow{display:grid;grid-template-columns:repeat(auto-fit,minmax(96px,1fr));
  gap:8px;margin-bottom:12px}
.kpi{background:#fff;border:1px solid var(--line);border-radius:7px;padding:9px 10px;
  border-left:3px solid var(--accent);box-shadow:var(--shadow)}
.kpi.g{border-left-color:var(--ok)} .kpi.p{border-left-color:var(--purple)}
.kpi.o{border-left-color:var(--warn)} .kpi.r{border-left-color:var(--err)}
.kpi .v{font-size:19px;font-weight:700;font-variant-numeric:tabular-nums;line-height:1.2}
.kpi .l{font-size:10px;color:var(--dim);margin-top:1px}

table{width:100%;border-collapse:collapse;font-size:11.5px}
th{
  background:var(--panel2);padding:6px 5px;text-align:left;font-weight:600;
  font-size:10.5px;color:var(--dim);position:sticky;top:0;white-space:nowrap;
  border-bottom:1px solid var(--line);
}
td{padding:6px 5px;border-bottom:1px solid var(--line);vertical-align:top}
tr:hover td{background:var(--panel2)}
tr.floor-row td{background:#eef2f7;font-weight:700;border-top:2px solid var(--line)}
.num{text-align:right;font-variant-numeric:tabular-nums}
.mono{font-family:ui-monospace,Menlo,Consolas,monospace;font-size:11px}
.tag{
  display:inline-block;padding:1px 6px;border-radius:4px;font-size:10px;
  font-weight:600;white-space:nowrap;
  /* 无语义修饰的通用 tag（图层清单等）也要有底色，
     否则浅色主题下是无色透明文字，等于隐形 */
  background:var(--panel2);color:var(--dim);border:1px solid var(--line);
}
.tag.high{background:#dcfce7;color:#15803d}
.tag.medium{background:#fef3c7;color:#b45309}
.tag.low{background:#fee2e2;color:#b91c1c}
.tag.acc{background:#ede9fe;color:#6d28d9}
.tag.com{background:#dbeafe;color:#1d4ed8}
.tag.err{background:#fee2e2;color:#b91c1c}
.tag.warn{background:#fef3c7;color:#b45309}
.muted{color:var(--dim)}
.err-t{color:var(--err)} .ok-t{color:var(--ok)} .warn-t{color:var(--warn)}

.alert{
  padding:8px 11px;border-radius:6px;font-size:11.5px;margin-bottom:11px;
  border-left:3px solid;
}
.alert.ok{background:var(--ok-bg);border-color:var(--ok);color:#15803d}
.alert.warn{background:var(--warn-bg);border-color:var(--warn);color:#b45309}
.alert.err{background:var(--err-bg);border-color:var(--err);color:#b91c1c}
.alert.info{background:var(--info-bg);border-color:var(--accent);color:var(--accent2)}

.empty{padding:36px 20px;text-align:center;color:var(--dim);font-size:12px}
.empty .big{font-size:30px;margin-bottom:8px;opacity:.4}

.bar{height:16px;background:var(--panel2);border-radius:3px;overflow:hidden;display:flex}
.bar i{display:block;height:100%}
.legend{display:flex;gap:12px;flex-wrap:wrap;font-size:11px;margin:8px 0}
.legend span{display:flex;align-items:center;gap:5px}
.legend b{width:11px;height:11px;border-radius:2px;display:inline-block}

/* ---------- 抽屉/弹窗 ---------- */
.mask{
  position:fixed;inset:0;background:#0f172a59;display:none;
  align-items:center;justify-content:center;z-index:100;padding:20px;
}
.mask.on{display:flex}
.modal{
  background:var(--panel);border-radius:10px;width:100%;max-width:820px;
  max-height:88vh;display:flex;flex-direction:column;
  border:1px solid var(--line);box-shadow:var(--shadow-lg);
}
.modal h2{
  padding:13px 16px;font-size:14px;border-bottom:1px solid var(--line);
  display:flex;align-items:center;justify-content:space-between;
}
.mbody{padding:16px;overflow-y:auto;flex:1}
/* 上传确认弹窗：外层不滚，滚动条只出现在下方的图库区域。
   用户诉求：「弹窗右侧的滚动条不要整个页面，只需要在下面的图库这里显示」。
   之前 .mbody 整体 overflow-y:auto，23 张柜型图把弹窗撑得很长，
   标题栏和「确认入库」按钮都被顶出可视区。 */
.modal.split{max-width:980px}
/* 必须给一个确定的高度，否则 .mbody 会被 23 张图撑到 2121px，
   .gallery 拿不到受限高度 → 自身不滚动，底部卡片被 overflow:hidden 裁掉。 */
.modal.split{height:92vh}
/* 视口很矮时图库会被压到几十像素。这里给一个下限，
   溢出则由 .mbody 自己兜底滚动（总比图库看不见强）。 */
.modal.split .mbody{overflow-y:auto;display:flex;flex-direction:column;min-height:0}
/* #rendbox 是 .mbody 的最后一个 flex 子项：分掉剩余空间并允许收缩，
   内部的 .gallery 才有条件变成真正的滚动容器。 */
.modal.split #rendbox{flex:1 1 auto;min-height:0;display:flex;flex-direction:column}
.modal.split #prog{flex:0 0 auto}
/* 一旦进入「解析/渲染」阶段，上方的拖拽区、已选文件摘要、PDF 预览
   就变成无用信息了。实测它们合计占掉 407px 里的全部高度，
   把 .gallery 挤成 12px（图库等于看不见）。渲染一开始就把它们收起。 */
.modal.split .mbody.busy #dz,
.modal.split .mbody.busy #upbox,
.modal.split .mbody.busy #preview{display:none}
/* 图库独立滚动区*/
.gallery{
  overflow-y:auto;overflow-x:hidden;min-height:200px;flex:1 1 auto;
  border:1px solid var(--line);border-radius:8px;background:var(--panel2);
  padding:10px 0 2px;
}
.gallery .cupgrid{padding-left:10px;padding-right:10px}
.mfoot{padding:11px 16px;border-top:1px solid var(--line);display:flex;gap:8px;justify-content:flex-end}
.x{font-size:18px;color:var(--dim);line-height:1}
.x:hover{color:var(--txt)}

.drop{
  border:2px dashed var(--line);border-radius:9px;padding:26px;text-align:center;
  cursor:pointer;transition:.15s;margin-bottom:14px;
}
.drop:hover,.drop.hot{border-color:var(--accent);background:var(--info-bg)}
.drop .big{font-size:28px;margin-bottom:6px;opacity:.5}
.flist{display:flex;flex-direction:column;gap:5px;font-size:11.5px}
.flist .f{
  display:flex;align-items:center;gap:9px;padding:6px 10px;
  background:var(--panel2);border:1px solid var(--line);border-radius:5px;
}
.flist .f .n{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}

.fld{margin-bottom:12px}
.fld label{display:block;font-size:11px;color:var(--dim);margin-bottom:4px}
.fld input,.fld select,.fld textarea{
  width:100%;padding:7px 9px;background:#fff;border:1px solid var(--line);
  border-radius:5px;color:var(--txt);font:inherit;
}
.fld input:focus,.fld select:focus,.fld textarea:focus{
  outline:2px solid #bfdbfe;outline-offset:0;border-color:var(--accent);
}
.fld textarea{resize:vertical;min-height:70px}
.row{display:flex;gap:10px}
.row>*{flex:1}

.spin{
  display:inline-block;width:13px;height:13px;border:2px solid #fff6;
  border-top-color:#fff;border-radius:50%;animation:sp .7s linear infinite;
}
/* 【真实 bug 修复】渲染中的图标必须自己转起来。
 * 用户原话：「柜型图渲染中，这个按钮是卡死的状态，没有动态旋转」。
 * 根因：rendering 态用的是 ic('refresh') —— 一个**静态 SVG**，
 * 从来没有动画；而 .spin 只在 parsing 态用。所以按钮看着就是死的。
 * 这里给图标套一个旋转动画，与 .spin 同一套关键帧。 */
.spinref{display:inline-block;animation:sp .9s linear infinite;
  transform-origin:50% 50%}
.spinref .ic{vertical-align:-.125em}
@keyframes sp{to{transform:rotate(360deg)}}
/* 尊重系统「减少动态效果」设置：此时不再转，但保留一个静态的
 * 进度条在动（见 .prog），避免用户完全失去「还在跑」的反馈。 */
@media (prefers-reduced-motion:reduce){
  .spin,.spinref{animation:none}
  .spin{border-top-color:#fff}
}
.toast{
  position:fixed;bottom:18px;right:18px;background:var(--panel);
  border:1px solid var(--line);border-left:3px solid var(--accent);
  padding:10px 15px;border-radius:7px;font-size:12px;z-index:200;
  box-shadow:var(--shadow-lg);max-width:380px;
}
.toast.ok{border-left-color:var(--ok)}
.toast.err{border-left-color:var(--err)}

/* ============ 开源图标（Lucide, ISC License, © Lucide Contributors）===
 *用户要求「里面涉及到的所有 icon 都需要从网上找开源免费的使用」。
 * 之前用的是 ✎🗑 ▦ ▤ ≡ ▾ ▸ 这些 Unicode 字符，不同平台字形不一样
 *   （🗑 在Windows 上是彩色 emoji，在 Linux 上是黑白），而且不可控。
 * 现在统一换成 Lucide 的线性 SVG：路径直接内联，不引外部 CDN
 *   —— 这个应用要能离线跑（现场解析 DWG），CDN 挂了就全崩。
 * 用法：<svg class="ic"><use href="#i-pencil"></use></svg>
 */
.ic{width:1em;height:1em;fill:currentColor;flex:0 0 auto;
  vertical-align:-.15em}
.ic.lg{width:1.25em;height:1.25em}
/* 工具栏按钮图标：统一 16px，清晰可见 —— 用户要求 */
.btn .ic, .ib .ic{width:16px;height:16px}
/* 树节点的图标槽：原来是字符，宽度靠字号撑着，换成 SVG 后要固定宽度，
   否则chevron 展开时整棵树会横向抖动 */
.tw .ic,.ico .ic{width:13px;height:13px}
.ph .big .ic{width:34px;height:34px}
.btn .ic{width:14px;height:14px}
.emico .ic{width:14px;height:14px}
.cupdel .ic{width:12px;height:12px}
</style>

<header>
  <div class="logo">AU<span>·</span>Cupboards</div>
  <nav>
    <button class="on" data-view="work" data-i18n="nav.work">工作台</button>
    <button data-view="cupboard" data-i18n="nav.cupboard">柜型库</button>
    <button data-view="building" data-i18n="nav.building">建筑图纸</button>
  </nav>
  <!-- 工作台不放上传入口，默认隐藏，由 gotoView 按 tab 控制 -->
  <button class="hupload" id="bup" style="display:none"><svg class="ic" aria-hidden="true"><use href="#i-upload"></use></svg><span data-i18n="btn.upload">上传图纸</span></button>
  <div class="langsw">
    <button id="lzh" class="on">中文</button>
    <button id="len">EN</button>
  </div>
  <div class="hstat" id="hstat">连接中…</div>
</header>

<main>
  <!-- ============ 左：树导航 ============ -->
  <div id="tree"></div>
  <div class="dragbar" id="dragL" title="拖拽调整左栏宽度"></div>

  <!-- ============ 中：文档原样预览 ============ -->
  <div id="mid">
    <div style="display:flex;flex:1;min-height:0">
      <div class="page-list" id="pagelist"></div>
      <div class="viewer" id="viewer">
        <!-- 静态 HTML 里的 ${...} 不会被求值，必须给真实文本，
             boot() 会用 data-i18n 覆盖 -->
        <div class="ph"><div class="big"><svg class="ic" aria-hidden="true"><use href="#i-file-text"></use></svg></div><div data-i18n="mid.ph">上传建筑图纸后在此原样预览</div></div>
      </div>
    </div>
    <div class="mid-bar">
      <span class="fn" id="mfn"></span>
      <button class="btn" id="bedit" title="编辑" style="display:none"><svg class="ic" aria-hidden="true"><use href="#i-pencil"></use></svg></button>
      <button class="btn" id="bprev" data-i18n-title="ui.prevpage"><svg class="ic" aria-hidden="true"><use href="#i-chevron-left"></use></svg></button>
      <span class="badge" id="bpage">– / –</span>
      <button class="btn" id="bnext" data-i18n-title="ui.nextpage"><svg class="ic" aria-hidden="true"><use href="#i-chevron-right"></use></svg></button>
      <span style="width:6px"></span>
      <button class="btn" id="bzout" title="zoom out"><svg class="ic" aria-hidden="true"><use href="#i-zoom-out"></use></svg></button>
      <span class="badge" id="bzoom">100%</span>
      <button class="btn" id="bzin" title="zoom in"><svg class="ic" aria-hidden="true"><use href="#i-zoom-in"></use></svg></button>
    </div>
  </div>

  <div class="dragbar" id="dragR" title="拖拽调整右栏宽度"></div>

  <!-- ============ 右：工作区 ============ -->
  <div id="right">
    <div class="rtabs">
      <button class="on" data-pane="matrix" data-i18n="tab.matrix">楼层 × 柜型</button>
      <button data-pane="detail" data-i18n="tab.detail">单元明细</button>
      <button data-pane="prov" data-i18n="tab.prov">溯源诊断</button>
    </div>
    <div id="rpane"></div>
  </div>
</main>

<div class="mask" id="mask"><div class="modal" id="modal"></div></div>

async function api(path, opt = {}) {
  // 【真实 bug 修复】body 传裸对象时自动 JSON.stringify。
  //
  // 实测事故（本轮挖出）：全站7 处 PATCH/POST 都写成
  //     api(url, { method:'PATCH', body: { name } })
  // 而 fetch 的 body 只接受字符串 / Blob / FormData / URLSearchParams，
  // 传普通对象会被隐式 toString() 变成 **"[object Object]"** ——
  // 后端 FastAPI 收到后直接 422
  //     "Input should be a valid dictionary or object to extract fields from"
  // 于是「柜型重命名」「删除柜型」「清空柜型库」这7 个按钮
  // 看起来都点了、请求也发出去了，实际全都不生效。
  //用户看到的现象是「按钮点了没有任何反应」，极难定位 ——
  // 因为网络面板里确实有一条 200/422，请求根本没缺。
  //
  // 这里在 api() 统一兜底：对象/数组自动序列化并补 Content-Type。
  // 这样既修了已存在的 7 处，也保证以后新写的调用不会再踩。
  const o = { ...opt };
  if (o.body !== undefined && o.body !== null && typeof o.body === 'object'
      && !(o.body instanceof FormData) && !(o.body instanceof Blob)
      && !(o.body instanceof URLSearchParams) && !(o.body instanceof ArrayBuffer)) {
    o.body = JSON.stringify(o.body);
    if (!Object.keys(o.headers || {}).some(h => h.toLowerCase() === 'content-type')) {
      o.headers = { ...(o.headers || {}), 'Content-Type': 'application/json' };
    }
  }
  const r = await fetch('/api' + path, o);
  if (!r.ok) {
    let d = ''; try { d = (await r.json()).detail || ''; } catch (e) {}
    // 500 且后端已带可读原因 → 直接把原因摊开给用户，
    // 不再显示干巴巴的「入库失败 500」让人猜。
    throw new Error(`${r.status} ${d || r.statusText}`);
  }
  return r.json();
}

function buildExportData() {
  const j = S.job;
  const rows = [];
  for (const f of (j.floors || [])) {
    const units = (j.units || []).filter(u => u.floor === f.floor_code);
    const n = units.length;
    // 找匹配的柜型
    const matched = S.variants.filter(v => v.source === 'dwg' && Number(v.positions || 0) === n);
    rows.push({
      floor: f.floor_code,
      units: n,
      cupboards: matched.map(v => `${v.code || ''} (${fmtMM(v.w)}×${fmtMM(v.h)}mm)`).join('; ') || '-',
      // 柜型图 URL 列表 —— 用于 PDF 导出嵌入图片（用户要求：导出内容与页面显示一致）
      images: matched.filter(v => v.image_url).map(v => ({
        code: v.code || '',
        url: v.image_url,
        w: v.w, h: v.h,
      })),
    });
  }
  return rows;
}

/** 统一保存：优先写入用户选定的文件句柄，否则触发浏览器下载 */
async function saveExportBlob(blob, filename, fileHandle) {
  const zh = LANGNOW === 'zh';
  if (fileHandle) {
    try {
      const w = await fileHandle.createWritable();
      await w.write(blob);
      await w.close();
      toast(zh ? `已保存到 ${fileHandle.name}` : `Saved to ${fileHandle.name}`, 'ok');
      return;
    } catch (e) {
      if (e.name === 'AbortError') return;
      toast((zh ? '写入失败，改用下载：' : 'Write failed, falling back to download: ') + e.message, 'err');
    }
  }
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = filename;
  a.click();
  URL.revokeObjectURL(a.href);
  toast(zh ? `已导出 ${filename}` : `Exported ${filename}`, 'ok');
}

function doExport(fmt, fileHandle, customName) {
  const rows = buildExportData();
  // 用户自定义文件名优先，否则用项目名 —— 用户要求
  const jname = (customName || S.job?.name || 'export').replace(/[^\w\-\u4e00-\u9fa5]+/g, '_');
  const zh = LANGNOW === 'zh';
  const title = zh ? '楼层×柜型方案' : 'Floor × Cupboard';

  // PDF / DOCX / XLSX / JPG：走后端直接生成
  if (['pdf', 'docx', 'xlsx', 'jpg'].includes(fmt)) {
    doExportViaBackend(fmt, jname, fileHandle);
    return;
  }

  let content, mime, ext;
  if (fmt === 'md') {
    content = `# ${title}\n\n`;
    content += `| ${zh?'楼层':'Floor'} | ${zh?'户数':'Units'} | ${zh?'匹配柜型':'Cupboards'} |\n|---|---|---|\n`;
    for (const r of rows) content += `| ${r.floor} | ${r.units} | ${r.cupboards} |\n`;
    mime = 'text/markdown'; ext = 'md';
  } else if (fmt === 'csv') {
    content = (zh?'楼层,户数,匹配柜型\n':'Floor,Units,Cupboards\n');
    for (const r of rows) content += `"${r.floor}",${r.units},"${r.cupboards}"\n`;
    mime = 'text/csv'; ext = 'csv';
  } else {
    content = `<html><head><meta charset="utf-8"><title>${jname}</title>
      <style>table{border-collapse:collapse;width:100%}th,td{border:1px solid #ccc;padding:8px}th{background:#f5f5f5}</style>
      </head><body><h1>${title}</h1>
      <table><tr><th>${zh?'楼层':'Floor'}</th><th>${zh?'户数':'Units'}</th><th>${zh?'匹配柜型':'Cupboards'}</th></tr>`;
    for (const r of rows) content += `<tr><td>${r.floor}</td><td>${r.units}</td><td>${r.cupboards}</td></tr>`;
    content += `</table></body></html>`;
    mime = 'text/html'; ext = 'html';
  }
  const blob = new Blob([content], { type: mime + ';charset=utf-8' });
  saveExportBlob(blob, `${jname}.${ext}`, fileHandle);
}

/** PDF：前端直接用 html2pdf 生成，不弹打印窗口 —— 用户要求 */
async function doExportPdfFrontend(jname, fileHandle) {
  const zh = LANGNOW === 'zh';
  const rpane = document.querySelector('#rpane');
  if (!rpane) {
    toast(zh ? '没有可导出的内容' : 'Nothing to export', 'err');
    return;
  }
  toast(zh ? '正在生成 PDF…' : 'Generating PDF…', 'info');
  try {
    // 动态加载 html2pdf.js（html2canvas + jsPDF）
    if (!window.html2pdf) {
      await new Promise((resolve, reject) => {
        const s = document.createElement('script');
        s.src = 'https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js';
        s.onload = resolve;
        s.onerror = reject;
        document.head.appendChild(s);
      });
    }
    const opt = {
      margin: 10,
      filename: `${jname}.pdf`,
      image: { type: 'jpeg', quality: 0.95 },
      html2canvas: { scale: 2, useCORS: true },
      jsPDF: { unit: 'mm', format: 'a4', orientation: 'portrait' },
      // 避免卡片被分页截断 —— 用户要求
      pagebreak: { mode: ['avoid-all', 'css', 'legacy'] },
    };
    const pdfBlob = await window.html2pdf().set(opt).from(rpane).outputPdf('blob');
    saveExportBlob(pdfBlob, `${jname}.pdf`, fileHandle);
  } catch (e) {
    toast((zh ? 'PDF 生成失败：' : 'PDF failed: ') + e.message, 'err');
  }
}

/** DOCX/XLSX/JPG 走后端生成并保存；PDF 走前端浏览器打印 */
async function doExportViaBackend(fmt, jname, fileHandle) {
  const zh = LANGNOW === 'zh';
  // PDF 走前端，不经过后端
  if (fmt === 'pdf') {
    await doExportPdfFrontend(jname, fileHandle);
    return;
  }
  try {
    const body = { rows: buildExportData(), name: jname };
    const res = await fetch(`/api/jobs/${S.jobId}/export/${fmt}`, {
      method: 'POST',
      headers: {'Content-Type': 'application/json'},
      body: JSON.stringify(body),
    });
    if (!res.ok) throw new Error('HTTP ' + res.status);
    const blob = await res.blob();
    saveExportBlob(blob, `${jname}.${fmt}`, fileHandle);
  } catch (e) {
    toast((zh ? '后端导出失败，已降级为 HTML：' : 'Backend export failed, fell back to HTML: ') + e.message, 'err');
    doExport('html', fileHandle, jname);
  }
}

/** 进入 tab 时自动选中树里第一个 item。
 *  用户诉求：「进入这个 tab 后，默认会显示树状结构第一个的 item，
 *  选中，然后中间位置显示完整的内容」。 */
function autoSelectFirstInView() {
  // 建筑图纸 tab：刷新恢复来的楼层选中要直接兑现（否则右栏停在项目列表）
  if (S.view === 'building' && S.treeSel === 'floors' && S.floorSel) {
    const f = (S.job?.floors || []).find(x => x.floor_code === S.floorSel);
    if (f) {
      // 同步 floorFilter，保证左树高亮与右栏一致 —— 用户报的 bug：
      // 左树显示"所有楼层"高亮，右栏却显示 L4
      S.floorFilter = S.floorSel;
      renderTree();
      showFloorPanel(S.floorSel);
      return;
    }
    S.floorSel = null;
  }
  if (S.treeSel) {
    // 刷新恢复来的选中：gotoView 已经把右栏重画成占位内容了（renderHub），
    // 这里必须按treeSel 把真实内容重新灌上，否则「树里选中 3 Units、
    // 右栏却是柜型库总览」这种错位会出现。
    restoreSelection();
    return;
  }
  // 建筑图纸 tab：第一个 item 是楼栋，直接点它只会展开、不会加载内容。
  // 用户要的是「默认选中第一个 item，中间显示完整 PDF，右边显示楼层
  // 信息」—— 所以这里自动往下钻到楼层列表。
  // 用户要求：默认进入是"所有楼层"，不自动选第一个楼层 —— 2026-10-11
  if (S.view === 'building') {
    const p = S.projects[0];
    if (!p) { renderHub(); return; }
    const d = (p.drawings || [])[0];
    if (!d) { renderHub(); return; }
    S.curBuilding = p.id;
    S.openDrawing = d.id;
    S.treeSel = 'floors';
    S.floorSel = null;
    S.floorFilter = null;
    renderTree();
    showAllFloorsPanel();
    if (S.jobId) showPdf(S.jobId, S.pages || []);
    return;
  }
  // 工作台默认：选中"所有楼层"，显示完整矩阵 —— 用户要求
  // 之前是点击第一个 node（项目），导致右栏只显示图纸
  if (S.view === 'work') {
    S.floorFilter = null;
    S.floorSel = null;
    S.treeSel = 'floors';
    renderTree();
    if (S.pane === 'matrix') renderMatrix();
    else renderDetail();
    return;
  }
  const first = $('#tree .node');
  if (first) { first.click(); return; }
  // 树是空的（柜型库没数据 / 没解析过）—— 中右两栏也别留上一 tab 的残影
  if (S.view !== 'work') renderHub();
}

/** 按当前的 S.treeSel 把中栏/右栏内容重新灌一遍。
 *
 *  只在「刷新恢复」这条路径上用：localStorage 里存着上次的选中项，
 *  但那些内容在页面重载后并不存在于 DOM 里，必须重放一次渲染。
 *  分派规则与 bindTree 的点击分支保持一致。
 */
function restoreSelection() {
  const sel = String(S.treeSel || '');
  if (!sel) return;
  if (sel === 'floors') {
    if (S.view === 'building' && S.floorSel) { showFloorPanel(S.floorSel); return; }
    // 工作台：走 filterFloor，保证与点击"所有楼层"完全一致的渲染路径 —— 用户报的初始化显示不对 bug
    if (S.view === 'work') { filterFloor(S.floorFilter || ''); return; }
    renderPane();
    return;
  }
  if (S.view === 'cupboard') {
    if (sel.includes('@') || sel.includes('#')) showUnitsGroup(sel);
    else if (/^u\d+$/.test(sel)) showUnitsGroup(unitsGroupKey(Number(sel.slice(1))));
    return;
  }
  // 工作台 / 建筑图纸的其它形态：交给既有的楼层筛选
  filterFloor(S.floorFilter);
}

/** 柜型库 tab 的树：只列柜型分组 */
/** 柜型库左树：**DWG 文件名（可改名） → N Units**
 *
 *  用户口径（明确要求）：
 *    · 根节点 = DWG 文件名，可以改
 *    · 子节点 = 「5 Units」「6 Units」…
 *    · 点子节点 → 右侧平铺该套数下的**全部**摆法（不去重）
 *
 *  为什么不去重
 *  ------------
 *  真实样本实测：同一张图里 13 Units 的 2115×2350 那个柜出现了 3 次
 *  （楼上有三个楼层各画一遍）。用户明确要求「不去重，每次出现都算
 *  一种」—— 因为「这张图上一共画了几个柜」本身就是有用信息。
 *  所以分组只看 units 数，不看尺寸；同组内尺寸不同自然就分开了。
 *
 *  差异判定也按用户要求：**严格区分尺寸**，1315×2250 与 1315×2300
 *  是两种摆法（差 50mm）。
 */
function libraryGroups() {
  // 先按来源图纸分组（一个库里可能有多份 DWG 都导过柜型）
  //
  // **只收DWG 实测柜型**（source === 'dwg'）
  // ------------------------------------------
  // 库里还有 11 条 `seed_poc` 演示数据（CP-TRI-1x3 之类），它们是
  // Stage2 表位推导的基线，尺寸全是 estimated、也没有渲染图。
  // 它们一混进来，树上就会冒出「1 套」「2 套」这些用户口径里
  // 根本不存在的套数（真实 DWG 只有 3~14 Units），同一个 3 Units
  // 也会显示成 5 种柜型。柜型库是给用户选型用的，只该看真实图纸。
  const byFile = new Map();
  for (const v of S.variants) {
    if (v.source !== 'dwg') continue;
    const fname = v.source_name || v.dwg_name || t('tree.library');
    if (!byFile.has(fname)) byFile.set(fname, []);
    byFile.get(fname).push(v);
  }
  const files = [];
  for (const [fname, items] of byFile) {
    const byUnits = new Map();
    for (const v of items) {
      const n = Number(v.positions || 0);
      if (!byUnits.has(n)) byUnits.set(n, []);
      byUnits.get(n).push(v);
    }
    // 套数从少到多排：5 Units 在 6 Units 前面，符合直觉
    const units = [...byUnits.entries()]
      .map(([n, list]) => {
        // 同套数下的多个柜用 A / B / C 区分（用户口径）。
        //
        // 排序依据必须是**柜体尺寸**而不是入库顺序：真实样本里
        // 同一套数下三个柜的入库顺序受DXF 实体顺序影响，
        // 每次解析可能不同，按顺序编号会让 A/B 换来换去。
        // 尺寸（宽×高）稳定，且正是用户区分"不同摆法"的依据。
        const sorted = [...list].sort((a, b) =>
          (Number(a.w) - Number(b.w)) || (Number(a.h) - Number(b.h))
          || String(a.code).localeCompare(String(b.code)));
        return {
          n,
          list: sorted,
          key: `${fname}#${n}`,
          labels: sorted.map((v, i) => ({
            // 只有 1 个柜时不需要后缀，多了反而啰嗦
            suffix: sorted.length > 1
              ? '-' + String.fromCharCode(65 + i)
              : '',
            v,
          })),
        };
      })
      .sort((a, b) => a.n - b.n);
    files.push({
      name: fname,
      fileKey: fname,
      count: items.length,
      units,
      // 该文件总共多少套
      unitsTotal: items.reduce((a, v) => a + Number(v.positions || 0), 0),
    });
  }
  files.sort((a, b) => a.name.localeCompare(b.name));
  return files;
}

function renderTreeLibrary() {
  // 柜型库树：**根节点 = units 数量**，子节点 = Model A/B/C。
  //
  //  用户口径（明确要求）：
  //    3 Units
  //      Model A
  //      Model B
  //    4 Units
  //      Model A
  //    5 Units
  //      Model A
  //      Model B
  //  点父节点（3 Units）→ 右侧显示该套数下**全部** model；
  //  点子节点（Model A）→ 只看那一个。
  //
  //  为什么不再以 DWG 文件名为根
  //  --------------------------
  //  这个库里实际只有一份 DWG，文件名当根等于多加一层无意义的壳；
  //  用户真正要按units 找柜型。而且多个 DWG 时units 会重名，
  //  按文件分组反而看不清。先按 DWG 归组、再把 units 提到最外层，
  //  既满足口径又保留了多图纸时的归属信息。
  const files = libraryGroups();
  S.lfOpen = S.lfOpen || {};
  S.mdOpen = S.mdOpen || {};

  // 先把各 DWG 的 units 组摊平成「units -> 各 DWG 的 model」
  const byUnits = new Map();
  for (const f of files) {
    for (const u of f.units) {
      if (!byUnits.has(u.n)) byUnits.set(u.n, { n: u.n, files: [] });
      byUnits.get(u.n).files.push({ f, u });
    }
  }
  const unitsList = [...byUnits.values()].sort((a, b) => a.n - b.n);

  let h = `<div class="sec treetoolbar"><span>${t('tree.library')}</span>
    <span class="ttools">
      <button class="ib" id="tExpandAll" title="${LANGNOW==='zh'?'全部展开':'Expand all'}">${ic('expand-all')}</button>
      <button class="ib" id="tCollapseAll" title="${LANGNOW==='zh'?'全部收起':'Collapse all'}">${ic('collapse-all')}</button>
      <button class="ib" id="tEditMode" title="${LANGNOW==='zh'?'编辑':'Edit'}">${ic('gear')}</button>
    </span></div>`;
  if (!unitsList.length) {
    h += `<div class="node lv1" style="color:var(--dim)">${t('dwg.empty')}</div>`;
    $('#tree').innerHTML = h;
    return;
  }

  // 根节点：文件名（用户要求）
  let rootName = files.length === 1 ? files[0].fname : t('tree.library');
  if (!rootName || !rootName.trim()) rootName = 'DWG';
  const rootOpen = S.lfOpen['root'] !== false; // 默认展开
  h += `<div class="node lv1" data-lfroot="1">
    <span class="nm" style="font-weight:600">${esc(rootName)}</span>
    ${S.treeEditMode ? `<span class="treedrop"><button class="ib" data-emenu="dwg:${esc(rootName)}" title="${LANGNOW==='zh'?'操作':'Actions'}">${ic('more')}</button></span>` : ''}</div>`;
  if (rootOpen) {
    h += `<div class="lfroot-children">`;

  for (const grp of unitsList) {
    const ukey = 'u' + grp.n;
    // 父子都要显示的计数：这个套数下一共有几个柜
    const total = grp.files.reduce((a, x) => a + x.u.labels.length, 0);
    // 只有一套的组默认展开，显示 Model A，保持一致不空白 —— 用户要求
    // 注意：展开≠选中，高亮只看 usel
    const uopen = !!S.lfOpen[ukey];
    const usel = S.treeSel === ukey;
    h += `<div class="node${usel ? ' on' : ''}" data-lu="${grp.n}" style="padding-left:36px">
      <span class="nm">${grp.n} ${t('lib.units')}</span>
      <span class="ct">${total}</span>
      ${S.treeEditMode ? `<span class="treedrop"><button class="ib" data-emenu="lu:${grp.n}" title="${LANGNOW==='zh'?'操作':'Actions'}">${ic('more')}</button></span>` : ''}</div>`;
    // 默认收起，与其他组一致 —— 用户要求
    if (!uopen) continue;

    // 该套数下的每个 model
    for (const { f, u } of grp.files) {
      for (const lb of u.labels) {
        const key = u.key + '@' + lb.v.id;
        const on = S.treeSel === key ? ' on' : '';
        // 单模型组强制显示 Model A（用户要求：不能空白）
        let disp = vLabel(lb.v, lb.suffix.replace(/^-\s*/, 'Model '));
        if (!disp) disp = 'Model A';
        h += `<div class="node lv2${on}" data-lg="${esc(key)}" data-vid="${esc(lb.v.id)}" style="padding-left:62px">
          <span class="nm">${esc(disp)}</span>
          <span class="ct">${fmtMM(lb.v.w)}×${fmtMM(lb.v.h)}</span>
          ${S.treeEditMode ? `<span class="treedrop"><button class="ib" data-emenu="vid:${esc(lb.v.id)}:${esc(disp)}" title="${LANGNOW==='zh'?'操作':'Actions'}">${ic('more')}</button></span>` : ''}</div>`;
      }
    }
  }
  } // end if (rootOpen)
  $('#tree').innerHTML = h;
  bindTree();
}

/** 某个 units 数对应的 group key（showUnitsGroup 要用）。
 *  这个库里通常只有一份 DWG，取第一个匹配的文件名即可；
 *  多份图纸时 units 会重名，这里返回第一个，右侧会把所有同名 units
 *  的柜型都列出来（用户按套数找柜，本来就不关心来自哪份图）。 */
function unitsGroupKey(nUnits) {
  for (const f of libraryGroups()) {
    const u = f.units.find(x => x.n === nUnits);
    if (u) return u.key;
  }
  return '';
}

/** 柜型的用户自定义名（后端 ``meter_counts.label``），没有则回退默认标签 */
function vLabel(v, dflt) {
  return (v && v.label) || dflt;
}

/** 尺寸显示：DWG 实测值是浮点，直接印出来是
 *  ``864.9999999999998`` 这种噪声（用户截图里看到的就是它）。
 *  取整到 1mm —— 实测尺寸本身精度远不到 1mm。
 */
function fmtMM(x) {
  // 后端偶尔把「无值」序列化成字符串 "null"（不是 null 本身），
  // 直接 Number("null") 得到 NaN 会漏到界面上变成 "nullD"。
  // 这里统一当空值处理。
  if (x === null || x === undefined || x === '' || x === 'null'
      || x === 'None' || x === 'undefined') return '—';
  const n = Math.round(Number(x));
  return Number.isFinite(n) ? String(n) : '—';
}

/** 柜体尺寸文案：**只显示实际量到的尺寸**。
 *
 *  用户诉求「留白太多了，只需要显示实际的尺寸」。深度 `d` 是可选字段，
 * 解析器量不到时是 null，之前直接 `fmtMM(v.d)` 会把兜底的 '—' 印出来，
 * 界面上就成了「865 × 2350 × — mm」—— 那个「× —」既不是尺寸也不是
 * 留白，纯属脏输出。这里只在真有深度时才追加。
 */
function sizeMM(v) {
  const w = fmtMM(v && v.w), h = fmtMM(v && v.h);
  const d = (v && v.d !== null && v.d !== undefined && v.d !== ''
            && v.d !== 'null' && v.d !== 'None') ? fmtMM(v.d) : null;
  return d ? `${w} × ${h} × ${d} mm` : `${w} × ${h} mm`;
}

/** 当前选中项是否挂在某个文件节点下 —— 用来给展开的根节点加高亮 */
function isSelUnder(fileKey) {
  return S.treeSel === 'f:' + fileKey
      || String(S.treeSel || '').startsWith(fileKey + '#');
}

/** 树节点的编辑入口：**重命名 + 删除**（文件级与变体级各一套）。
 *
 *  重命名只改显示名，不动原文件 —— 柜型图已渲成 JPG 存库，
 *  原 DWG 改名反而对不上。
 *  文件级名字存 sessionStorage；变体级改名走后端 PATCH，
 *  因为变体要能持久化，不能只活在当前会话里。
 */
function bindTreeRename() {
  // ---- 文件级重命名 ----
  $$('#tree [data-rename]').forEach(b => {
    b.onclick = ev => {
      ev.stopPropagation();
      const key = b.dataset.rename;
      const cur = dispName(key);
      const name = prompt(
        LANGNOW === 'zh' ? '修改显示名称：' : 'Rename display name:', cur);
      if (name === null) return;
      const clean = String(name).trim();
      S.renames = S.renames || {};
      if (!clean || clean === cur) delete S.renames[key];
      else S.renames[key] = clean;
      try {
        sessionStorage.setItem('cupRename', JSON.stringify(S.renames));
      } catch (e) { /* 隐私模式下写不了，忽略 */ }
      renderTree();
      if (isSelUnder(key)) showUnitsGroup(S.treeSel, true);
    };
  });

  // ---- 文件级删除：该图纸下所有柜型变体 ----
  $$('#tree [data-del-file]').forEach(b => {
    b.onclick = ev => {
      ev.stopPropagation();
      const key = b.dataset.delFile;
      const f = libraryGroups().find(x => x.fileKey === key);
      const n = f ? f.count : 0;
      if (!confirm((LANGNOW === 'zh' ? '删除该图纸下的全部柜型？'
                    : 'Delete all cabinets from this drawing?')
                  + `\n${dispName(key)}\n${n} variants`)) return;
      delVariantsBySource(key);
    };
  });

  // ---- 变体级重命名（持久化到后端）----
  $$('#tree [data-rename-vid]').forEach(b => {
    b.onclick = ev => {
      ev.stopPropagation();
      const id = +b.dataset.renameVid;
      const old = b.dataset.vname || '';
      const name = prompt(
        LANGNOW === 'zh' ? '修改柜型名称：' : 'Rename variant:', old);
      if (name === null) return;
      const clean = String(name).trim();
      if (!clean || clean === old) return;
      renameVariant(id, clean);
    };
  });

  // ---- 变体级删除 ----
  $$('#tree [data-del-vid]').forEach(b => {
    b.onclick = ev => {
      ev.stopPropagation();
      const id = +b.dataset.delVid;
      const nm = b.dataset.vname || '';
      if (!confirm((LANGNOW === 'zh' ? '删除这个柜型？'
                    : 'Delete this variant?') + `\n${nm}`)) return;
      delVariant(id);
    };
  });

  // ---- units 层级重命名 / 删除（用户诉求：
  //      「给我管理的功能按钮，可以删除，rename 这些 items」）
  //
  // units 层是**一组柜**（如「7套」下面有 3 个 model），不是单个柜，
  // 所以语义是**批量**：改名一次改这一组里所有柜，删除一次删这一组。
  // 这样用户在 units 层点一下就能管整组，不必逐个 model 点。
  $$('#tree [data-lu-rename]').forEach(b => {
    b.onclick = ev => {
      ev.stopPropagation();
      const n = +b.dataset.luRename;
      const ids = variantIdsOfUnits(n);
      if (!ids.length) { toast(t('lib.novariant'), 'err'); return; }
      const cur = `${n} ${t('lib.units')}`;
      const name = prompt(
        LANGNOW === 'zh'
          ? `修改「${cur}」下 ${ids.length} 个柜型的名称：`
          : `Rename all ${ids.length} variants under "${cur}":`,
        cur);
      if (name === null) return;
      const clean = String(name).trim();
      if (!clean || clean === cur) return;
      renameVariants(ids, clean);
    };
  });

  $$('#tree [data-lu-del]').forEach(b => {
    b.onclick = ev => {
      ev.stopPropagation();
      const n = +b.dataset.luDel;
      const ids = variantIdsOfUnits(n);
      if (!ids.length) { toast(t('lib.novariant'), 'err'); return; }
      if (!confirm((LANGNOW === 'zh'
          ? `删除「${n} ${t('lib.units')}」下的全部 ${ids.length} 个柜型？`
          : `Delete all ${ids.length} variants under "${n} units"?`)
          + `\n${ids.map(x => vLabel(x, x.variant_code)).join('\n')}`)) return;
      delVariants(ids);
    };
  });

  // ---- 建筑项目删除（演示用：从干净系统开始）
  // 与柜型库共用同一套确认框+刷新逻辑
  $$('#tree [data-del-bid]').forEach(b => {
    b.onclick = ev => {
      ev.stopPropagation();
      const id = +b.dataset.delBid;
      const nm = b.dataset.bname || '';
      if (!confirm((LANGNOW === 'zh'
          ? `删除建筑项目「${nm}」及其下全部图纸和解析结果？`
          : `Delete building "${nm}" and all its drawings and parse results?`))) return;
      delBuilding(id);
    };
  });

  // ---- 编辑模式下拉菜单（演示用）
  // 点击 ⋮ 按钮弹出操作菜单：删除 / 重命名 / 移动
  $$('#tree [data-emenu]').forEach(b => {
    b.onclick = ev => {
      ev.stopPropagation();
      // 关闭已有的菜单
      document.querySelectorAll('.treemenu').forEach(m => m.remove());
      const spec = b.dataset.emenu; // 格式: type:payload
      const [type, ...rest] = spec.split(':');
      const menu = document.createElement('div');
      menu.className = 'treemenu';
      const zh = LANGNOW === 'zh';
      const btn = (label, icon, danger, fn) => {
        const el = document.createElement('button');
        if (danger) el.className = 'danger';
        el.innerHTML = `${ic(icon)}<span>${label}</span>`;
        el.onclick = (e) => { e.stopPropagation(); menu.remove(); fn(); };
        menu.appendChild(el);
      };
      if (type === 'lu') {
        const n = +rest[0];
        btn(zh ? '重命名' : 'Rename', 'pencil', false, () => {
          const ids = variantIdsOfUnits(n);
          if (!ids.length) return;
          const cur = `${n} ${t('lib.units')}`;
          const name = prompt(zh ? `修改「${cur}」下 ${ids.length} 个柜型的名称：` : `Rename ${ids.length} variants:`, cur);
          if (name === null || !name.trim() || name.trim() === cur) return;
          renameVariants(ids, name.trim());
        });
        btn(zh ? '移动' : 'Move', 'more', false, () => {
          toast(zh ? '演示版暂不支持移动' : 'Move not supported in demo', 'err');
        });
        btn(zh ? '删除' : 'Delete', 'trash', true, () => {
          const ids = variantIdsOfUnits(n);
          if (!ids.length) return;
          if (!confirm(zh ? `删除「${n} ${t('lib.units')}」下的全部 ${ids.length} 个柜型？` : `Delete all ${ids.length} variants?`)) return;
          delVariants(ids);
        });
      } else if (type === 'vid') {
        const id = +rest[0], nm = rest.slice(1).join(':');
        btn(zh ? '重命名' : 'Rename', 'pencil', false, () => {
          const name = prompt(zh ? `重命名柜型「${nm}」：` : `Rename variant "${nm}":`, nm);
          if (name === null || !name.trim() || name.trim() === nm) return;
          renameVariants([{ id, variant_code: nm }], name.trim());
        });
        btn(zh ? '移动' : 'Move', 'more', false, () => {
          toast(zh ? '演示版暂不支持移动' : 'Move not supported in demo', 'err');
        });
        btn(zh ? '删除' : 'Delete', 'trash', true, () => {
          if (!confirm((zh ? '删除这个柜型？' : 'Delete this variant?') + `\n${nm}`)) return;
          delVariant(id);
        });
      } else if (type === 'bid') {
        const id = +rest[0], nm = rest.slice(1).join(':');
        btn(zh ? '删除项目' : 'Delete building', 'trash', true, () => {
          if (!confirm(zh ? `删除建筑项目「${nm}」及其下全部图纸和解析结果？` : `Delete building "${nm}"?`)) return;
          delBuilding(id);
        });
      } else if (type === 'dwg') {
        const fname = rest.join(':');
        btn(zh ? '重命名图纸' : 'Rename drawing', 'pencil', false, () => {
          const name = prompt(zh ? `重命名图纸「${fname}」：` : `Rename drawing "${fname}":`, fname);
          if (name === null || !name.trim() || name.trim() === fname) return;
          toast(zh ? '重命名图纸功能开发中' : 'Rename drawing coming soon', 'err');
        });
        btn(zh ? '删除图纸' : 'Delete drawing', 'trash', true, () => {
          // fname 可能是 "DWG" fallback，要按 libraryGroups 的逻辑匹配：
          // v.source_name || v.dwg_name || t('tree.library')
          const libName = t('tree.library');
          const vs = S.variants.filter(v => {
            const vf = v.source_name || v.dwg_name || libName;
            // rootName 为 "DWG" 时，对应的是空文件名的变体
            if (fname === 'DWG') return !v.source_name && !v.dwg_name;
            return vf === fname;
          });
          if (!vs.length) { toast(zh ? '没有找到该图纸的柜型' : 'No variants found', 'err'); return; }
          if (!confirm(zh ? `删除图纸「${fname}」下的全部 ${vs.length} 个柜型？` : `Delete all ${vs.length} variants from "${fname}"?`)) return;
          delVariants(vs);
        });
      }
      // 移动功能：演示版暂留空
      // .treedrop 本身已经是 absolute 定位（CSS），不要覆盖成 relative
      b.parentElement.appendChild(menu);
      // 点别处关闭
      const close = (e) => {
        if (!menu.contains(e.target)) { menu.remove(); document.removeEventListener('click', close); }
      };
      setTimeout(() => document.addEventListener('click', close), 0);
    };
  });
}

/** 某个 units 数下所有变体记录（units 层批量操作要用）。
 *
 *  必须从 ``S.variants`` 现算，不能缓存 —— 重命名/删除后列表会变，
 *  缓存会导致第二次操作作用在已不存在的记录上。
 */
function variantIdsOfUnits(nUnits) {
  const out = [];
  for (const g of libraryGroups()) {
    for (const u of g.units) {
      if (u.n !== nUnits) continue;
      for (const lb of u.labels) out.push(lb.v);
    }
  }
  return out;
}

/** 批量重命名。串行执行并逐个回报成功数 ——
 *  一次性 Promise.all 在部分失败时会静默吞掉一半，用户不知道结果。 */
async function renameVariants(vs, name) {
  let ok = 0, bad = 0;
  for (const v of vs) {
    try { await api(`/variants/${v.id}/name`, { method: 'PATCH', body: { name } }); ok++; }
    catch (e) { bad++; }
  }
  toast((LANGNOW === 'zh'
      ? `已重命名 ${ok} 个柜型`
      : `Renamed ${ok} variants`)
    + (bad ? `（${bad} 个失败）` : ''), bad ? 'err' : 'ok');
  await loadVariants(); renderTree(); refreshOpenGroups();
}

/** 批量删除。同样串行，失败项如实报数。 */
async function delVariants(vs) {
  let ok = 0, bad = 0;
  for (const v of vs) {
    try { await api(`/variants/${v.id}`, { method: 'DELETE' }); ok++; }
    catch (e) { bad++; }
  }
  toast((LANGNOW === 'zh' ? `已删除 ${ok} 个柜型` : `Deleted ${ok} variants`)
    + (bad ? `（${bad} 个失败）` : ''), bad ? 'err' : 'ok');
  await loadVariants();
  // 如果删空了，刷新浏览器回到干净状态（与建筑删除一致）
  if (!S.variants.some(v => v.source === 'dwg')) {
    setTimeout(() => location.reload(), 600);
    return;
  }
  renderTree(); refreshOpenGroups();
}

/** 删除建筑项目（含图纸、版本、解析任务级联）。与柜型删除共用确认框模式。 */
async function delBuilding(id) {
  try {
    const r = await api(`/buildings/${id}`, { method: 'DELETE' });
    toast((LANGNOW === 'zh' ? `已删除项目「${r.name}」` : `Deleted building "${r.name}"`), 'ok');
  } catch (e) {
    toast((LANGNOW === 'zh' ? '删除失败：' : 'Delete failed: ') + (e.message || e), 'err');
    return;
  }
  // 用户要求：删除后刷新浏览器，确保左右中三栏都回到干净状态
  setTimeout(() => location.reload(), 600);
}

/** 重渲染后把右侧内容刷回来。
 *
 *  批量操作会改变当前选中项指向的记录，所以要重新加载一次 ——
 *  否则右边可能还显示着刚被删掉的那个柜型。
 *  原来 renameVariant 里是内联写的 `showUnitsGroup(S.treeSel, true)`，
 *  批量场景下选中项可能已不存在，必须做存在性检查。 */
function refreshOpenGroups() {
  const key = S.treeSel;
  if (!key) return;
  // 选中项可能已被删除 —— 校验它还在不在
  if (key.startsWith('u')) {
    const n = +key.slice(1);
    if (!variantIdsOfUnits(n).length) { S.treeSel = null; renderTree(); return; }
  } else if (key.includes('@')) {
    const id = +key.split('@')[1];
    if (!(S.variants || []).some(v => v.id === id)) { S.treeSel = null; renderTree(); return; }
  }
  showUnitsGroup(key, true);
}

/** 变体改名 —— 持久化到后端。
 *
 *  走 ``PATCH /api/variants/{id}/name`` 而不是通用的
 *  ``PATCH /api/variants/{id}``：后者会用 rows×cols 覆写套数，
 *  而网格容量不等于套数（13 Units 的柜网格 5×4=20，只填 13 套），
 *  走它改个名字会把套数一起改错。
 */
async function renameVariant(id, name) {
  try {
    await api(`/variants/${id}/name`, { method: 'PATCH', body: { name } });
    toast((LANGNOW === 'zh' ? '已重命名为 ' : 'Renamed to ') + name, 'ok');
    await loadVariants();
    renderTree();
    if (S.treeSel) showUnitsGroup(S.treeSel, true);
  } catch (e) { toast('rename failed: ' + e.message, 'err'); }
}

/** 删单个变体 */
async function delVariant(id) {
  try {
    await api(`/variants/${id}`, { method: 'DELETE' });
    toast(t('lib.deldone'), 'ok');
    await loadVariants();
    // 如果删空了，刷新浏览器回到干净状态
    if (!S.variants.some(v => v.source === 'dwg')) {
      setTimeout(() => location.reload(), 600);
      return;
    }
    // 删掉的正好是当前选中项 -> 落到同组下一个，组空了就清选中
    if (String(S.treeSel || '').endsWith('@' + id)) {
      const g = libraryGroups();
      let next = null;
      for (const f of g) for (const u of f.units) {
        if (u.labels.length) {
          const hit = u.labels.find(x => String(x.v.id) === String(id));
          if (hit) {
            const i = u.labels.indexOf(hit);
            const nx = u.labels[i + 1] || u.labels[i - 1];
            next = u.labels.length === 1 ? u.key : u.key + '@' + nx.v.id;
          }
        }
      }
      S.treeSel = next;
    }
    renderTree();
    renderHub();
    if (S.treeSel) showUnitsGroup(S.treeSel, true);
  } catch (e) { toast(t('lib.delfail') + ': ' + e.message, 'err'); }
}

/** 按来源图纸批量删（文件节点上的垃圾桶）*/
async function delVariantsBySource(fileKey) {
  const ids = S.variants
    .filter(v => (v.source_name || v.dwg_name) === fileKey)
    .map(v => v.id);
  if (!ids.length) { toast(t('lib.delfail'), 'err'); return; }
  try {
    const r = await api('/variants/delete', { method: 'POST', body: { ids } });
    toast(`${t('lib.deldone')} ${r.deleted ?? ids.length}`, 'ok');
    S.treeSel = null;
    await loadVariants();
    renderTree();
    renderHub();
  } catch (e) { toast(t('lib.delfail') + ': ' + e.message, 'err'); }
}
